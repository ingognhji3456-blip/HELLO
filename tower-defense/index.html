<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100c1a">
<title>픽셀 타워 디펜스</title>
<style>
/* Layout: HUD on top, the 20x12-tile field in the middle, the tower bar below.
   The script sets --p (one UI pixel) and --fs (font size, a multiple of 11 so the pixel font stays sharp)
   and sizes the canvas to the space that is left. Single dark look by choice. */
:root {
  --p: 2px;
  --fs: 11px;
  --bg: #100c1a;
  --panel: #241a37;
  --panel2: #33264d;
  --edge: #0b0812;
  --hi: #5a4882;
  --lo: #1a1329;
  --text: #f3ead7;
  --dim: #a99bc2;
  --gold: #ffd34a;
  --red: #ff6464;
  --green: #84e070;
  --blue: #74ccff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 40%, #21183a 0%, #120d1f 60%, var(--bg) 100%);
  background-color: var(--bg);
  color: var(--text);
  font: var(--fs)/1.3 "TDPixel", ui-monospace, monospace;
  -webkit-font-smoothing: none;
  display: grid;
  place-items: center;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
img { image-rendering: pixelated; image-rendering: crisp-edges; }

/* Pixel frame: four hard 1px shadows give notched corners instead of rounding. */
.px {
  box-shadow:
    0 calc(var(--p) * -1) 0 var(--edge), 0 var(--p) 0 var(--edge),
    calc(var(--p) * -1) 0 0 var(--edge), var(--p) 0 0 var(--edge);
}
#app { display: flex; flex-direction: column; align-items: stretch; max-width: 100vw; }
#hud, #bar { background: var(--panel); position: relative; z-index: 1; }
#hud {
  display: flex; align-items: center; gap: calc(var(--p) * 5);
  padding: calc(var(--p) * 3) calc(var(--p) * 4);
  border-bottom: var(--p) solid var(--edge);
  white-space: nowrap;
}
.stat { display: flex; align-items: center; gap: calc(var(--p) * 2); }
.stat b { font-weight: normal; min-width: 2.2em; }
#lives { color: #ff8a8a; }
#gold { color: var(--gold); }
.grow { flex: 1; }
.next { display: flex; align-items: center; gap: calc(var(--p) * 3); color: var(--dim); overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: var(--p); color: var(--text); }
.chip.air { color: var(--blue); }
.chip.boss { color: var(--red); }
.narrow .next { display: none; }
.narrow #hud { gap: calc(var(--p) * 3); }

.btn {
  background: var(--panel2);
  padding: calc(var(--p) * 2) calc(var(--p) * 4);
  box-shadow:
    0 calc(var(--p) * -1) 0 var(--edge), 0 var(--p) 0 var(--edge),
    calc(var(--p) * -1) 0 0 var(--edge), var(--p) 0 0 var(--edge),
    inset 0 calc(var(--p) * -2) 0 var(--lo), inset 0 var(--p) 0 var(--hi);
  margin: var(--p);
}
.btn:active:not(:disabled) { transform: translateY(var(--p)); }
.btn:focus-visible, .card:focus-visible, .mapcard:focus-visible { outline: var(--p) solid var(--gold); outline-offset: var(--p); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.sq { min-width: 2.6em; text-align: center; padding-left: calc(var(--p) * 2); padding-right: calc(var(--p) * 2); }
.btn.off { color: var(--dim); text-decoration: line-through; }
.btn.go { background: #2d7a3c; box-shadow:
    0 calc(var(--p) * -1) 0 var(--edge), 0 var(--p) 0 var(--edge),
    calc(var(--p) * -1) 0 0 var(--edge), var(--p) 0 0 var(--edge),
    inset 0 calc(var(--p) * -2) 0 #1c5527, inset 0 var(--p) 0 #5fbf62; }
.btn.warn { background: #8a3434; box-shadow:
    0 calc(var(--p) * -1) 0 var(--edge), 0 var(--p) 0 var(--edge),
    calc(var(--p) * -1) 0 0 var(--edge), var(--p) 0 0 var(--edge),
    inset 0 calc(var(--p) * -2) 0 #5e2020, inset 0 var(--p) 0 #c86060; }
@media (hover: hover) { .btn:hover:not(:disabled), .card:hover { filter: brightness(1.15); } }

#stage { display: flex; justify-content: center; background: #0d0a14; }
#field { position: relative; overflow: hidden; }
#cv {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  outline: none;
}

#bar {
  display: flex; align-items: stretch; gap: calc(var(--p) * 3);
  padding: calc(var(--p) * 3) calc(var(--p) * 4);
  border-top: var(--p) solid var(--edge);
}
#shop { display: flex; gap: calc(var(--p) * 3); flex: 1; min-width: 0; }
.card {
  position: relative; flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; gap: calc(var(--p) * 3);
  padding: calc(var(--p) * 2) calc(var(--p) * 3);
  background: var(--panel2);
  box-shadow:
    0 calc(var(--p) * -1) 0 var(--edge), 0 var(--p) 0 var(--edge),
    calc(var(--p) * -1) 0 0 var(--edge), var(--p) 0 0 var(--edge),
    inset 0 calc(var(--p) * -2) 0 var(--lo), inset 0 var(--p) 0 var(--hi);
  margin: var(--p);
  text-align: left;
}
.card.sel { background: #5a4520; box-shadow:
    0 calc(var(--p) * -1) 0 var(--gold), 0 var(--p) 0 var(--gold),
    calc(var(--p) * -1) 0 0 var(--gold), var(--p) 0 0 var(--gold),
    inset 0 calc(var(--p) * -2) 0 #3a2c12, inset 0 var(--p) 0 #9a7a3a; }
.card.poor { opacity: 0.55; }
.card.poor .ccost { color: var(--red); }
.cbody { display: flex; flex-direction: column; min-width: 0; }
.cname { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.ccost { display: flex; align-items: center; gap: var(--p); color: var(--gold); }
.key { position: absolute; top: var(--p); right: calc(var(--p) * 2); color: var(--dim); }
.narrow .key { display: none; }
.narrow .card { flex-direction: column; gap: var(--p); justify-content: center; text-align: center; padding: var(--p); }
.narrow .cbody { align-items: center; }

#bWave { display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 7.5em; white-space: nowrap; }
#bWave .sub { color: #d6f5cf; }
#bWave:disabled .sub { color: var(--dim); }

#info { flex: 1; display: flex; align-items: center; gap: calc(var(--p) * 2); min-width: 0; }
#info .ticon { margin: 0 calc(var(--p) * 2); }
#info .ibody { flex: 1; min-width: 0; display: flex; flex-direction: column; white-space: nowrap; overflow: hidden; }
#info .lv { color: var(--gold); }
.btn.two { display: flex; flex-direction: column; align-items: center; justify-content: center; white-space: nowrap; align-self: stretch; padding-left: calc(var(--p) * 3); padding-right: calc(var(--p) * 3); }
.btn.two .sub { color: var(--gold); }
#bTgt .sub { color: var(--text); }
.narrow #info .ibody { display: none; }
.narrow #info .ticon { margin: 0; }
#tip .up { color: var(--green); }

/* Overlays on the field */
#toast {
  position: absolute; left: 50%; top: 14%; transform: translateX(-50%);
  padding: calc(var(--p) * 3) calc(var(--p) * 6);
  background: rgba(16, 10, 26, 0.88);
  white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity 0.25s;
}
#toast.show { opacity: 1; }
#toast.boss { color: #ff8a8a; }
#toast.good { color: var(--gold); }
#tip {
  position: absolute; left: calc(var(--p) * 4); bottom: calc(var(--p) * 4); max-width: min(70%, 34em);
  padding: calc(var(--p) * 2) calc(var(--p) * 4);
  background: rgba(16, 10, 26, 0.85);
  pointer-events: none;
}
#tip:empty { display: none; }
#tip .t { color: var(--gold); }
#tip .d { color: var(--dim); }
#bossbar {
  position: absolute; left: 50%; top: calc(var(--p) * 4); transform: translateX(-50%);
  width: min(60%, 40em); display: flex; align-items: center; gap: calc(var(--p) * 3);
  padding: calc(var(--p) * 2) calc(var(--p) * 4);
  background: rgba(16, 10, 26, 0.85); pointer-events: none;
}
#bossName { color: #ff8a8a; white-space: nowrap; }
#bossbar .track { flex: 1; height: calc(var(--p) * 4); background: #3a1620; box-shadow: 0 0 0 var(--p) var(--edge); }
#bossFill { height: 100%; width: 100%; background: linear-gradient(#ff7a6a, #c8323a); }

#ov {
  position: fixed; inset: 0; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10, 6, 18, 0.62);
  padding: calc(var(--p) * 4);
}
.panel {
  background: var(--panel);
  padding: calc(var(--p) * 6) calc(var(--p) * 8);
  max-width: 100%; max-height: 100%; overflow: auto;
  text-align: center;
  scrollbar-width: thin;
}
.panel h1 { font-size: calc(var(--fs) * 2); font-weight: normal; margin: 0 0 calc(var(--p) * 2); color: var(--gold); text-shadow: var(--p) var(--p) 0 #6a3a10; }
.panel h2 { font-size: calc(var(--fs) * 2); font-weight: normal; margin: 0 0 calc(var(--p) * 3); }
.panel p { margin: calc(var(--p) * 2) 0; }
.panel .dim { color: var(--dim); }
.panel .row { display: flex; gap: calc(var(--p) * 3); justify-content: center; flex-wrap: wrap; margin-top: calc(var(--p) * 4); }
.maps { display: flex; gap: calc(var(--p) * 5); justify-content: center; flex-wrap: wrap; margin-top: calc(var(--p) * 4); }
.mapcard {
  width: calc(var(--p) * 92);
  display: flex; flex-direction: column; gap: var(--p); align-items: stretch;
  background: var(--panel2); padding: calc(var(--p) * 3);
  box-shadow:
    0 calc(var(--p) * -1) 0 var(--edge), 0 var(--p) 0 var(--edge),
    calc(var(--p) * -1) 0 0 var(--edge), var(--p) 0 0 var(--edge),
    inset 0 calc(var(--p) * -2) 0 var(--lo), inset 0 var(--p) 0 var(--hi);
  margin: var(--p);
}
.mapcard img { width: 100%; aspect-ratio: 5 / 3; display: block; box-shadow: 0 0 0 var(--p) var(--edge); margin-bottom: calc(var(--p) * 2); }
.mtext { display: flex; flex-direction: column; gap: var(--p); }
.narrow .panel { padding: calc(var(--p) * 4); }
.narrow .maps { flex-direction: column; align-items: stretch; gap: calc(var(--p) * 3); }
.narrow .mapcard { width: auto; flex-direction: row; align-items: center; gap: calc(var(--p) * 4); text-align: left; }
.narrow .mapcard img { width: 40%; flex: none; margin: 0; }
.mapcard .stars { color: var(--gold); }
.mapcard .best { color: var(--dim); }
@media (hover: hover) { .mapcard:hover { filter: brightness(1.15); } }
.help { text-align: left; max-width: 46em; }
.help h2 { text-align: center; }
.help ul { margin: calc(var(--p) * 2) 0; padding-left: 1.4em; }
.help li { margin: var(--p) 0; }
.help .grid { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: calc(var(--p) * 2) calc(var(--p) * 4); align-items: center; margin: calc(var(--p) * 3) 0; }
.narrow .help .grid { grid-template-columns: auto 1fr; }
.help .grid img { justify-self: center; }
.help .t { color: var(--gold); }
.big-stars { font-size: calc(var(--fs) * 2); color: var(--gold); letter-spacing: 0.2em; }
.credit { color: var(--dim); margin-top: calc(var(--p) * 4); }
</style>

<script>
(() => {
"use strict";

/* ================= Basics ================= */
const T = 16, COLS = 20, ROWS = 12, W = COLS * T, H = ROWS * T, TAU = Math.PI * 2;
const OUT = "#1b1325";
const TOTAL = 20;        // waves to win
const BETWEEN = 15;      // seconds between waves
const SELL = 0.7;        // refund share
const hpScale = (w) => 1 + 0.1 * (w - 1) + 0.0075 * (w - 1) * (w - 1);
const rewardScale = (w) => 1 + 0.03 * (w - 1);

const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const fmt = (n) => Math.floor(n).toLocaleString("ko-KR");
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ================= Save ================= */
const SAVE_KEY = "pixelTD.v1";
const save = { best: {}, sound: true };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && typeof s === "object") {
    if (s.best && typeof s.best === "object") save.best = s.best;
    if (typeof s.sound === "boolean") save.sound = s.sound;
  }
} catch (e) { /* storage unavailable */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } }

/* ================= Sound (synthesized) ================= */
const Sound = (() => {
  let ac = null, master = null, noiseBuf = null;
  const last = {};
  function ensure() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.32;
    master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, freq, type = "lowpass", delay = 0) {
    const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf;
    f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  const FX = {
    arrow() { tone("square", 1300, 520, 0.05, 0.035); },
    cannon() { noise(0.16, 0.2, 700); tone("sine", 150, 50, 0.16, 0.25); },
    boom() { noise(0.32, 0.22, 900); tone("sine", 95, 35, 0.28, 0.2); },
    frost() { tone("triangle", 1500, 2400, 0.1, 0.06); tone("sine", 2600, 2000, 0.14, 0.03, 0.03); },
    zap() { noise(0.1, 0.14, 3000, "highpass"); tone("sawtooth", 900, 200, 0.09, 0.045); },
    die() { tone("square", 520, 130, 0.08, 0.04); },
    build() { tone("square", 330, 330, 0.07, 0.07); tone("square", 494, 494, 0.1, 0.07, 0.07); },
    upgrade() { [523, 659, 784, 1047].forEach((f, i) => tone("square", f, f, 0.08, 0.06, i * 0.06)); },
    sell() { tone("square", 988, 988, 0.06, 0.05); tone("square", 1319, 1319, 0.12, 0.05, 0.06); },
    leak() { tone("sawtooth", 170, 70, 0.32, 0.14); },
    wave() { tone("sawtooth", 220, 220, 0.16, 0.07); tone("sawtooth", 330, 330, 0.28, 0.07, 0.15); },
    boss() { tone("sawtooth", 110, 110, 0.5, 0.12); tone("sawtooth", 104, 104, 0.6, 0.1, 0.45); noise(0.8, 0.08, 300, "lowpass", 0.1); },
    bigboom() { noise(0.9, 0.3, 500); tone("sine", 80, 25, 0.8, 0.3); },
    split() { tone("sine", 300, 900, 0.15, 0.08); tone("sine", 450, 1200, 0.15, 0.06, 0.08); },
    deny() { tone("square", 180, 150, 0.12, 0.06); },
    click() { tone("square", 660, 660, 0.03, 0.035); },
    bonus() { [784, 988, 1175].forEach((f, i) => tone("square", f, f, 0.07, 0.05, i * 0.05)); },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone("square", f, f, 0.14, 0.07, i * 0.12)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone("triangle", f, f * 0.98, 0.25, 0.1, i * 0.2)); },
  };
  return {
    play(name) {
      if (!save.sound || !ac) return;
      const now = performance.now();
      if (now - (last[name] || 0) < 50) return;
      last[name] = now;
      try { FX[name](); } catch (e) { /* ignore */ }
    },
    unlock() { if (save.sound) ensure(); },
  };
})();

/* ================= Pixel helpers ================= */
function disk(g, cx, cy, r, col) {
  cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  g.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) {
    const dx = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)));
    g.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
  }
}
function oval(g, cx, cy, rx, ry, col) {
  cx = Math.round(cx); cy = Math.round(cy);
  g.fillStyle = col;
  for (let dy = -ry; dy <= ry; dy++) {
    const dx = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
    g.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
  }
}
function ring(g, cx, cy, r, col, dash = 0, phase = 0) {
  g.fillStyle = col;
  const n = Math.max(8, Math.round(TAU * r));
  for (let i = 0; i < n; i++) {
    if (dash && (i + phase) % (dash * 2) >= dash) continue;
    const a = (i / n) * TAU;
    g.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1);
  }
}
function line(g, x0, y0, x1, y1, col, w = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  g.fillStyle = col;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, o = (w - 1) >> 1;
  let err = dx + dy;

    g.fillRect(x0 - o, y0 - o, w, w);
    if (x0 === x1 && y0 === y1) break;

/* 3x5 digits for the little gold popups */
const GL = {
  "0": "111101101101111", "1": "010110010010111", "2": "111001111100111", "3": "111001111001111",
  "4": "101101111001001", "5": "111100111001111", "6": "111100111101111", "7": "111001010010010",
  "8": "111101111101111", "9": "111101111001111", "+": "000010111010000", "-": "000000111000000",
};
function ptext(g, s, x, y, col) {
  s = String(s);
  x = Math.round(x - (s.length * 4 - 1) / 2); y = Math.round(y);
  for (let pass = 0; pass < 2; pass++) {
    g.fillStyle = pass ? col : OUT;
    for (let i = 0; i < s.length; i++) {
      const gl = GL[s[i]];
      if (!gl) continue;
      for (let p = 0; p < 15; p++) {
        if (gl[p] !== "1") continue;
        g.fillRect(x + i * 4 + (p % 3) + (pass ? 0 : 1), y + ((p / 3) | 0) + (pass ? 0 : 1), 1, 1);
      }
    }
  }
}

function mk(rows, pal) {
  const h = rows.length, w = rows.reduce((m, r) => Math.max(m, r.length), 0);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < rows[y].length; x++) {
      const col = rows[y][x] === "k" ? pal.k || OUT : pal[rows[y][x]];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}
function tint(src, col, a) {
  const c = document.createElement("canvas");
  c.width = src.width; c.height = src.height;
  const g = c.getContext("2d");
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = "source-atop";
  g.globalAlpha = a;
  g.fillStyle = col;
  g.fillRect(0, 0, c.width, c.height);
  return c;
}
function flipV(src) {
  const c = document.createElement("canvas");
  c.width = src.width; c.height = src.height;
  const g = c.getContext("2d");
  g.translate(0, c.height); g.scale(1, -1);
  g.drawImage(src, 0, 0);
  return c;
}
function canvasOf(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  draw(g);
  return c;
}

  if (n <= WAVES.length) return WAVES[n - 1];
  // Endless: a seeded mix that grows each wave, with a boss every 10th wave.
  const r = rng(n * 7919), k = n - WAVES.length, out = [];
  const pool = ["slime", "goblin", "bat", "orc"];
  for (let i = 0; i < 3; i++) {
    const type = pool[(r() * pool.length) | 0];
    const base = type === "orc" ? 10 : 16;
    out.push([type, Math.round(base + k * 1.5), type === "orc" ? 0.6 : 0.35, i * 3]);
  }
  out.push(["golem", 2 + Math.floor(k / 2), 2.2, 4]);
  if (n % 10 === 0) out.push([n % 20 === 0 ? "dragon" : "king", 1 + Math.floor(k / 20), 3, 8]);
  return out;
}

function buildMap(def) {
  const grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  const segs = [];
  let len = 0;
  for (let i = 0; i < def.wps.length - 1; i++) {
    const [c0, r0] = def.wps[i], [c1, r1] = def.wps[i + 1];
    const ax = c0 * T + T / 2, ay = r0 * T + T / 2, bx = c1 * T + T / 2, by = r1 * T + T / 2;
    const l = Math.hypot(bx - ax, by - ay);
    segs.push({ ax, ay, dx: (bx - ax) / l, dy: (by - ay) / l, l, s: len });
    len += l;
    let c = c0, r = r0;
    const sc = Math.sign(c1 - c0), sr = Math.sign(r1 - r0);
    for (;;) {
      if (c >= 0 && c < COLS && r >= 0 && r < ROWS) grid[r][c] = 1;
      if (c === c1 && r === r1) break;
      c += sc; r += sr;
    }
  }
  const rs = def.wps[0][1], re = def.wps[def.wps.length - 1][1];
  for (const [c, r] of [[0, rs - 1], [0, rs + 1], [COLS - 1, re - 1], [COLS - 1, re + 1]]) {
    if (r >= 0 && r < ROWS && grid[r][c] === 0) grid[r][c] = 3;
  }
  // Blocking scenery only on tiles that do not touch the path, so the good spots stay open.
  const rnd = rng(def.seed * 31 + 7), decos = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] !== 0) continue;
      let near = false;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && grid[rr][cc] === 1) near = true;
      }
      if (near || rnd() > 0.16) continue;
      grid[r][c] = 2;
      decos.push({ c, r, kind: rnd() < 0.72 ? def.deco[0] : def.deco[1] });
    }
  }
  const md = { def, grid, segs, len, rs, re, decos };
  md.bg = renderMap(md);
  return md;
}

function posAt(md, d, out) {
  const S = md.segs;
  let i = 0;
  while (i < S.length - 1 && d > S[i].s + S[i].l) i++;
  const s = S[i], t = clamp(d - s.s, 0, s.l);
  out.x = s.ax + s.dx * t; out.y = s.ay + s.dy * t; out.dx = s.dx; out.dy = s.dy;
  return out;
}

function renderMap(md) {
  const P = md.def.pal, rnd = rng(md.def.seed);
  const isPath = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS && md.grid[r][c] === 1;
  return canvasOf(W, H, (g) => {
    rect(g, 0, 0, W, H, P.g0);
    // soft patches of lighter and darker ground
    for (let i = 0; i < 34; i++) {
      const cx = rnd() * W, cy = rnd() * H, r = 4 + rnd() * 10;
      oval(g, cx, cy, Math.round(r * 1.4), Math.round(r * 0.8), rnd() < 0.5 ? P.g1 : P.g2);
    }
    for (let i = 0; i < 1100; i++) rect(g, rnd() * W, rnd() * H, 1, 1, P.gs[(rnd() * P.gs.length) | 0]);
    for (let i = 0; i < 90; i++) {
      const x = Math.round(rnd() * W), y = Math.round(rnd() * H);
      rect(g, x, y, 1, 2, P.tuft); rect(g, x - 1, y + 1, 1, 1, P.tuft); rect(g, x + 1, y + 1, 1, 1, P.tuft);
      rect(g, x, y + 2, 1, 1, P.tuftD);
    }
    // path
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!isPath(c, r)) continue;
      rect(g, c * T, r * T, T, T, P.p0);
      for (let i = 0; i < 14; i++) rect(g, c * T + rnd() * T, r * T + rnd() * T, 1, 1, rnd() < 0.5 ? P.p1 : P.p2);
      if (rnd() < 0.6) { const x = c * T + 2 + rnd() * 11, y = r * T + 2 + rnd() * 11; rect(g, x, y, 2, 1, P.p2); rect(g, x, y + 1, 2, 1, P.p1); }
    }
    // ragged path edges
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!isPath(c, r)) continue;
      const x0 = c * T, y0 = r * T;
      const sides = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      for (const [dc, dr] of sides) {
        const nc = c + dc, nr = r + dr;
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS || isPath(nc, nr)) continue;
        for (let i = 0; i < T; i++) {
          const deep = rnd() < 0.3 ? 2 : 1;
          for (let k = 0; k < deep; k++) {
            const col = k === deep - 1 ? P.pe : P.g0;
            let x, y;
            if (dc === -1) { x = x0 + k; y = y0 + i; }
            else if (dc === 1) { x = x0 + T - 1 - k; y = y0 + i; }
            else if (dr === -1) { x = x0 + i; y = y0 + k; }
            else { x = x0 + i; y = y0 + T - 1 - k; }
            rect(g, x, y, 1, 1, col);
          }
        }
      }
    }
    // little non-blocking details (flowers, pebbles, ice)
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (md.grid[r][c] !== 0 || rnd() > 0.28) continue;
      const x = c * T + 3 + rnd() * 10, y = r * T + 3 + rnd() * 10, col = P.small[(rnd() * P.small.length) | 0];
      if (md.def.id === "meadow") {
        rect(g, x, y - 1, 1, 1, col); rect(g, x - 1, y, 1, 1, col); rect(g, x + 1, y, 1, 1, col); rect(g, x, y + 1, 1, 1, col);
        rect(g, x, y, 1, 1, "#ffe066");
      } else {
        rect(g, x, y, 2, 1, col); rect(g, x, y + 1, 2, 1, "rgba(0,0,0,0.18)");
      }
    }
    for (const d of md.decos) {
      const spr = mk(R[d.kind], P[d.kind]);
      const x = d.c * T + Math.round((T - spr.width) / 2), y = d.r * T + T - spr.height - 1;
      oval(g, d.c * T + 8, d.r * T + T - 2, Math.round(spr.width / 2), 2, "rgba(0,0,0,0.22)");
      g.drawImage(spr, x, y);
    }
  });
}

/* Cave at the left edge where monsters come out */
function drawCave(g, r, t) {
  const y0 = r * T, cy = y0 + 8;
  oval(g, 0, cy + 13, 13, 3, "rgba(0,0,0,0.22)");
  oval(g, 0, cy, 14, 17, OUT);
  oval(g, 0, cy, 13, 16, "#77697e");
  oval(g, -2, cy - 6, 10, 9, "#93859a");
  oval(g, -3, cy - 9, 6, 4, "#ab9fb2");
  oval(g, 2, cy + 10, 10, 5, "#5c5064");
  rect(g, 9, cy - 9, 2, 1, "#5c5064"); rect(g, 6, cy + 13, 3, 1, "#4a4052"); rect(g, 10, cy + 4, 1, 2, "#5c5064");
  // tunnel mouth over the start of the path
  oval(g, 0, cy + 1, 10, 8, OUT);
  oval(g, 0, cy + 1, 9, 7, "#120a18");
  oval(g, -1, cy + 2, 6, 5, "#06030a");
  const blink = Math.sin(t * 1.7) > 0.93;
  if (!blink) { rect(g, 3, cy, 1, 1, "#ff3a4a"); rect(g, 6, cy, 1, 1, "#ff3a4a"); }
  const glow = 0.2 + 0.15 * Math.sin(t * 3);
  ring(g, 0, cy + 1, 9, "rgba(170,90,255," + glow.toFixed(2) + ")");
}

/* Castle on the right edge; monsters that reach its gate cost lives */
function drawCastle(g, r, t, hurt) {
  const x = (COLS - 1) * T, top = (r - 1) * T - 6, bot = (r + 2) * T - 1;
  const st = hurt > 0 ? "#c88080" : "#a8a4b8", st2 = hurt > 0 ? "#a06060" : "#85819a", st3 = "#cfcbe0";
  oval(g, x + 8, bot - 1, 9, 2, "rgba(0,0,0,0.25)");
  rect(g, x, top + 4, 16, bot - top - 4, OUT);
  rect(g, x + 1, top + 5, 15, bot - top - 6, st);
  // bricks
  for (let y = top + 8; y < bot - 1; y += 4) {
    rect(g, x + 1, y, 15, 1, st2);
    for (let bx = x + ((y >> 2) % 2 ? 3 : 6); bx < x + 15; bx += 6) rect(g, bx, y - 3, 1, 3, st2);
  }
  // battlements
  for (let i = 0; i < 4; i++) { rect(g, x + i * 4, top, 3, 5, OUT); rect(g, x + i * 4 + 1, top + 1, 2, 4, st3); }
  rect(g, x + 1, top + 5, 15, 1, st3);
  // windows
  rect(g, x + 6, top + 10, 3, 4, OUT); rect(g, x + 7, top + 11, 1, 2, "#ffd36a");
  rect(g, x + 6, bot - 9, 3, 4, OUT); rect(g, x + 7, bot - 8, 1, 2, "#ffd36a");
  // gate facing the path
  const gy = r * T + 2;
  rect(g, x, gy + 2, 10, 13, OUT);
  rect(g, x + 1, gy + 1, 8, 1, OUT);
  rect(g, x, gy + 3, 9, 12, "#140c1c");
  for (let i = 1; i < 9; i += 2) rect(g, x + i, gy + 3, 1, 12, "#5a4632");
  for (let j = gy + 5; j < gy + 15; j += 3) rect(g, x, j, 9, 1, "#5a4632");
  // flag
  const fx = x + 9, fy = top - 9;
  rect(g, fx, fy, 1, 10, OUT);
  const wave = Math.sin(t * 6) > 0 ? 1 : 0;
  rect(g, fx + 1, fy, 6, 4, "#e84a4a");
  rect(g, fx + 1, fy + 3, 6, 1, "#a82a3a");
  rect(g, fx + 6, fy + wave, 1, 3, "#e84a4a");
  rect(g, fx + 2, fy + 1, 2, 1, "#ffd34a");
}

function canBuild(c, r) {
  return G.md && c >= 0 && c < COLS && r >= 0 && r < ROWS && G.md.grid[r][c] === 0 && !G.tmap[r][c];
}

/* ================= Waves ================= */
function earlyBonus() {
  const secs = G.phase === "between" ? Math.ceil(G.countdown) : BETWEEN;
  return secs * (1 + Math.floor(G.wave / 5));
}
function canCallWave() {
  if (G.scene !== "play" || G.phase === "over" || G.phase === "won") return false;
  if (G.spawners.length) return false;
  if (!G.endless && G.wave >= TOTAL) return false;
  return true;
}
function callWave() {
  if (!canCallWave()) return;
  if (G.phase !== "build") {
    const b = earlyBonus();
    if (b > 0) {
      G.gold += b;
      popText(W / 2, 20, "+" + b, "#ffd34a");
      Sound.play("bonus");
    }
  }
  startWave();
}
function startWave() {
  const n = G.wave + 1;
  G.wave = n;
  G.phase = "wave";
  G.waveCleared = false;
  for (const [type, count, gap, delay] of waveDef(n)) G.spawners.push({ type, left: count, gap, t: delay, wave: n });
  const types = new Set(waveDef(n).map((g) => g[0]));
  const bossType = [...types].find((k) => ENEMY[k].boss);
  if (bossType) { toast("보스 출현! " + ENEMY[bossType].name, "boss"); Sound.play("boss"); }
  else if (types.has("bat") && !G.seenBat) { G.seenBat = true; toast("하늘을 나는 박쥐! 대포탑은 못 맞혀요", "boss"); Sound.play("wave"); }
  else if (types.has("orc") && !G.seenOrc) { G.seenOrc = true; toast("갑옷 입은 오크! 마법 탑이 잘 통해요", "boss"); Sound.play("wave"); }
  else { toast("웨이브 " + n, ""); Sound.play("wave"); }
  ui.next = -1;
}

/* ================= Entities ================= */
function spawnEnemy(type, wave, dist = 0, small = false) {
  const d = ENEMY[type];
  let hp = Math.round(d.hp * hpScale(wave) * G.md.def.hpMul);
  if (small) hp = Math.round(hp * 0.7);
  const e = {
    id: ++uid, type, d, hp, maxHp: hp, dist,
    x: 0, y: 0, cy: 0, foot: 0, ox: d.boss ? 0 : Math.round(rand(-3, 3)), oy: d.boss ? 0 : Math.round(rand(-3, 2)),
    slowT: 0, slowAmt: 0, flash: 0, anim: Math.random() * 10, face: 1, alive: true, spd: d.speed,
    reward: small ? 1 : Math.round(d.reward * rewardScale(wave)),
  };
  const fr = SETS[d.set].n[0], sc = d.scale || 1;
  e.w = fr.width * sc; e.h = fr.height * sc;
  placeEnemy(e);
  G.enemies.push(e);
  if (d.boss) G.boss = e;
  return e;
}
function placeEnemy(e) {
  posAt(G.md, e.dist, tmp);
  e.x = tmp.x + e.ox; e.y = tmp.y + e.oy;
  if (tmp.dx < -0.5) e.face = -1; else if (tmp.dx > 0.5) e.face = 1;
  if (e.d.flying) {
    e.foot = e.y - 3 + Math.round(Math.sin(e.anim * 3) * 1.5);
  } else {
    e.foot = e.y + (e.d.boss ? 6 : 5);
  }
  e.cy = e.foot - e.h / 2;
}
function hurt(e, dmg, magic, tower) {
  if (!e.alive) return;
  if (!magic) dmg *= 1 - e.d.armor;
  const real = Math.min(e.hp, dmg);
  e.hp -= dmg;
  if (!e.d.boss || e.flash < -0.2) e.flash = 0.06;
  if (tower) tower.dealt += real;
  if (e.hp <= 0) kill(e, tower);
}
function kill(e, tower) {
  e.alive = false;
  G.gold += e.reward;
  G.kills++;
  if (tower) tower.kills++;
  popText(e.x, e.foot - e.h - 3, "+" + e.reward, "#ffd34a");
  const n = e.d.boss ? 40 : 9;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rand(20, e.d.boss ? 90 : 55);
    G.parts.push({ x: e.x, y: e.cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, g: 120, life: rand(0.3, 0.6), max: 0.6, col: pick(e.d.parts), sz: Math.random() < 0.3 ? 2 : 1 });
  }
  if (e.d.boss) {
    G.shake = 0.5;
    addFx({ kind: "boom", x: e.x, y: e.cy, r: 20, t: 0, dur: 0.5 });
    Sound.play("bigboom");
    toast(e.d.name + " 처치!", "good");
  } else Sound.play("die");
  if (e.d.split) {
    Sound.play("split");
    for (let i = 0; i < e.d.split; i++) {
      const c = spawnEnemy("slime", G.wave, Math.max(0, e.dist + (i - e.d.split / 2) * 5), true);
      c.ox = Math.round(rand(-4, 4)); c.oy = Math.round(rand(-4, 3));
      placeEnemy(c);
    }
  }
  if (G.boss === e) G.boss = null;
}
function leak(e) {
  e.alive = false;
  G.lives = Math.max(0, G.lives - e.d.lives);
  G.shake = Math.max(G.shake, e.d.boss ? 0.6 : 0.25);
  G.flash = 0.35;
  G.castleHurt = 0.3;
  Sound.play("leak");
  if (G.boss === e) G.boss = null;
  if (G.lives <= 0) lose();
}
function addFx(f) { G.fx.push(f); }
function popText(x, y, s, col) { G.pops.push({ x, y, s, col, t: 0 }); }

function build(type, c, r) {
  const d = TOWER[type];
  if (!canBuild(c, r) || G.gold < d.cost) return null;
  G.gold -= d.cost;
  const t = {
    type, c, r, lv: 0, x: c * T + T / 2, y: r * T + T / 2, yb: r * T + T,
    cd: 0, aim: -Math.PI / 4, face: 1, spent: d.cost, kills: 0, dealt: 0, mode: "first", recoil: 0, anim: Math.random() * 10,
  };
  G.towers.push(t);
  G.tmap[r][c] = t;
  for (let i = 0; i < 10; i++) G.parts.push({ x: t.x + rand(-7, 7), y: t.yb - 1, vx: rand(-15, 15), vy: rand(-20, -5), g: 30, life: 0.5, max: 0.5, col: "#d8c8a8", sz: 1 });
  Sound.play("build");
  return t;
}
function upgrade(t) {
  const n = TOWER[t.type].levels[t.lv + 1];
  if (!n) return false;
  if (G.gold < n.cost) { Sound.play("deny"); toast("골드가 부족해요", ""); return false; }
  G.gold -= n.cost;
  t.spent += n.cost;
  t.lv++;
  for (let i = 0; i < 14; i++) G.parts.push({ x: t.x + rand(-7, 7), y: t.yb - rand(2, 16), vx: rand(-6, 6), vy: rand(-30, -12), g: 0, life: rand(0.4, 0.8), max: 0.8, col: pick(["#ffd34a", "#fff6c0", TRIM[t.lv]]), sz: 1 });
  Sound.play("upgrade");
  return true;
}
function sellValue(t) { return Math.floor(t.spent * SELL); }
function sell(t) {
  const v = sellValue(t);
  G.gold += v;
  G.tmap[t.r][t.c] = null;
  G.towers.splice(G.towers.indexOf(t), 1);
  popText(t.x, t.yb - 18, "+" + v, "#ffd34a");
  for (let i = 0; i < 8; i++) G.parts.push({ x: t.x, y: t.yb - 8, vx: rand(-40, 40), vy: rand(-60, -20), g: 160, life: 0.6, max: 0.6, col: "#ffd34a", sz: 1 });
  Sound.play("sell");
  if (G.sel === t) showInfo(null);
}

function rangePx(s) { return s.range * T; }
function canHit(def, e) { return e.d.flying ? def.air : def.ground; }
function findTarget(t, def, s) {
  const r2 = rangePx(s) ** 2;
  let best = null, bv = -Infinity;
  for (const e of G.enemies) {
    if (!e.alive || !canHit(def, e)) continue;
    const d2 = (e.x - t.x) ** 2 + (e.y - t.y) ** 2;
    if (d2 > r2) continue;
    let v;
    switch (t.mode) {
      case "last": v = -e.dist; break;
      case "strong": v = e.hp * 1000 + e.dist; break;
      case "close": v = -d2; break;
      default: v = e.dist;
    }
    if (v > bv) { bv = v; best = e; }
  }
  return best;
}
function fire(t, def, s, e) {
  if (t.type === "archer") {
    G.projs.push({ kind: "arrow", x: t.x + t.face * 2, y: t.yb - 15, tgt: e, tx: e.x, ty: e.cy, speed: 230, dmg: s.dmg, tower: t, ang: 0 });
    Sound.play("arrow");
  } else if (t.type === "cannon") {
    const dur = 0.42 + Math.hypot(e.x - t.x, e.y - t.y) / 380;
    posAt(G.md, Math.min(G.md.len, e.dist + e.spd * dur), tmp);
    const tx = tmp.x + e.ox, ty = tmp.y + e.oy;
    const mx = t.x + Math.cos(t.aim) * 7, my = t.yb - 11 + Math.sin(t.aim) * 5.6;
    G.projs.push({ kind: "shell", sx: mx, sy: my, tx, ty, x: mx, y: my, t: 0, dur, dmg: s.dmg, splash: s.splash, tower: t, h: 0 });
    t.recoil = 0.15;
    for (let i = 0; i < 5; i++) G.parts.push({ x: mx, y: my, vx: rand(-12, 12), vy: rand(-25, -8), g: -10, life: 0.5, max: 0.5, col: pick(["#d8d0c8", "#a8a098"]), sz: 1 });
    Sound.play("cannon");
  } else if (t.type === "frost") {
    G.projs.push({ kind: "frost", x: t.x, y: t.yb - 14, tgt: e, tx: e.x, ty: e.cy, speed: 150, dmg: s.dmg, tower: t, s });
    Sound.play("frost");
  } else if (t.type === "storm") {
    const hit = [e], pts = [[t.x, t.yb - 16], [e.x, e.cy]];
    let cur = e;
    while (hit.length < s.chain) {
      let nb = null, nd = 46 * 46;
      for (const o of G.enemies) {
        if (!o.alive || hit.includes(o)) continue;
        const d2 = (o.x - cur.x) ** 2 + (o.cy - cur.cy) ** 2;
        if (d2 < nd) { nd = d2; nb = o; }
      }
      if (!nb) break;
      hit.push(nb); pts.push([nb.x, nb.cy]); cur = nb;
    }
    let dmg = s.dmg;
    for (const o of hit) { hurt(o, dmg, true, t); dmg *= 0.8; }
    addFx({ kind: "bolt", pts, t: 0, dur: 0.18 });
    for (const [x, y] of pts.slice(1)) for (let i = 0; i < 3; i++) G.parts.push({ x, y, vx: rand(-40, 40), vy: rand(-40, 40), g: 0, life: 0.2, max: 0.2, col: pick(["#ffffff", "#9fe8ff", "#fff59a"]), sz: 1 });
    Sound.play("zap");
  }
}

/* ================= Update ================= */
function update(dt) {
  G.time += dt;
  // spawning
  for (const s of G.spawners) {
    s.t -= dt;
    while (s.left > 0 && s.t <= 0) { spawnEnemy(s.type, s.wave); s.left--; s.t += s.gap; }
  }
  if (G.spawners.length) G.spawners = G.spawners.filter((s) => s.left > 0);

  // enemies
  for (const e of G.enemies) {
    if (!e.alive) continue;
    e.flash -= dt;
    if (e.slowT > 0) e.slowT -= dt;
    e.spd = e.d.speed * (e.slowT > 0 ? 1 - e.slowAmt : 1);
    e.dist += e.spd * dt;
    e.anim += dt * (0.4 + e.spd / 25);
    if (e.dist >= G.md.len) { leak(e); continue; }
    placeEnemy(e);
  }

  // towers
  for (const t of G.towers) {
    const def = TOWER[t.type], s = def.levels[t.lv];
    t.anim += dt;
    if (t.recoil > 0) t.recoil -= dt;
    t.cd = Math.max(0, t.cd - dt);
    const e = findTarget(t, def, s);
    t.target = e;
    if (!e) continue;
    t.face = e.x < t.x - 1 ? -1 : e.x > t.x + 1 ? 1 : t.face;
    t.aim = Math.atan2(e.cy - (t.yb - 11), e.x - t.x);
    if (t.cd <= 0) { fire(t, def, s, e); t.cd = 1 / s.rate; }
  }

  // projectiles
  for (const p of G.projs) {
    if (p.kind === "shell") {
      p.t += dt;
      const u = Math.min(1, p.t / p.dur);
      p.x = p.sx + (p.tx - p.sx) * u;
      p.y = p.sy + (p.ty - p.sy) * u;
      p.h = Math.sin(u * Math.PI) * (10 + p.dur * 14);
      if (u >= 1) { explode(p); p.dead = true; }
      continue;
    }
    if (p.tgt.alive) { p.tx = p.tgt.x; p.ty = p.tgt.cy; }
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), step = p.speed * dt;
    p.ang = Math.atan2(dy, dx);
    if (d <= step + 2) {
      p.dead = true;
      if (p.kind === "arrow") {
        if (p.tgt.alive) hurt(p.tgt, p.dmg, false, p.tower);
        for (let i = 0; i < 2; i++) G.parts.push({ x: p.tx, y: p.ty, vx: rand(-25, 25), vy: rand(-25, 5), g: 60, life: 0.2, max: 0.2, col: "#fff2c0", sz: 1 });
      } else {
        frostHit(p);
      }
    } else {
      p.x += (dx / d) * step; p.y += (dy / d) * step;
      if (p.kind === "frost" && Math.random() < 0.5) G.parts.push({ x: p.x, y: p.y, vx: rand(-6, 6), vy: rand(-6, 6), g: 0, life: 0.25, max: 0.25, col: pick(["#bff0ff", "#ffffff"]), sz: 1 });
    }
  }
  if (G.projs.length) G.projs = G.projs.filter((p) => !p.dead);

  // effects and particles
  for (const f of G.fx) f.t += dt;
  G.fx = G.fx.filter((f) => f.t < f.dur);
  for (const p of G.parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  G.parts = G.parts.filter((p) => p.life > 0);
  for (const p of G.pops) p.t += dt;
  G.pops = G.pops.filter((p) => p.t < 0.9);
  G.shake = Math.max(0, G.shake - dt);
  G.flash = Math.max(0, G.flash - dt);
  G.castleHurt = Math.max(0, G.castleHurt - dt);

  if (G.enemies.some((e) => !e.alive)) G.enemies = G.enemies.filter((e) => e.alive);

  // wave flow
  if (G.phase === "wave" && !G.spawners.length && !G.enemies.length) {
    if (!G.endless && G.wave >= TOTAL) { win(); return; }
    const bonus = 8 + G.wave;
    G.gold += bonus;
    toast("웨이브 " + G.wave + " 클리어! +" + bonus + "G", "good");
    G.phase = "between";
    G.countdown = BETWEEN;
    if (G.endless) G.bestWave = Math.max(G.bestWave, G.wave);
  } else if (G.phase === "between") {
    G.countdown -= dt;
    if (G.countdown <= 0) startWave();
  }
}
function explode(p) {
  const r2 = p.splash * p.splash;
  for (const e of G.enemies) {
    if (!e.alive || e.d.flying) continue;
    const d2 = (e.x - p.tx) ** 2 + (e.y - p.ty) ** 2;
    if (d2 > r2) continue;
    hurt(e, p.dmg * (1 - 0.4 * Math.sqrt(d2 / r2)), false, p.tower);
  }
  addFx({ kind: "boom", x: p.tx, y: p.ty, r: Math.round(p.splash * 0.55), t: 0, dur: 0.32 });
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * TAU, s = rand(15, 50);
    G.parts.push({ x: p.tx, y: p.ty, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 15, g: 90, life: rand(0.3, 0.55), max: 0.55, col: pick(["#ffb03a", "#ffe67a", "#7a6a5a", "#4a3a32"]), sz: Math.random() < 0.3 ? 2 : 1 });
  }
  Sound.play("boom");
}
function frostHit(p) {
  const s = p.s, r2 = s.splash * s.splash;
  for (const e of G.enemies) {
    if (!e.alive) continue;
    const d2 = (e.x - p.tx) ** 2 + (e.cy - p.ty) ** 2;
    if (e !== p.tgt && d2 > r2) continue;
    const amt = e.d.boss ? s.slow * 0.5 : s.slow;
    if (amt >= e.slowAmt || e.slowT <= 0) { e.slowAmt = amt; }
    e.slowT = Math.max(e.slowT, s.slowDur);
    if (e === p.tgt) hurt(e, s.dmg, true, p.tower);
    else hurt(e, s.dmg * 0.5, true, p.tower);
  }
  addFx({ kind: "frost", x: p.tx, y: p.ty, r: s.splash, t: 0, dur: 0.25 });
  for (let i = 0; i < 6; i++) G.parts.push({ x: p.tx, y: p.ty, vx: rand(-30, 30), vy: rand(-30, 20), g: 40, life: 0.35, max: 0.35, col: pick(["#ffffff", "#9fe9ff", "#3fa0e0"]), sz: 1 });
}

function win() {
  G.phase = "won";
  const stars = G.lives >= 18 ? 3 : G.lives >= 10 ? 2 : 1;
  const b = save.best[G.md.def.id] || {};
  b.stars = Math.max(b.stars || 0, stars);
  save.best[G.md.def.id] = b;
  persist();
  Sound.play("win");
  showInfo(null);
  G.build = null;
  refreshShop();
  overlayResult(true, stars);
}
function lose() {
  if (G.phase === "over") return;
  G.phase = "over";
  if (G.endless) {
    const b = save.best[G.md.def.id] || {};
    b.endless = Math.max(b.endless || 0, G.wave);
    save.best[G.md.def.id] = b;
    persist();
  }
  Sound.play("lose");
  showInfo(null);
  G.build = null;
  refreshShop();
  overlayResult(false, 0);
}

/* ================= Rendering ================= */
function blit(img, x, y, w, h, face) {
  if (face < 0) {
    ctx.save();
    ctx.translate(x + w, y);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, w, h);
    ctx.restore();
  } else ctx.drawImage(img, x, y, w, h);
}

function drawTowerTo(g, type, lv, x0, yb, st) {
  const base = SPR.tower[type][lv], cx = x0 + 8, t = st.t || 0;
  oval(g, cx, yb - 1, 7, 2, "rgba(0,0,0,0.28)");
  g.drawImage(base, x0, yb - base.height);
  if (type === "archer") {
    const a = SPR.archer, ax = cx - 4, ay = yb - 18;
    if ((st.face || 1) < 0) {
      g.save(); g.translate(ax + a.width, ay); g.scale(-1, 1); g.drawImage(a, 0, 0); g.restore();
    } else g.drawImage(a, ax, ay);
    if (lv >= 1) { rect(g, cx - 6, yb - 13, 1, 3, OUT); rect(g, cx - 5, yb - 13, 2, 2, TRIM[lv]); }
  } else if (type === "cannon") {
    const ang = st.aim ?? -Math.PI / 4, L = st.recoil > 0 ? 5 : 7;
    const px0 = cx, py0 = yb - 11, ex = px0 + Math.cos(ang) * L, ey = py0 + Math.sin(ang) * L * 0.8;
    line(g, px0, py0, ex, ey, OUT, 4);
    line(g, px0, py0, ex, ey, "#3c3c4c", 2);
    line(g, px0, py0 - 1, ex, ey - 1, "#6c6c80", 1);
    disk(g, px0, py0, 2, "#2c2c38");
    rect(g, px0 - 1, py0 - 1, 1, 1, "#8a8aa0");
    if (lv >= 2) { rect(g, cx - 5, yb - 13, 1, 1, TRIM[lv]); rect(g, cx + 4, yb - 13, 1, 1, TRIM[lv]); }
  } else if (type === "frost") {
    const bob = Math.round(Math.sin(t * 2.5) * 1.5);
    const cy = yb - 14 + bob;
    const glow = 0.18 + 0.08 * Math.sin(t * 4);
    disk(g, cx, cy, 5 + lv, "rgba(140,220,255," + glow.toFixed(2) + ")");
    g.drawImage(SPR.crystal, cx - 3, yb - 19 + bob);
    if (lv >= 1) {
      for (let i = 0; i < lv + 1; i++) {
        const a = t * 2 + (i * TAU) / (lv + 1);
        rect(g, cx + Math.cos(a) * 6, cy + Math.sin(a) * 3, 1, 1, "#dff8ff");
      }
    }
  } else if (type === "storm") {
    const on = Math.sin(t * 9) > 0 || st.charged;
    rect(g, cx - 2, yb - 17, 4, 3, on ? "#ffffff" : "#fff59a");
    if (st.charged || Math.random() < 0.06) {
      const a = Math.random() * TAU;
      line(g, cx, yb - 16, cx + Math.cos(a) * 5, yb - 16 + Math.sin(a) * 4, "#bff4ff", 1);
    }
    if (lv >= 1) { rect(g, cx - 4, yb - 12, 1, 1, TRIM[lv]); rect(g, cx + 3, yb - 12, 1, 1, TRIM[lv]); }
  }
  if (lv === 2 && Math.sin(t * 3 + x0) > 0.97) rect(g, cx + 5, yb - 16, 1, 1, "#ffffff");
}

function drawEnemy(e) {
  const d = e.d, S = SETS[d.set], fr = e.flash > 0 ? S.f : e.slowT > 0 ? S.s : S.n, sc = d.scale || 1;
  const x = Math.round(e.x), foot = Math.round(e.foot);
  let img = fr[0], w = e.w, h = e.h, yoff = 0;
  if (d.set === "slime" || d.set === "king") {
    const sq = Math.sin(e.anim * 7) > 0.4;
    if (sq) { w += sc; h -= sc; }
  } else if (fr.length > 1) {
    img = fr[Math.floor(e.anim * (d.flying ? 7 : 5)) % fr.length];
  } else if (d.set === "golem") {
    yoff = Math.sin(e.anim * 5) > 0 ? -1 : 0;
  }
  blit(img, x - (w >> 1), foot - h + yoff, w, h, e.face);
}
function drawShadow(e) {
  const r = Math.max(3, Math.round(e.w * 0.35));
  oval(ctx, e.x, e.y + (e.d.flying ? 6 : 5), r, e.d.boss ? 2 : 1, "rgba(0,0,0,0.25)");
}
function drawHp(e) {
  if (e.hp >= e.maxHp || e.d.boss) return;
  const bw = e.d.set === "golem" ? 14 : 10, x = Math.round(e.x - bw / 2), y = Math.round(e.foot - e.h - 4);
  const f = clamp(e.hp / e.maxHp, 0, 1);
  rect(ctx, x - 1, y - 1, bw + 2, 4, OUT);
  rect(ctx, x, y, bw, 2, "#4a1a24");
  rect(ctx, x, y, Math.max(1, Math.round(bw * f)), 2, f > 0.5 ? "#6ee05a" : f > 0.25 ? "#ffd34a" : "#ff5050");
}

function render(rdt) {
  const md = G.md || MD[G.titleMi];
  ctx.save();
  if (G.shake > 0) ctx.translate(Math.round(rand(-2, 2)), Math.round(rand(-2, 2)));
  ctx.drawImage(md.bg, 0, 0);
  drawCave(ctx, md.rs, G.rt);

  const playing = G.scene === "play";
  const sel = G.sel;
  // build grid hint
  if (playing && G.build) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!canBuild(c, r)) continue;
      const x = c * T, y = r * T, col = "rgba(255,255,255,0.35)";
      rect(ctx, x + 1, y + 1, 2, 1, col); rect(ctx, x + 1, y + 1, 1, 2, col);
      rect(ctx, x + 13, y + 1, 2, 1, col); rect(ctx, x + 14, y + 1, 1, 2, col);
      rect(ctx, x + 1, y + 14, 2, 1, col); rect(ctx, x + 1, y + 13, 1, 2, col);
      rect(ctx, x + 13, y + 14, 2, 1, col); rect(ctx, x + 14, y + 13, 1, 2, col);
    }
  }
  if (playing && sel) {
    const s = TOWER[sel.type].levels[sel.lv];
    ctx.globalAlpha = 0.14;
    disk(ctx, sel.x, sel.y, rangePx(s), "#ffffff");
    ctx.globalAlpha = 1;
  }

  // ground layer: shadows, towers, walkers, castle (sorted by depth)
  const list = [];
  for (const e of G.enemies) { drawShadow(e); if (!e.d.flying) list.push({ y: e.foot, e }); }
  for (const t of G.towers) list.push({ y: t.yb, t });
  list.push({ y: (md.re + 2) * T, castle: true });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) {

    else if (it.t) {

      drawTowerTo(ctx, t.type, t.lv, t.c * T, t.yb, { t: t.anim, face: t.face, aim: t.aim, recoil: t.recoil, charged: t.type === "storm" && t.target && t.cd < 0.25 });
    } else drawCastle(ctx, md.re, G.rt, G.castleHurt);
  }

  // projectiles
  for (const p of G.projs) {
    if (p.kind === "shell") {
      oval(ctx, p.x, p.y + 1, 2, 1, "rgba(0,0,0,0.3)");
      disk(ctx, p.x, p.y - p.h, 2, OUT);
      rect(ctx, p.x - 1, p.y - p.h - 1, 2, 2, "#4a4a5a");
      rect(ctx, p.x - 1, p.y - p.h - 1, 1, 1, "#9a9ab0");
    } else if (p.kind === "arrow") {
      const cx = Math.cos(p.ang), sy = Math.sin(p.ang);
      line(ctx, p.x - cx * 4, p.y - sy * 4, p.x, p.y, "#8a5a2a", 1);
      rect(ctx, p.x, p.y, 1, 1, "#e8e8f0");
      rect(ctx, p.x - cx * 4, p.y - sy * 4, 1, 1, "#ffffff");
    } else {
      disk(ctx, p.x, p.y, 2, "#3fa0e0");
      rect(ctx, p.x - 1, p.y - 1, 2, 2, "#dff8ff");
    }
  }

  // flying monsters on top
  const fl = G.enemies.filter((e) => e.d.flying).sort((a, b) => a.foot - b.foot);
  for (const e of fl) drawEnemy(e);

  // effects
  for (const f of G.fx) {
    const u = f.t / f.dur;
    if (f.kind === "boom") {
      if (u < 0.25) disk(ctx, f.x, f.y, Math.max(1, Math.round(f.r * (0.5 + u * 2))), "#fff6c0");
      else if (u < 0.6) { disk(ctx, f.x, f.y, f.r, "#ff9a3a"); disk(ctx, f.x, f.y, Math.round(f.r * 0.6), "#ffe67a"); }
      else ring(ctx, f.x, f.y, Math.round(f.r * (1 + (u - 0.6))), "rgba(255,150,70," + (1 - u).toFixed(2) + ")");
    } else if (f.kind === "frost") {
      ring(ctx, f.x, f.y, Math.max(1, Math.round(f.r * u)), "rgba(190,240,255," + (1 - u).toFixed(2) + ")");
    } else if (f.kind === "bolt") {
      const a = (1 - u).toFixed(2);
      for (let i = 0; i < f.pts.length - 1; i++) {
        const [x0, y0] = f.pts[i], [x1, y1] = f.pts[i + 1];
        let px = x0, py = y0;
        const n = 4;
        for (let k = 1; k <= n; k++) {
          const nx = k === n ? x1 : x0 + ((x1 - x0) * k) / n + rand(-3, 3);
          const ny = k === n ? y1 : y0 + ((y1 - y0) * k) / n + rand(-3, 3);
          line(ctx, px, py, nx, ny, "rgba(110,210,255," + a + ")", 3);
          line(ctx, px, py, nx, ny, "#ffffff", 1);
          px = nx; py = ny;
        }
      }
    }
  }
  for (const p of G.parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1);

  }
  ctx.globalAlpha = 1;
  for (const e of G.enemies) drawHp(e);

  // ambient weather

  // placement preview
  if (playing && G.build && G.hover) {
    const { c, r } = G.hover, d = TOWER[G.build], s = d.levels[0];
    const ok = canBuild(c, r) && G.gold >= d.cost;

    if (canBuild(c, r)) {

      line(ctx, c * T + 11, r * T + 4, c * T + 4, r * T + 11, "#ff5050", 2);
    }
    if (G.pending && G.pending.c === c && G.pending.r === r && ok) {
      const blink = Math.floor(G.rt * 4) % 2 ? "#ffffff" : "#ffd34a";
      ptext(ctx, "+", cx, r * T - 8, blink);
    }
  }
  if (playing && sel) {
    const s = TOWER[sel.type].levels[sel.lv];
    ring(ctx, sel.x, sel.y, rangePx(s), "rgba(255,255,255,0.8)", 2, Math.floor(G.rt * 8));
    const x = sel.c * T, y = sel.yb - 19, col = Math.floor(G.rt * 3) % 2 ? "#ffd34a" : "#fff6c0";
    rect(ctx, x - 1, y, 3, 1, col); rect(ctx, x - 1, y, 1, 3, col);
    rect(ctx, x + 14, y, 3, 1, col); rect(ctx, x + 16, y, 1, 3, col);
    rect(ctx, x - 1, sel.yb, 3, 1, col); rect(ctx, x - 1, sel.yb - 2, 1, 3, col);
    rect(ctx, x + 14, sel.yb, 3, 1, col); rect(ctx, x + 16, sel.yb - 2, 1, 3, col);
  }
  for (const p of G.pops) {
    const u = p.t / 0.9;
    ctx.globalAlpha = u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3;
    ptext(ctx, p.s, p.x, p.y - u * 10, p.col);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (G.flash > 0) {
    ctx.fillStyle = "rgba(255,40,40," + (G.flash * 0.6).toFixed(2) + ")";
    ctx.fillRect(0, 0, W, 2); ctx.fillRect(0, H - 2, W, 2); ctx.fillRect(0, 0, 2, H); ctx.fillRect(W - 2, 0, 2, H);
    ctx.fillStyle = "rgba(255,40,40," + (G.flash * 0.25).toFixed(2) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

function drawAmbient(kind, dt) {
  for (const a of G.amb) {
    if (kind === "snow") {
      a.y += (8 + a.s * 14) * dt; a.x += Math.sin(G.rt * 1.3 + a.p) * 6 * dt - 3 * dt;
      rect(ctx, a.x, a.y, a.s > 0.8 ? 2 : 1, a.s > 0.8 ? 2 : 1, "rgba(255,255,255,0.9)");
    } else if (kind === "dust") {
      a.x += (14 + a.s * 18) * dt; a.y += Math.sin(G.rt * 2 + a.p) * 4 * dt;
      rect(ctx, a.x, a.y, 2, 1, "rgba(255,236,190,0.35)");
    } else {
      a.x += (6 + a.s * 6) * dt; a.y += (5 + Math.sin(G.rt * 2 + a.p) * 8) * dt;
      rect(ctx, a.x, a.y, 1, 1, a.s > 0.5 ? "#ffd0e0" : "#ffffff");
    }
    if (a.y > H + 2) { a.y = -2; a.x = Math.random() * W; }
    if (a.x > W + 2) { a.x = -2; a.y = Math.random() * H; }
    if (a.x < -3) a.x = W + 1;
  }
}

function statLine(def, s, n) {
  const parts = [];
  const add = (label, a, b, unit = "") => {

/* ---------- Field input ---------- */
function tileAt(ev) {
  const b = cv.getBoundingClientRect();
  const x = ((ev.clientX - b.left) / b.width) * W, y = ((ev.clientY - b.top) / b.height) * H;
  return { x, y, c: Math.floor(x / T), r: Math.floor(y / T) };
}
let lastHint = 0;
cv.addEventListener("pointermove", (ev) => {
  if (ev.pointerType !== "mouse") return;
  const p = tileAt(ev);
  G.hover = p.c >= 0 && p.c < COLS && p.r >= 0 && p.r < ROWS ? p : null;
});
cv.addEventListener("pointerleave", (ev) => { if (ev.pointerType === "mouse") G.hover = null; });
cv.addEventListener("contextmenu", (ev) => { ev.preventDefault(); cancelSel(); });
cv.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (ev.button > 0) return;
  if (G.scene !== "play" || G.paused || G.phase === "over" || G.phase === "won") return;
  const p = tileAt(ev), { c, r } = p;
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  const tw = G.tmap[r][c];
  if (G.build) {
    G.hover = p;
    if (tw) { showInfo(tw); return; }
    const d = TOWER[G.build];
    if (!canBuild(c, r)) { Sound.play("deny"); G.pending = null; return; }
    if (G.gold < d.cost) { Sound.play("deny"); toast("골드가 부족해요", ""); return; }
    if (ev.pointerType !== "mouse" && !(G.pending && G.pending.c === c && G.pending.r === r)) {
      G.pending = { c, r };
      return;
    }
    build(G.build, c, r);
    G.pending = null;
    if (!ev.shiftKey || G.gold < d.cost) { G.build = null; showTip(""); if (ev.pointerType !== "mouse") G.hover = null; }
    refreshShop();
  } else if (tw) {
    showInfo(G.sel === tw ? null : tw);
  } else {
    if (G.sel) showInfo(null);
    else if (canBuild(c, r) && performance.now() - lastHint > 2500) { lastHint = performance.now(); toast("아래에서 탑을 먼저 고르세요", ""); }
  }
});

// Mouse clicks should not leave focus on a button, so Space keeps meaning "next wave".
document.addEventListener("mousedown", (ev) => { if (ev.target.closest("button")) ev.preventDefault(); });
addEventListener("keydown", (ev) => {
  Sound.unlock();
  const k = ev.code;
  if ((k === "Space" || k === "Enter") && ev.target.closest && ev.target.closest("button")) return;
  if (ov.dataset.screen === "help" && k === "Escape") {
    ov.querySelector("[data-act^=back]")?.click();
    return;
  }
  if (G.scene !== "play") return;
  if (k === "Escape") {
    if (G.paused) setPaused(false);
    else if (G.build || G.sel) cancelSel();
    else setPaused(true);
    return;
  }
  if (k === "KeyP") { setPaused(!G.paused); return; }
  if (k === "KeyM") { toggleSound(); return; }
  if (G.paused || G.phase === "over" || G.phase === "won") return;
  if (/^Digit[1-4]$/.test(k) || /^Numpad[1-4]$/.test(k)) selectBuild(TKEYS[+k.slice(-1) - 1]);
  else if (k === "Space") { ev.preventDefault(); callWave(); }
  else if (k === "KeyF") cycleSpeed();
  else if (k === "KeyU" && G.sel) { if (upgrade(G.sel)) { ui.infoKey = ""; updateInfo(); } }
  else if ((k === "KeyS" || k === "Delete" || k === "Backspace") && G.sel) sell(G.sel);
  else if (k === "KeyT") cycleTarget();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden && G.scene === "play" && !G.paused) setPaused(true);
});

/* ---------- Layout ---------- */
function layout() {
  // clientWidth is the layout viewport; innerWidth can report a zoomed-out width on phones
  const de = document.documentElement, vw = de.clientWidth || innerWidth, vh = de.clientHeight || innerHeight;
  const app = $("app"), root = de.style;
  // HUD and bar get their size from --p; the field takes what is left, in whole pixels when it can.
  const fit = (p) => {
    root.setProperty("--p", p + "px");
    root.setProperty("--fs", (p >= 3 ? 22 : 11) + "px");
    let u = 1;
    for (let pass = 0; pass < 2; pass++) {
      const used = $("hud").offsetHeight + $("bar").offsetHeight;
      u = Math.min(vw / W, (vh - used) / H);
      if (u >= 2) u = Math.floor(u);
      u = Math.max(u, 0.5);
      const aw = Math.min(vw, Math.max(Math.round(W * u), 720));
      app.style.width = aw + "px";
      document.body.classList.toggle("narrow", aw < 470);
    }
    return u;
  };
  let u = fit(2);
  for (let p = clamp(Math.floor(u), 2, 4); p > 2; p--) {
    const u2 = fit(p);
    if (u2 >= p - 1) { u = u2; break; }
    u = fit(2);
  }
  cv.style.width = Math.round(W * u) + "px";
  cv.style.height = Math.round(H * u) + "px";
}
addEventListener("resize", layout);

/* ================= Boot ================= */
const THUMB = [];
function boot() {
  buildSprites();
  for (const def of MAPS) MD.push(buildMap(def));
  MD.forEach((md, i) => {
    THUMB[i] = url(canvasOf(W, H, (g) => {
      g.drawImage(md.bg, 0, 0);
      drawCave(g, md.rs, 0);
      drawCastle(g, md.re, 0, 0);
    }));
  });
  buildIcons();
  buildShop();
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  showTitle();
  let last = performance.now(), acc = 0;
  const STEP = 1 / 60;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    G.rt += dt;
    if (G.scene === "play" && !G.paused && G.phase !== "over") {
      acc += dt * G.speed;
      let n = 0;
      while (acc >= STEP && n < 10) { update(STEP); acc -= STEP; n++; }
      if (n >= 10) acc = 0;
    } else acc = 0;
    render(G.paused ? 0 : dt);
    syncUi();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (/[?&]test\b/.test(location.search)) {
    window.__td = { G, MD, MAPS, TOWER, ENEMY, TKEYS, update, render, startMap, build, upgrade, sell, callWave, canBuild, waveDef, hpScale, posAt };
  }
}
boot();
})();
</script>
