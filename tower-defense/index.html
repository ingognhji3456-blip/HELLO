    const body = open
      ? `<span class="mname">${i + 1}. ${st.name}</span><span>${stars}</span><span class="dim">${STAGE_DESC[st.id]}</span>${reward}`
      : `<span class="mname">${i + 1}. ${st.name}</span><span class="dim">${i}. ${STAGES[i - 1].name}을(를) 깨면 열려요</span>${reward}`;
    return `<button class="mapcard${open ? "" : " locked"}" data-act="${open ? "map" : "locked"}" data-i="${i}"><span class="thumb"><img src="${THUMB[i]}" alt="">${lockover}</span><span class="mtext">${body}</span></button>`;
  }).join("");
  overlay(`<div class="panel px"><h1>픽셀 타워 디펜스</h1><p class="dim">길을 따라 몰려오는 몬스터를 탑으로 막아 성을 지키세요! 스테이지를 깨면 새 탑과 다음 스테이지가 열려요.</p>
    <p>클리어 <span class="good">${done}/${STAGES.length}</span> · 해금한 탑 <span class="good">${opened}/${TKEYS.length}</span></p>
    <div class="maps">${cards}</div><div class="row"><button class="btn" data-act="help">도움말</button></div></div>`, "title");
}
function showHelp(back) {
  const enemyRows = EKEYS.map((k) => `${iconImg(ICON.enemy[k])}<span><span class="t">${ENEMY[k].name}</span> · ${ENEMY[k].desc}</span>`).join("");
  const towerRows = TKEYS.map((k) => {
    const d = TOWER[k], open = towerOpen(k);
    return `${iconImg(ICON.tower[k][0], "--ic")}<span><span class="t">${d.name} ${d.cost}G</span> · ${d.desc}${open ? "" : ` <span class="lock">(${lockText(k)})</span>`}</span>`;
  }).join("");
  overlay(`<div class="panel px help"><h2>도움말</h2>
    <ul>
      <li>아래 칸에서 탑을 고른 뒤 풀밭을 눌러 짓습니다. 휴대폰은 같은 칸을 한 번 더 누르면 지어져요.</li>
      <li>지은 탑을 누르면 업그레이드, 판매(${Math.round(SELL * 100)}% 환불), 공격 대상을 바꿀 수 있어요.</li>
      <li>몬스터가 성에 들어가면 생명이 줄어요. 생명이 0이 되면 패배, 마지막 웨이브까지 버티면 승리!</li>
      <li>스테이지를 처음 깨면 새 탑이 해금되고 다음 스테이지가 열려요.</li>
      <li>다음 웨이브를 일찍 부르면 남은 시간만큼 보너스 골드를 받아요.</li>
      <li>갑옷 입은 적은 화살과 포탄 피해를 덜 받아요. 마법 탑은 갑옷을 무시하고, 저격탑은 갑옷을 뚫어요.</li>
    </ul>
    <div class="grid">${towerRows}</div>
    <div class="grid">${enemyRows}</div>
    <p class="dim">단축키: 1~8 탑 고르기 · Space 웨이브 · U 업그레이드 · S 판매 · T 공격 대상 · F 속도 · P 일시정지 · M 소리 · Esc 취소</p>
    <div class="row"><button class="btn go" data-act="${back}">돌아가기</button></div>
    <p class="credit">글꼴: 갈무리11 (© 이민서, SIL Open Font License 1.1)</p></div>`, "help");
}
function showPause() {
  overlay(`<div class="panel px"><h2>일시정지</h2><p class="dim">${G.si + 1}. ${G.st.name} · 웨이브 ${G.wave}</p>
    <div class="row"><button class="btn go" data-act="resume">계속하기</button><button class="btn" data-act="restart">다시 시작</button><button class="btn" data-act="help-pause">도움말</button><button class="btn warn" data-act="title">스테이지 선택</button></div></div>`, "pause");
}
function overlayResult(won, stars, info) {
  const next = STAGES[G.si + 1];
  if (won) {
    let extra = "";
    if (info.newTower) {
      const d = TOWER[info.newTower];
      extra += `<div class="unlock px">${iconImg(ICON.tower[info.newTower][0], "--ic")}<div><div class="t">새 탑 해금! ${d.name}</div><div>${d.desc}</div></div></div>`;
    }
    if (info.nextOpened) extra += `<p class="good">다음 스테이지 '${info.nextOpened.name}'이(가) 열렸어요!</p>`;
    if (info.allClear) extra += `<p class="good">모든 스테이지를 깼어요! 무한 모드로 기록에 도전해 보세요.</p>`;
    const nextBtn = next && stageOpen(G.si + 1) ? `<button class="btn go" data-act="next">다음 스테이지 ▶</button>` : "";
    overlay(`<div class="panel px"><h1>승리!</h1><div class="big-stars">${starText(stars)}</div><p>${G.st.name}을(를) 지켜냈어요. 남은 생명 ${G.lives} · 처치 ${fmt(G.kills)}</p>${extra}
      <div class="row">${nextBtn}<button class="btn${nextBtn ? "" : " go"}" data-act="endless">무한 모드 계속</button><button class="btn" data-act="restart">다시 하기</button><button class="btn" data-act="title">스테이지 선택</button></div></div>`, "result");
  } else {
    const extra = G.endless ? "무한 모드 " + G.wave + "웨이브까지 버텼어요." : "웨이브 " + G.wave + "에서 성이 무너졌어요.";
    const hints = ["갑옷 입은 적에게는 마법 탑이 좋아요.", "박쥐와 드래곤은 대포탑이 못 맞혀요. 궁수탑과 번개탑을 섞으세요.", "얼음탑으로 느리게 하면 다른 탑이 더 오래 때려요."];
    if (towerOpen("sniper")) hints.push("보스와 골렘은 저격탑으로 멀리서 노리세요.");
    if (towerOpen("banner")) hints.push("지원탑 둘레에 탑을 모아 지으면 더 강해져요.");
    overlay(`<div class="panel px"><h1 style="color:var(--red)">패배</h1><p>${extra} 처치 ${fmt(G.kills)}</p>
      <p class="dim">${hints[G.wave % hints.length]}</p>
      <div class="row"><button class="btn go" data-act="restart">다시 도전</button><button class="btn" data-act="title">스테이지 선택</button></div></div>`, "result");
  }
}
function setPaused(p) {
  if (G.scene !== "play" || G.phase === "over" || G.phase === "won") return;
  G.paused = p;
  $("bPause").textContent = p ? "▶" : "II";
  if (p) showPause(); else hideOverlay();
}

ov.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  Sound.unlock();
  const act = b.dataset.act;
  if (act === "locked") { Sound.play("deny"); return; }
  Sound.play("click");
  if (act === "map") startStage(+b.dataset.i);
  else if (act === "help") showHelp("back-title");
  else if (act === "back-title") showTitle();
  else if (act === "help-pause") showHelp("back-pause");
  else if (act === "back-pause") showPause();
  else if (act === "resume") setPaused(false);
  else if (act === "restart") startStage(G.si);
  else if (act === "next") startStage(G.si + 1);
  else if (act === "title") showTitle();
  else if (act === "endless") {
    G.endless = true; G.phase = "between"; G.countdown = BETWEEN;
    ui.next = -1;
    hideOverlay();
    toast("무한 모드 시작!", "good");
  }
});
ov.addEventListener("pointerover", (e) => {
  const b = e.target.closest(".mapcard");
  if (b && G.scene === "title" && G.titleSi !== +b.dataset.i) { G.titleSi = +b.dataset.i; resetAmbient(); }
});

$("bWave").addEventListener("click", () => { Sound.unlock(); callWave(); });
$("bSpeed").addEventListener("click", () => cycleSpeed());
$("bPause").addEventListener("click", () => { Sound.unlock(); setPaused(!G.paused); });
$("bSound").addEventListener("click", () => toggleSound());
$("bUp").addEventListener("click", () => { if (G.sel && upgrade(G.sel)) { ui.infoKey = ""; updateInfo(); } });
$("bSell").addEventListener("click", () => { if (G.sel) sell(G.sel); });
$("bTgt").addEventListener("click", () => cycleTarget());
$("bClose").addEventListener("click", () => cancelSel());

function cycleSpeed() { G.speed = G.speed >= 3 ? 1 : G.speed + 1; Sound.play("click"); }
function toggleSound() {
  save.sound = !save.sound;
  persist();
  if (save.sound) { Sound.unlock(); Sound.play("click"); }
}
function cycleTarget() {
  const t = G.sel;
  if (!t || TOWER[t.type].support || TOWER[t.type].aura) return;
  t.mode = TARGETS[(TARGETS.indexOf(t.mode) + 1) % TARGETS.length];
  Sound.play("click");
  updateInfo();
}

/* ---------- Field input ---------- */
function tileAt(ev) {
  const b = cv.getBoundingClientRect();
  const x = ((ev.clientX - b.left) / b.width) * W, y = ((ev.clientY - b.top) / b.height) * H;
  return { x, y, c: Math.floor(x / T), r: Math.floor(y / T) };
}
let lastHint = 0;
cv.addEventListener("pointermove", (ev) => {
  if (ev.pointerType !== "mouse") return;
  const p = tileAt(ev);
  G.hover = p.c >= 0 && p.c < COLS && p.r >= 0 && p.r < ROWS ? p : null;
});
cv.addEventListener("pointerleave", (ev) => { if (ev.pointerType === "mouse") G.hover = null; });
cv.addEventListener("contextmenu", (ev) => { ev.preventDefault(); cancelSel(); });
cv.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (ev.button > 0) return;
  if (G.scene !== "play" || G.paused || G.phase === "over" || G.phase === "won") return;
  const p = tileAt(ev), { c, r } = p;
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  const tw = G.tmap[r][c];
  if (G.build) {
    G.hover = p;
    if (tw) { showInfo(tw); return; }
    const d = TOWER[G.build];
    if (!canBuild(c, r)) { Sound.play("deny"); G.pending = null; return; }
    if (G.gold < d.cost) { Sound.play("deny"); toast("골드가 부족해요", ""); return; }
    if (ev.pointerType !== "mouse" && !(G.pending && G.pending.c === c && G.pending.r === r)) {
      G.pending = { c, r };
      return;
    }
    build(G.build, c, r);
    G.pending = null;
    if (!ev.shiftKey || G.gold < d.cost) { G.build = null; showTip(""); if (ev.pointerType !== "mouse") G.hover = null; }
    refreshShop();
  } else if (tw) {
    showInfo(G.sel === tw ? null : tw);
  } else {
    if (G.sel) showInfo(null);
    else if (canBuild(c, r) && performance.now() - lastHint > 2500) { lastHint = performance.now(); toast("아래에서 탑을 먼저 고르세요", ""); }
  }
});

// Mouse clicks should not leave focus on a button, so Space keeps meaning "next wave".
document.addEventListener("mousedown", (ev) => { if (ev.target.closest("button")) ev.preventDefault(); });
addEventListener("keydown", (ev) => {
  Sound.unlock();
  const k = ev.code;
  if ((k === "Space" || k === "Enter") && ev.target.closest && ev.target.closest("button")) return;
  if (ov.dataset.screen === "help" && k === "Escape") {
    ov.querySelector("[data-act^=back]")?.click();
    return;
  }
  if (G.scene !== "play") return;
  if (k === "Escape") {
    if (G.paused) setPaused(false);
    else if (G.build || G.sel) cancelSel();
    else setPaused(true);
    return;
  }
  if (k === "KeyP") { setPaused(!G.paused); return; }
  if (k === "KeyM") { toggleSound(); return; }
  if (G.paused || G.phase === "over" || G.phase === "won") return;
  if (/^(Digit|Numpad)[1-8]$/.test(k)) selectBuild(TKEYS[+k.slice(-1) - 1]);
  else if (k === "Space") { ev.preventDefault(); callWave(); }
  else if (k === "KeyF") cycleSpeed();
  else if (k === "KeyU" && G.sel) { if (upgrade(G.sel)) { ui.infoKey = ""; updateInfo(); } }
  else if ((k === "KeyS" || k === "Delete" || k === "Backspace") && G.sel) sell(G.sel);
  else if (k === "KeyT") cycleTarget();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden && G.scene === "play" && !G.paused) setPaused(true);
});

/* ---------- Layout ---------- */
function layout() {
  // clientWidth is the layout viewport; innerWidth can report a zoomed-out width on phones
  const de = document.documentElement, vw = de.clientWidth || innerWidth, vh = de.clientHeight || innerHeight;
  const app = $("app"), root = de.style;
  // HUD and bar get their size from --p; the field takes what is left, in whole pixels when it can.
  const fit = (p) => {
    root.setProperty("--p", p + "px");
    root.setProperty("--ic", (p >= 4 ? 3 : 2) + "px");
    root.setProperty("--fs", (p >= 3 ? 22 : 11) + "px");
    let u = 1;
    for (let pass = 0; pass < 2; pass++) {
      const used = $("hud").offsetHeight + $("bar").offsetHeight;
      u = Math.min(vw / W, (vh - used) / H);
      if (u >= 2) u = Math.floor(u);
      u = Math.max(u, 0.5);
      const aw = Math.min(vw, Math.max(Math.round(W * u), 720));
      app.style.width = aw + "px";
      document.body.classList.toggle("narrow", aw < 470);
    }
    return u;
  };
  let u = fit(2);
  for (let p = clamp(Math.floor(u), 2, 4); p > 2; p--) {
    const u2 = fit(p);
    if (u2 >= p - 1) { u = u2; break; }
    u = fit(2);
  }
  cv.style.width = Math.round(W * u) + "px";
  cv.style.height = Math.round(H * u) + "px";
}
addEventListener("resize", layout);

/* ================= Boot ================= */
const THUMB = [];
function boot() {
  buildSprites();
  for (const def of STAGES) MD.push(buildMap(def));
  MD.forEach((md, i) => {
    THUMB[i] = url(canvasOf(W, H, (g) => {
      g.drawImage(md.bg, 0, 0);
      for (const p of md.paths) drawCave(g, p.rs, 0);
      drawCastle(g, md.re, 0, 0);
    }));
  });
  buildIcons();
  buildShop();
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  showTitle();
  let last = performance.now(), acc = 0;
  const STEP = 1 / 60;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    G.rt += dt;
    if (G.scene === "play" && !G.paused && G.phase !== "over") {
      acc += dt * G.speed;
      let n = 0;
      while (acc >= STEP && n < 10) { update(STEP); acc -= STEP; n++; }
      if (n >= 10) acc = 0;
    } else acc = 0;
    render(G.paused ? 0 : dt);
    syncUi();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (/[?&]test\b/.test(location.search)) {
    window.__td = {
      G, MD, STAGES, TOWER, ENEMY, TKEYS, save, update, render, startStage, showTitle, build, upgrade, sell, callWave,
      canBuild, waveGroups, waveDef, hpScale, posAt, towerOpen, stageOpen, persist,
    };
  }
}
boot();
})();
</script>
