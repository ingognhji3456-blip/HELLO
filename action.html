<style>
/* The game owns the whole window: a 16:9 playfield as wide as the viewport allows, centered. */
:root {
  --void: #07050f;
  --deep: #171026;
  --line: #2f2440;
  --glow: #ffb547;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 40%, var(--deep) 0%, #0b0816 55%, var(--void) 100%);
  background-color: var(--void);
  display: grid;
  place-items: center;
}
.screen {
  width: min(100vw, 177.78vh);
  width: min(100vw, 177.78dvh);
  aspect-ratio: 16 / 9;
  max-width: 100%;
  background: #000;
  box-shadow: 0 0 0 2px var(--line), 0 0 80px rgba(255, 181, 71, 0.10);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  outline: none;
}
</style>

function mulberry32(a) {
  return function () {

function text(s, x, y, c, sc = 1, align = "left") {
  s = String(s).toUpperCase();
  const w = s.length * 4 * sc - sc;
  if (align === "center") x -= Math.floor(w / 2);
  else if (align === "right") x -= w;
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = c;
  for (let i = 0; i < s.length; i++) {
    const g = GLYPHS[s[i]];

      if (g[p] === "1") ctx.fillRect(x + i * 4 * sc + (p % 3) * sc, y + Math.floor(p / 3) * sc, sc, sc);

/* ---------- sprites ---------- */
function sprite(rows, pal, x, y, flip = false, override = null) {
  x = Math.round(x); y = Math.round(y);
  const wid = rows[0].length;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      const k = row[c];
      if (k === ".") continue;
      ctx.fillStyle = override || pal[k];
      ctx.fillRect(x + (flip ? wid - 1 - c : c), y + r, 1, 1);
    }
  }
}
const OUTLINE = "#0d0a18";
function outline(rows, x, y, flip = false) {
  sprite(rows, null, x - 1, y, flip, OUTLINE); sprite(rows, null, x + 1, y, flip, OUTLINE);
  sprite(rows, null, x, y - 1, flip, OUTLINE); sprite(rows, null, x, y + 1, flip, OUTLINE);
}
function spriteO(rows, pal, x, y, flip = false, ov = null) { outline(rows, x, y, flip); sprite(rows, pal, x, y, flip, ov); }
function chk(name, rows, wid) {

/* ---------- audio ---------- */
let AC = null, master = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function sfx(f, d, type = "square", v = 0.05, f2 = 0, when = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + d);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + d);
}
function noise(d, v = 0.12, hp = 0) {
  if (!AC || muted) return;
  const n = Math.floor(AC.sampleRate * d);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const g = AC.createGain(); g.gain.value = v;
  let node = src;
  if (hp) { const f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp; src.connect(f); node = f; }
  node.connect(g); g.connect(master); src.start();
}

};
const mus = { song: null, step: 0, next: 0 };
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function mTone(f, t, d, type, v) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d);
}
function setSong(name) {
  const s = SONGS[name] || null;
  if (mus.song === s) return;
  mus.song = s; mus.step = 0; mus.next = AC ? AC.currentTime + 0.05 : 0;
}
function musicTick() {
  if (!AC || muted || !mus.song) return;
  const s = mus.song, len = 60 / s.bpm / 4;
  if (mus.next < AC.currentTime - 0.5) mus.next = AC.currentTime;
  while (mus.next < AC.currentTime + 0.15) {
    const i = mus.step % 16, t = mus.next;
    if (s.bass[i]) mTone(midi(s.bass[i]), t, len * 0.9, "triangle", 0.09);
    if (s.lead[i]) mTone(midi(s.lead[i]), t, len * 0.7, "square", 0.022);
    if (s.kick[i]) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.1);
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.12);
    }
    mus.step++; mus.next += len;
  }
}

  if (touchMode && state === "play") { ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fillRect(W / 2 - 60, 4, 2, 6); ctx.fillRect(W / 2 - 56, 4, 2, 6); }
  // arrows toward the last few enemies when they are off screen
  if (enemies.length && enemies.length <= 4) {
    for (const e of enemies) {
      const sx = e.x + e.w / 2 - cam.x, sy = e.y + e.h / 2 - cam.y;
      if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) continue;
      const ax = clamp(sx, 8, W - 8), ay = clamp(sy, 24, H - 10);
      const a = Math.atan2(sy - ay, sx - ax), blink = Math.floor(realT * 3) % 2;
      ctx.fillStyle = blink ? "#ff6b6b" : "#ffb0b0";
      for (let i = 0; i < 4; i++) for (let j = -i; j <= i; j++) ctx.fillRect(Math.round(ax + Math.cos(a) * (3 - i) - Math.sin(a) * j * 0.8), Math.round(ay + Math.sin(a) * (3 - i) + Math.cos(a) * j * 0.8), 1, 1);
    }
  }
}
function drawTouch() {
  if (!touchMode || state !== "play") return;
  for (const b of TBTN) {
    const on = touchBtn[b.id];
    ctx.globalAlpha = on ? 0.55 : 0.28;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.9;
    text(b.label, b.x, b.y - 2, "#000", 1, "center");
  }
  ctx.globalAlpha = 1;
}
function drawWorld() {
  const st = STAGES[stageIdx];
  drawBG(st);
  ctx.save();
  // smooth, capped shake: a damped wobble instead of random per-frame jumps
  const sk = Math.min(shake, 4);
  const sx = sk > 0.3 ? Math.round(Math.sin(realT * 70) * sk) : 0, sy = sk > 0.3 ? Math.round(Math.cos(realT * 57) * sk * 0.6) : 0;
  ctx.translate(sx + Math.round(kickX), sy + Math.round(kickY));
  drawTiles(st);
  drawFlag();
  for (const k of pickups) {
    const x = Math.round(k.x - cam.x), y = Math.round(k.y - cam.y + Math.sin(k.t * 4) * 1.5);
    if (k.type === "heart") drawHeart(x, y, true);
    else sprite(GEM, { c: "#5fd3ff", C: "#d8f6ff" }, x, y);
  }
  for (const e of enemies) drawEnemy(e);
  drawBoss();
  for (const b of bullets) {
    const x = b.x - cam.x, y = b.y - cam.y;
    if (b.kind === "arrow") { const a = Math.atan2(b.vy, b.vx); pixLine(x - Math.cos(a) * 6, y - Math.sin(a) * 6, x, y, "#d8c8a0"); ctx.fillStyle = "#fff"; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); continue; }
    if (b.kind === "wave") { ctx.fillStyle = "#ffb547"; ctx.fillRect(x - 5, y + 2, 10, 8); ctx.fillStyle = "#ffe08a"; ctx.fillRect(x - 3, y - 1, 6, 4); }
    else { ctx.fillStyle = b.c; ctx.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2); ctx.fillStyle = "#fff"; ctx.fillRect(x - 1, y - 1, 2, 2); }
  }

  for (const q of parts) { ctx.globalAlpha = clamp(q.life / q.ml, 0, 1); ctx.fillStyle = q.c; ctx.fillRect(Math.round(q.x - cam.x), Math.round(q.y - cam.y), q.sz || 1, q.sz || 1); }
  ctx.globalAlpha = 1;
  for (const f of fxs) {
    const p = f.t / f.dur;
    if (drawFxExtra(f, p)) continue;
    if (f.kind === "ring") { ctx.strokeStyle = f.c; ctx.globalAlpha = 1 - p; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x - cam.x, f.y - cam.y, f.max * p + 1, 0, TAU); ctx.stroke(); }
    else if (f.kind === "slashmark") { ctx.save(); ctx.translate(f.x - cam.x, f.y - cam.y); ctx.rotate(f.a); ctx.globalAlpha = 1 - p; ctx.fillStyle = f.c; const l = 10 + p * 8; ctx.fillRect(-l, -1, l * 2, 2); ctx.restore(); }
    else if (f.kind === "arc") { ctx.save(); ctx.translate(f.x - cam.x, f.y - cam.y); if (f.dir < 0) ctx.scale(-1, 1); ctx.strokeStyle = f.c; ctx.globalAlpha = 1 - p; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, f.r, f.from, lerp(f.from, f.to, Math.min(1, p * 1.3))); ctx.stroke(); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  for (const t of texts) {
    const a = clamp(t.t / t.ml * 2, 0, 1);
    ctx.globalAlpha = a;
    if (t.big) shadowText(t.s, t.x, t.y, t.c, 2, "center");
    else shadowText(t.s, t.x - cam.x, t.y - cam.y, t.c, t.num && t.t > t.ml - 0.1 ? 2 : 1, "center");
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0) { ctx.globalAlpha = clamp(flash * 2, 0, 0.3); ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawHUD();
}
function dim(a = 0.6) { ctx.fillStyle = "rgba(0,0,0," + a + ")"; ctx.fillRect(0, 0, W, H); }
function drawTitle(t) {
  const st = STAGES[titleSel];
  drawBG(st);
  ctx.fillStyle = st.ground; ctx.fillRect(0, 150, W, 30); ctx.fillStyle = st.grass; ctx.fillRect(0, 150, W, 3);
  // hero and a couple of monsters posing on the title screen
  ctx.save(); ctx.translate(24, 150);
  heroWithOutline({ legs: P_LEGS.wide, lean: 0, by: Math.sin(t * 2.5) > 0.3 ? 1 : 0, bob: 0, rot: 0, ang: -0.9 + Math.sin(t * 2) * 0.1, len: 14, back: 1.8 }, null, false);
  ctx.restore();
  spriteO(SLIME.norm, SLIME.pal, 302, 142, true);
  const tk = { dir: -1 };
  const th = drawHumanoid(tk, 284, 136, KN_PAL, KN_BODY, KN_LEGS.stand, 0, null);
  swordO(th.hx, th.hy, Math.PI - 0.9, 12, null, false);
  const bob = Math.sin(t * 2) * 2;
  const hue = Math.floor(t * 30) % 360;
  shadowText("BLADE RUSH", W / 2 + 1, 30 + bob, "#000", 4, "center");
  text("BLADE RUSH", W / 2 - 1, 28 + bob, "hsl(" + hue + ",90%,65%)", 4, "center");
  text("BLADE RUSH", W / 2, 28 + bob, "#fff", 4, "center");
  shadowText("A PIXEL ACTION GAME", W / 2, 58, "#ffb547", 1, "center");
  shadowText("< STAGE " + (titleSel + 1) + " >", W / 2, 68, "#fff", 2, "center");
  shadowText(st.name, W / 2, 81, "#9cc4ff", 1, "center");
  const bt = save.bestTime[String(titleSel)];
  if (bt) shadowText("BEST " + Math.floor(bt / 60) + ":" + String(Math.floor(bt % 60)).padStart(2, "0"), W / 2, 89, "#ddd", 1, "center");
  ["START", "CONTROLS"].forEach((label, i) => {
    const sel = i === titleItem, blink = sel && Math.floor(t * 3) % 2;
    shadowText((sel ? "> " : "") + label + (sel ? " <" : ""), W / 2, TITLE_ITEM_Y + i * 10, sel ? (blink ? "#fff" : "#ffe066") : "#9a9a9a", 1, "center");
  });
  shadowText("JUMP " + firstKey("jump") + "  ATTACK " + firstKey("attack") + "  DASH " + firstKey("dash") + "  PARRY " + firstKey("parry"), W / 2, 120, "#ccc", 1, "center");
  shadowText("PARRY JUST BEFORE A HIT, THEN ATTACK TO COUNTER", W / 2, 128, "#ffd27a", 1, "center");
  shadowText("HOLD ATTACK: SPIN   AIR DOWN+ATTACK: DIVE   WALL: SLIDE+JUMP", W / 2, 136, "#aaa", 1, "center");
  shadowText("DEFEAT EVERY ENEMY TO OPEN THE FLAG", W / 2, 144, "#999", 1, "center");
  shadowText("HI " + String(save.best).padStart(7, "0"), W - 4, 4, "#ffe066", 1, "right");
}
function drawPause() {
  drawWorld(); dim(0.6);
  shadowText("PAUSED", W / 2, 50, "#fff", 2, "center");
  for (let i = 0; i < PAUSE_ITEMS.length; i++) {
    const sel = i === pauseSel;
    shadowText((sel ? "> " : "  ") + PAUSE_ITEMS[i], W / 2, PAUSE_Y + i * 14, sel ? "#ffe066" : "#bbb", 1, "center");
  }
}
function drawControls(t) {
  if (ctrlFrom === "pause") { drawWorld(); dim(0.82); } else { drawBG(STAGES[titleSel]); dim(0.78); }
  shadowText("CONTROLS", W / 2, 6, "#ffe066", 2, "center");
  shadowText("KEY 1", CTRL_COL[0] + 35, 21, "#888", 1, "center");
  shadowText("KEY 2", CTRL_COL[1] + 35, 21, "#888", 1, "center");
  for (let i = 0; i < ACTIONS.length; i++) {
    const a = ACTIONS[i], y = CTRL_Y0 + i * CTRL_DY, rowSel = i === ctrlRow;
    shadowText(a.label, 30, y + 2, rowSel ? "#fff" : "#aaa");
    for (let c = 0; c < 2; c++) {
      const bx = CTRL_COL[c], sel = rowSel && c === ctrlCol, cap = capture && capture.action === a.id && capture.slot === c;
      ctx.fillStyle = cap ? "rgba(255,224,102,0.35)" : sel ? "rgba(255,224,102,0.18)" : "rgba(255,255,255,0.06)";
      ctx.fillRect(bx, y, 70, 9);
      ctx.strokeStyle = cap || sel ? "#ffe066" : "#444"; ctx.lineWidth = 1; ctx.strokeRect(bx + 0.5, y + 0.5, 69, 8);
      const code = binds[a.id][c];
      const label = cap ? (Math.floor(t * 4) % 2 ? "PRESS..." : "") : keyName(code);
      shadowText(label, bx + 35, y + 2, cap ? "#ffe066" : code ? "#fff" : "#666", 1, "center");
    }
  }
  const yr = CTRL_Y0 + ACTIONS.length * CTRL_DY + 4;
  ["RESET DEFAULTS", "BACK"].forEach((label, i) => {
    const sel = ctrlRow === ACTIONS.length + i;
    shadowText((sel ? "> " : "") + label + (sel ? " <" : ""), W / 2, yr + i * 11, sel ? "#ffe066" : "#bbb", 1, "center");
  });
  shadowText(capture ? "PRESS A KEY, CLICK A MOUSE BUTTON OR ROLL THE WHEEL.  ESC: CANCEL  DEL: CLEAR"
                     : "ENTER OR CLICK: CHANGE   DEL: CLEAR   ESC: BACK", W / 2, 158, capture ? "#ffe066" : "#999", 1, "center");
  if (ctrlMsgT > 0) shadowText(ctrlMsg, W / 2, 168, "#9cff9c", 1, "center");
}
function drawDead(t) {
  drawWorld(); dim(Math.min(0.7, t));
  shadowText("YOU FELL", W / 2, 60, "#ff5a5a", 3, "center");
  shadowText("SCORE " + score, W / 2, 90, "#fff", 1, "center");
  if (t > 1 && Math.floor(t * 2) % 2) shadowText(touchMode ? "TAP TO RETRY" : "ENTER: RETRY   Q: TITLE", W / 2, 110, "#fff", 1, "center");
}
function drawClear(t, win) {
  drawWorld(); dim(Math.min(0.7, t));
  shadowText(win ? "IRON KEEP FALLS" : "STAGE CLEAR", W / 2, 46, "#ffe066", win ? 2 : 3, "center");
  const m = Math.floor(timer / 60), s = Math.floor(timer % 60);
  const rows = [["TIME", m + ":" + String(s).padStart(2, "0")], ["KILLS", kills], ["MAX COMBO", maxCombo], ["BONUS", lastBonus], ["SCORE", score]];
  rows.forEach((r, i) => { if (t > 0.3 + i * 0.25) { shadowText(r[0], W / 2 - 50, 76 + i * 10, "#bbb"); shadowText(String(r[1]), W / 2 + 50, 76 + i * 10, "#fff", 1, "right"); } });
  if (win && t > 2) shadowText("THANK YOU FOR PLAYING", W / 2, 134, "#9cc4ff", 1, "center");
  if (t > 2 && Math.floor(t * 2) % 2) shadowText(win ? (touchMode ? "TAP: TITLE" : "ENTER: TITLE") : (touchMode ? "TAP: NEXT STAGE" : "ENTER: NEXT STAGE"), W / 2, 150, "#fff", 1, "center");
}

/* ---------- main loop ---------- */
let last = performance.now();
function stepFx(dt) {
  for (const q of parts) { q.life -= dt; if (q.g) q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  parts = parts.filter(q => q.life > 0);
  for (const f of fxs) f.t += dt;
  fxs = fxs.filter(f => f.t < f.dur);
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  stateT += dt; realT += dt;
  if (sysT > 0) sysT -= dt;
  if (ctrlMsgT > 0) ctrlMsgT -= dt;
  const decay = Math.pow(0.0004, dt); kickX *= decay; kickY *= decay;
  musicTick();
  if (state === "title") {
    if (mLeft()) stageStep(-1);
    if (mRight()) stageStep(1);
    if (mUp() || mDown()) { titleItem = 1 - titleItem; S.menu(); }
    if (mOk() && stateT > 0.3) titleChoose();
    if (state === "title") drawTitle(stateT);
  } else if (state === "controls") {
    updateControls(dt);
    if (state === "controls") drawControls(stateT);
  } else if (state === "play") {
    if (hitstop > 0) { hitstop -= dt; dt *= 0.05; }
    else if (slowT > 0) { slowT -= dt; dt *= 0.35; }
    if (shake > 0) shake = Math.max(0, shake - 40 * dt);
    if (flash > 0) flash -= dt;
    updateWorld(dt);
    drawWorld();
  } else if (state === "pause") {
    if (mUp()) { pauseSel = (pauseSel + PAUSE_ITEMS.length - 1) % PAUSE_ITEMS.length; S.menu(); }
    if (mDown()) { pauseSel = (pauseSel + 1) % PAUSE_ITEMS.length; S.menu(); }
    if (mOk() && stateT > 0.2) pauseChoose();
    else if (keys.KeyQ && !isBound("KeyQ")) toTitle();
    if (state === "pause") drawPause();
    else if (state === "controls") drawControls(stateT);
  } else if (state === "dead") {
    if (shake > 0) shake = Math.max(0, shake - 40 * dt);
    stepFx(dt);
    if (stateT > 1 && mOk()) { score = stageScore; startStage(stageIdx); }
    else if (stateT > 1 && keys.KeyQ && !isBound("KeyQ")) toTitle();
    if (state === "dead") drawDead(stateT);
  } else if (state === "clear" || state === "win") {
    stepFx(dt);
    updateCamera(dt);
    if (stateT > 2 && mOk()) { if (state === "win") toTitle(); else startStage(stageIdx + 1); }
    if (state === "clear" || state === "win") drawClear(stateT, state === "win");
  }
  drawTouch();
  if (sysT > 0) shadowText(sysMsg, W / 2, H - 10, "#fff", 1, "center");
  mouseOk = false;
  for (const k in pressed) pressed[k] = false;
  for (const k in touchBtn) touchPrev[k] = touchBtn[k];
}
toTitle();
cv.focus();
requestAnimationFrame(frame);
/* debug hook used by the automated smoke test */
window.__blade = {
  get: () => ({ state, stageIdx, score, player, boss, enemies: enemies ? enemies.length : 0, level: level && { w: level.w, arenaX: level.arenaX, gateOpen: level.gateOpen }, flag, flagOpen, timer }),
  list: () => enemies.map(e => ({ type: e.type, x: e.x, y: e.y, state: e.state })),
  tile: (tx, ty) => tileAt(tx, ty),
  start: n => { score = 0; startStage(n); },
  teleport: (x, y) => { player.x = x; player.y = y; player.vx = 0; player.vy = 0; player.safeX = x; player.safeY = y; player.scarf = null; },
  killAll: () => { for (const e of enemies) e.dead = true; },
  keepOnly: types => { enemies = enemies.filter(e => types.includes(e.type)); },
  god: () => { player.maxHp = 99; player.hp = 99; },
  bossHp: v => { if (boss) boss.hp = v; },
  binds: () => binds,
  shoot: (x, y, vx, vy, kind) => bullets.push({ x, y, vx, vy, r: 2, life: 3, c: "#ff6b6b", kind: kind || "bullet" }),
  bullets: () => bullets.map(b => ({ x: b.x, vx: b.vx, owner: b.owner || "", kind: b.kind })),
  bossSet: st => { if (boss) { bossSet(st); } },
  camRef: () => cam
};
})();
