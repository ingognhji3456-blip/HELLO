<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>셔틀 스매시</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="배드민턴 단식 게임. CPU나 친구와 랠리 포인트제로 겨룹니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Teko:wght@500;600&display=swap">
<style>
/* Layout: one arena screen. The 16:9 court canvas is fitted into the window; on touch screens the
   control pads float over its lower corners (landscape) or sit in a strip under it (portrait).
   Single dark look by choice: an indoor hall under floodlights. */
:root {
  color-scheme: dark;
  --hall: #0a1020;
  --ink: #eef2f8;
  --muted: #8e9bb5;
  --gold: #ffd23f;
  --gold-ink: #1a1405;
  --pad-bg: rgba(10, 16, 32, 0.46);
  --pad-edge: rgba(238, 242, 248, 0.3);
  --pad-on: rgba(255, 210, 63, 0.9);
  --p1: #2f6fe8;
  --p2: #ea5a3d;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Teko", "Arial Narrow", sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--hall);
  color: var(--ink);
  font: 14px/1.4 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { width: 100%; height: 100%; display: grid; place-items: center; }
#stage { position: relative; max-width: 100%; }
#cv {
  display: block;
  max-width: 100%;
  background: var(--hall);
  border-radius: 6px;
  touch-action: none;
  outline: none;
}
#cv:focus-visible { box-shadow: 0 0 0 2px var(--gold); }
#pads {
  position: absolute;
  inset: auto 0 0 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  padding: 0 2.2% 2.6%;
  pointer-events: none;
}
.grp { display: flex; align-items: flex-end; gap: calc(var(--bs) * 0.18); pointer-events: auto; touch-action: none; }
.grid { display: grid; grid-template-columns: repeat(2, var(--bs)); gap: calc(var(--bs) * 0.16); }
.b {
  width: var(--bs);
  height: var(--bs);
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid var(--pad-edge);
  background: var(--pad-bg);
  color: var(--ink);
  font: 600 calc(var(--bs) * 0.22)/1 var(--font-ui);
  display: grid;
  place-items: center;
  touch-action: none;
}
.b.mv { font-size: calc(var(--bs) * 0.34); width: calc(var(--bs) * 1.12); height: calc(var(--bs) * 1.12); }
.b.p1 { border-color: color-mix(in srgb, var(--p1) 70%, transparent); }
.b.p2 { border-color: color-mix(in srgb, var(--p2) 70%, transparent); }
.b.on { background: var(--pad-on); color: var(--gold-ink); border-color: var(--gold); }
#pads[hidden] { display: none; }
body.portrait #pads { position: static; padding: 14px 4px 8px; align-items: center; }
#turn { margin: 4px 0 0; text-align: center; color: var(--muted); font-size: 13px; }
body:not(.portrait) #turn { display: none; }
@media (prefers-reduced-motion: reduce) { .b { transition: none; } }
</style>
</head>
<body>
<main id="app">
  <div id="stage">
    <canvas id="cv" tabindex="0" aria-label="셔틀 스매시 배드민턴 게임 화면. 방향키로 이동, 위쪽 키로 점프, Z 스매시, X 클리어, C 드롭."></canvas>
    <div id="pads" hidden></div>
    <p id="turn">휴대폰을 가로로 돌리면 코트가 크게 보입니다</p>
  </div>
</main>
<script>
(() => {
"use strict";

/* ===================== constants ===================== */
const VW = 960, VH = 540;
// world: x = metres along the court (net at 0), y = height, z = depth (far side +)
const S = 56, CX = 480, FY = 446, DZX = 12, DZY = -11;
const COURT = 6.7, SHORT = 1.98, LONG_D = 5.94, NET_H = 1.55, NET_LOW = 0.79, HALF_W = 3.05, SINGLE_W = 2.59;
const G = 13, K = 0.15, DT = 1 / 240;          // shuttle: gravity and quadratic air drag
const MAXV = 5.2, ACC = 34, DEC = 28, AIR_ACC = 10, PG = 20, JUMP_V = 5.6, JUMP_APEX_T = JUMP_V / PG;
const XMIN = 0.42, XMAX = 8.2, SHOULDER = 1.42;
const SWING_OPEN = 0.03, SWING_CLOSE = 0.22, PERFECT = 0.86;
const TAU = Math.PI * 2;
const FD = '"Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const FU = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif';
const FN = '"Teko", "Arial Narrow", sans-serif';
const C = {
  ink: '#eef2f8', muted: '#8e9bb5', gold: '#ffd23f', goldInk: '#1a1405', line: '#eef3f6',
  inMark: '#8af5bf', outMark: '#ff6b57', panel: '#0e1729', edge: '#2a3a58'
};
const KITS = [
  { shirt: '#2f6fe8', trim: '#bcd3ff', shorts: '#13213f', skin: '#f0c6a2', skinB: '#d9a985', hair: '#1b1716', band: '#ffffff', frame: '#ffcc33', shoe: '#f4f6fa', sole: '#2f6fe8' },
  { shirt: '#ea5a3d', trim: '#ffd0c4', shorts: '#24161a', skin: '#c88a62', skinB: '#a8704d', hair: '#2e1d12', band: '#1b1b1b', frame: '#7fe0ff', shoe: '#f4f6fa', sole: '#ea5a3d' }
];
const AI_LV = [
  { name: '쉬움', speed: 0.8, react: 0.3, q: 0.5, noise: 1.5, smash: 0.22, smashMul: 0.82, jumpSmash: 0.15, judge: 0.8, whiff: 0.04, whiffFast: 0.3, smart: 0.25, shortServe: 0.35 },
  { name: '보통', speed: 0.92, react: 0.19, q: 0.68, noise: 1.1, smash: 0.42, smashMul: 0.92, jumpSmash: 0.5, judge: 0.35, whiff: 0.015, whiffFast: 0.14, smart: 0.65, shortServe: 0.55 },
  { name: '어려움', speed: 1.0, react: 0.12, q: 0.82, noise: 0.8, smash: 0.58, smashMul: 1.0, jumpSmash: 0.85, judge: 0.12, whiff: 0.005, whiffFast: 0.06, smart: 0.95, shortServe: 0.65 }
];
const SHOTS = ['smash', 'clear', 'drop'];
const KEYS = ['left', 'right', 'jump', 'smash', 'clear', 'drop'];
const BINDS_1P = [
  { left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], jump: ['ArrowUp', 'KeyW', 'Space'], smash: ['KeyZ', 'KeyJ'], clear: ['KeyX', 'KeyK'], drop: ['KeyC', 'KeyL'] }
];
const BINDS_2P = [
  { left: ['KeyA'], right: ['KeyD'], jump: ['KeyW'], smash: ['KeyF'], clear: ['KeyG'], drop: ['KeyH'] },
  { left: ['ArrowLeft'], right: ['ArrowRight'], jump: ['ArrowUp'], smash: ['Comma', 'Numpad1'], clear: ['Period', 'Numpad2'], drop: ['Slash', 'Numpad3'] }
];
const GAME_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Slash', 'Period', 'Comma']);
const SKEY = 'shuttle-smash-v1';
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ===================== helpers ===================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
function lerpAngle(a, b, t) { const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }
const easeIn = t => t * t;
const easeOut = t => 1 - (1 - t) ** 3;
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
const easeBack = t => { const c = 1.7; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PX = (x, z = 0) => CX + x * S + z * DZX;
const PY = (y, z = 0) => FY - y * S + z * DZY;
const sideOf = x => x < 0 ? 0 : 1;

/* ===================== canvas & layout ===================== */
const app = document.getElementById('app');
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const pads = document.getElementById('pads');
const ctx = cv.getContext('2d');
const bg = document.createElement('canvas');
const bgx = bg.getContext('2d');
let scale = 1;
let touchUI = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);

function fit() {
  const aw = app.clientWidth, ah = app.clientHeight;
  if (!aw || !ah) return;
  const portrait = touchUI && ah > aw * 1.05;
  document.body.classList.toggle('portrait', portrait);
  const padsH = portrait ? clamp(aw * 0.46, 150, 250) + 30 : 0;
  const w = Math.max(160, Math.min(aw, (ah - padsH) * 16 / 9));
  const h = w * 9 / 16;
  stage.style.width = w + 'px';
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  const bs = portrait ? clamp(aw * (settings.mode === 2 ? 0.105 : 0.16), 44, 76) : clamp(h * (settings.mode === 2 ? 0.11 : 0.135), 40, 74);
  stage.style.setProperty('--bs', bs + 'px');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  scale = cv.width / VW;
  bg.width = cv.width; bg.height = cv.height;
  bgx.setTransform(scale, 0, 0, scale, 0, 0);
  paintStatic(bgx);
}

/* ===================== audio ===================== */
const audio = { ctx: null, master: null, noise: null, muted: false };
function audioInit() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {}); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = new AC();
    audio.ctx = c;
    audio.master = c.createGain();
    audio.master.gain.value = audio.muted ? 0 : 0.55;
    audio.master.connect(c.destination);
    const len = Math.floor(c.sampleRate * 1.5);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    audio.noise = buf;
  } catch (e) { audio.ctx = null; }
}
function canPlay(ui) { return audio.ctx && !audio.muted && (ui || game.scene !== 'title'); }
function nz(dur, type, freq, q, gain, when = 0, attack = 0.002) {
  const c = audio.ctx, t = c.currentTime + when;
  const src = c.createBufferSource(); src.buffer = audio.noise;
  const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(audio.master);
  src.start(t, Math.random()); src.stop(t + dur + 0.05);
}
function tn(freq, dur, type, gain, when = 0, slide = 0) {
  const c = audio.ctx, t = c.currentTime + when;
  const o = c.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audio.master);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  hit(power) {
    if (!canPlay()) return;
    nz(0.05 + power * 0.04, 'bandpass', 2700 - power * 900, 1.1, 0.45 + power * 0.45);
    tn(330 - power * 140, 0.08, 'triangle', 0.22 + power * 0.22, 0, 0.45);
    if (power > 0.8) nz(0.14, 'highpass', 4800, 0.7, 0.28);
  },
  swish() { if (canPlay()) nz(0.13, 'bandpass', 1500, 0.9, 0.1, 0, 0.05); },
  net(v = 1) { if (!canPlay()) return; nz(0.2, 'lowpass', 650, 0.8, 0.45 * v); tn(105, 0.16, 'sine', 0.18 * v); },
  floor() { if (!canPlay()) return; nz(0.07, 'lowpass', 900, 0.7, 0.35); tn(150, 0.05, 'sine', 0.14); },
  cheer(level) {
    if (!canPlay()) return;
    nz(1.2 + level, 'bandpass', 950, 0.45, 0.14 + 0.2 * level, 0, 0.18);
    const n = Math.round(6 + level * 16);
    for (let i = 0; i < n; i++) nz(0.03, 'bandpass', rand(1400, 2600), 1.4, rand(0.05, 0.13), rand(0.05, 1.3));
  },
  click() { if (canPlay(true)) tn(880, 0.05, 'square', 0.05); },
  chime() { if (!canPlay()) return; [660, 880, 1320].forEach((f, i) => tn(f, 0.35, 'triangle', 0.12, i * 0.11)); }
};

/* ===================== state ===================== */
const settings = { mode: 1, diff: 1, points: 11, games: 1 };
const store = { rec: [{ w: 0, l: 0 }, { w: 0, l: 0 }, { w: 0, l: 0 }], bestRally: 0, bestKmh: 0 };
function loadStore() {
  try {
    const d = JSON.parse(localStorage.getItem(SKEY) || 'null');
    if (d) {
      Object.assign(settings, d.settings || {});
      if (Array.isArray(d.rec) && d.rec.length === 3) store.rec = d.rec;
      store.bestRally = d.bestRally || 0;
      store.bestKmh = d.bestKmh || 0;
    }
  } catch (e) { /* storage unavailable */ }
  if (![1, 2].includes(settings.mode)) settings.mode = 1;
  if (![0, 1, 2].includes(settings.diff)) settings.diff = 1;
  if (![11, 21].includes(settings.points)) settings.points = 11;
  if (![1, 3].includes(settings.games)) settings.games = 1;
}
function saveStore() {
  try { localStorage.setItem(SKEY, JSON.stringify({ settings, rec: store.rec, bestRally: store.bestRally, bestKmh: store.bestKmh })); } catch (e) { /* ignore */ }
}

const game = {
  scene: 'title', phase: 'serve', phaseT: 0, time: 0, clock: 0, paused: false,
  score: [0, 0], games: [0, 0], server: 0, rally: 0, history: [], stats: null, longest: 0,
  banner: null, shake: 0, hitstop: 0, netWob: 0, excite: 0, board: null, hintT: 0,
  predict: null, lastWinner: -1, winner: -1, focus: 0, menuFocus: 4, overT: 0
};
let players = [];
const sh = { state: 'held', x: 0, y: 1, vx: 0, vy: 0, rot: -Math.PI / 2, restRot: 0, acc: 0, ft: 0, last: -1, hitId: 0, kind: '', serve: false, netted: false, cord: false, trail: [], mark: null, spd: 0 };
const parts = [], rings = [], popups = [];
const inputs = [0, 1].map(() => ({ held: {}, hit: {} }));
const keys = new Set();
let touchHeld = {};
let uiHits = [];

function newStats() { return { smash: 0, maxKmh: 0, perfect: 0, winners: 0, errors: 0 }; }
function name(i) {
  if (game.scene === 'title') return '';
  return settings.mode === 1 ? (i === 0 ? '나' : 'CPU') : (i === 0 ? '1P' : '2P');
}

function makePlayer(i, lv) {
  const side = i === 0 ? -1 : 1;
  const p = { i, side, face: -side, x: side * 3.3, y: 0, vx: 0, vy: 0, onGround: true, swing: null, run: 0, land: 0, kit: KITS[i], speedMul: 1, ai: null, mood: null, pose: null };
  if (lv != null) {
    const L = AI_LV[lv];
    p.ai = { L, dir: 0, hit: {}, aim: 0, plan: null, seen: -1, react: 0, replan: 0, whiff: false, base: 3.5, serveT: 1 };
    p.speedMul = L.speed;
  }
  return p;
}

/* ===================== shuttle physics ===================== */
function stepPhys(o) {
  const v = Math.hypot(o.vx, o.vy);
  o.vx -= K * v * o.vx * DT;
  o.vy -= (G + K * v * o.vy) * DT;
  o.x += o.vx * DT;
  o.y += o.vy * DT;
}
// Same integrator as the live shuttle, so predictions and shot solving land exactly where play does.
function simulate(x, y, vx, vy, rec) {
  const o = { x, y, vx, vy };
  let t = 0, netY = null, apex = y, n = 0;
  const pts = rec ? [] : null;
  while (t < 6) {
    const ox = o.x, oy = o.y;
    stepPhys(o); t += DT;
    if (o.y > apex) apex = o.y;
    if (netY === null && (ox < 0) !== (o.x < 0)) {
      const f = ox / (ox - o.x);
      netY = oy + (o.y - oy) * f;
      if (rec && netY < NET_H) return { x: o.x, t, netY, apex, netted: true, pts };
    }
    if (rec && (++n & 1) === 0) pts.push({ t, x: o.x, y: o.y });
    if (o.y <= 0) break;
  }
  return { x: o.x, t, netY, apex, netted: netY !== null && netY < NET_H, pts };
}
function landD(x0, y0, dir, ang, spd) {
  const r = simulate(x0, y0, dir * Math.cos(ang) * spd, Math.sin(ang) * spd, false);
  r.d = r.x * dir;
  return r;
}
function solveSpeed(x0, y0, dir, ang, d, lo = 0.5, hi = 95) {
  for (let i = 0; i < 26; i++) { const m = (lo + hi) / 2; if (landD(x0, y0, dir, ang, m).d < d) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
function solveAngle(x0, y0, dir, spd, d, lo = -1.35, hi = 0.7) {
  for (let i = 0; i < 26; i++) { const m = (lo + hi) / 2; if (landD(x0, y0, dir, m, spd).d < d) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
const vel = (dir, ang, spd) => ({ vx: dir * Math.cos(ang) * spd, vy: Math.sin(ang) * spd, spd });
function clears(r, margin) { return r.netY !== null && r.netY >= NET_H + margin; }

// Fast flat shot: aim for depth d; if the line can't clear the tape, aim deeper, then take pace off.
function shotFast(x0, y0, dir, spd, d, margin) {
  for (let tries = 0; tries < 5; tries++) {
    for (let dd = d; dd <= 6.6; dd += 0.35) {
      const ang = solveAngle(x0, y0, dir, spd, dd);
      if (clears(landD(x0, y0, dir, ang, spd), margin)) return vel(dir, ang, spd);
    }
    spd *= 0.85;
  }
  let lo = -1.35, hi = 0.7;
  for (let i = 0; i < 26; i++) { const m = (lo + hi) / 2; if (clears(landD(x0, y0, dir, m, spd), margin)) hi = m; else lo = m; }
  return vel(dir, hi, spd);
}
// High shot: steep enough to clear the tape from where it is struck, apex kept under the roof of the screen.
function shotLob(x0, y0, dir, d) {
  const toNet = Math.max(0.05, -x0 * dir);
  const minA = Math.min(1.45, Math.atan2(NET_H + 0.35 - y0, toNet) + 0.12);
  let ang = Math.max(lerp(1.05, 0.68, clamp((d + toNet - 5) / 7.5, 0, 1)), minA);
  let spd = 10, ok = null;
  for (let k = 0; k < 10; k++) {
    spd = solveSpeed(x0, y0, dir, ang, d);
    const r = landD(x0, y0, dir, ang, spd);
    if (!clears(r, 0.1)) { ang = Math.min(1.52, ang + 0.08); continue; }
    ok = vel(dir, ang, spd);
    if (r.apex <= 6.4) break;
    if (ang - 0.06 >= minA) ang -= 0.06;
    else if (d > 3.5) d -= 0.5;
    else break;
  }
  return ok || vel(dir, ang, spd);
}
function shotSoft(x0, y0, dir, d, a0, a1, margin) {
  let best = null, alt = null;
  for (let a = a0; a <= a1 + 1e-6; a += 0.0873) {
    const spd = solveSpeed(x0, y0, dir, a, d, 0.3, 26);
    const r = landD(x0, y0, dir, a, spd);
    if (Math.abs(r.d - d) > 0.25) continue;
    const c = r.netY === null ? -9 : r.netY - NET_H;
    if (c >= margin) {
      const cost = r.t + 0.5 * (c - margin);
      if (!best || cost < best.cost) best = { a, spd, cost };
    } else if (!alt || c > alt.c) alt = { a, spd, c };
  }
  const b = best || alt || { a: 0.6, spd: 6 };
  return vel(dir, b.a, b.spd);
}

// Turn a button press into a trajectory. kind = which button, aim = -1 long / 0 / +1 short.
function planShot(p, kind, aim, q, serve) {
  const dir = p.face, x0 = sh.x, y0 = sh.y;
  const L = p.ai ? p.ai.L : null;
  const err = gauss() * (0.1 + (1 - q) * 0.6) * (L ? L.noise : 1);
  const toNet = -x0 * dir;
  const margin = 0.07 + (1 - q) * 0.35;

      return;
    }
    const disabled = m.key === 'diff' && settings.mode === 2;
    if (focused) { ctx.fillStyle = 'rgba(255,255,255,0.07)'; rr(ctx, X - 10, y, 392, 38, 8); ctx.fill(); }
    txt(m.label, X + 4, y + 24, `600 14px ${FU}`, C.muted);
    const val = disabled ? '2인 모드는 난이도 없음' : m.names[m.opts.indexOf(settings[m.key])];
    txt(val, X + 232, y + 24, `600 16px ${FU}`, disabled ? 'rgba(142,155,181,0.55)' : C.ink, 'center');
    if (!disabled) {
      ctx.fillStyle = focused ? C.gold : 'rgba(238,242,248,0.45)';
      ctx.beginPath(); ctx.moveTo(X + 104, y + 19); ctx.lineTo(X + 112, y + 13); ctx.lineTo(X + 112, y + 25); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(X + 360, y + 19); ctx.lineTo(X + 352, y + 13); ctx.lineTo(X + 352, y + 25); ctx.closePath(); ctx.fill();
    }
    uiHits.push({ x: X - 10, y, w: 232, h: 38, act: () => { game.menuFocus = idx; changeOpt(idx, -1); } });
    uiHits.push({ x: X + 222, y, w: 160, h: 38, act: () => { game.menuFocus = idx; changeOpt(idx, 1); } });
  });
  let rec;
  if (settings.mode === 1) { const r = store.rec[settings.diff]; rec = `CPU(${AI_LV[settings.diff].name}) 상대 전적 ${r.w}승 ${r.l}패`; }
  else rec = '2인 모드 · 왼쪽 파랑이 1P, 오른쪽 빨강이 2P';
  if (store.bestRally) rec += ` · 최장 랠리 ${store.bestRally}`;
  if (store.bestKmh) rec += ` · 최고 스매시 ${store.bestKmh} km/h`;
  txt(rec, X, 456, `400 13px ${FU}`, C.muted);
  controlsStrip(482);
}
function drawPause() {
  ctx.fillStyle = 'rgba(5,8,16,0.72)'; ctx.fillRect(0, 0, VW, VH);
  const x = 330, y = 120, w = 300;
  ctx.fillStyle = C.panel; rr(ctx, x, y, w, 270, 12); ctx.fill();
  ctx.strokeStyle = C.edge; ctx.lineWidth = 1; ctx.stroke();
  txt('일시정지', x + w / 2, y + 52, `34px ${FD}`, C.ink, 'center');
  const items = [['계속하기', () => togglePause(false)], ['처음부터', () => startMatch()], ['메뉴로', () => startDemo()]];
  items.forEach(([l, act], i) => button(x + 30, y + 82 + i * 58, w - 60, 46, l, i === 0, game.focus === i, act));
  game.menuItems = items.map(i => i[1]);
}
function drawOver() {
  const k = clamp(game.overT / 0.5, 0, 1);
  ctx.fillStyle = `rgba(5,8,16,${0.62 * k})`; ctx.fillRect(0, 0, VW, VH);
  if (game.overT < 0.25) { game.menuItems = []; return; }
  const x = 220, y = 58, w = 520, h = 420;
  ctx.fillStyle = C.panel; rr(ctx, x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = C.edge; ctx.lineWidth = 1; ctx.stroke();
  const wi = game.winner;
  ctx.fillStyle = KITS[wi].shirt; ctx.fillRect(x, y + 18, 6, 64);
  const head = settings.mode === 1 ? (wi === 0 ? '승리!' : '패배') : `${name(wi)} 승리!`;
  txt(head, x + 36, y + 70, `52px ${FD}`, settings.mode === 1 && wi === 1 ? C.ink : C.gold);
  const games = game.history.map(s => `${s[0]}–${s[1]}`).join('  ·  ');
  txt(`${name(0)} ${game.games[0]} : ${game.games[1]} ${name(1)}`, x + w - 36, y + 50, `600 18px ${FU}`, C.ink, 'right');
  txt(games, x + w - 36, y + 74, `500 22px ${FN}`, C.muted, 'right');
  const st = game.stats;
  const rows = [
    ['스매시', st[0].smash, st[1].smash],
    ['최고 스매시 속도', st[0].maxKmh ? st[0].maxKmh + ' km/h' : '–', st[1].maxKmh ? st[1].maxKmh + ' km/h' : '–'],
    ['퍼펙트 타구', st[0].perfect, settings.mode === 1 ? '–' : st[1].perfect],
    ['위너 (내 샷으로 득점)', st[0].winners, st[1].winners],
    ['실책 (아웃·네트·폴트)', st[0].errors, st[1].errors]
  ];
  const c1 = x + 330, c2 = x + 440, ty = y + 120;
  txt(name(0), c1, ty, `600 14px ${FU}`, KITS[0].trim, 'center');
  txt(name(1), c2, ty, `600 14px ${FU}`, KITS[1].trim, 'center');
  rows.forEach((r, i) => {
    const ry = ty + 16 + i * 34;
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.06)';
    ctx.fillRect(x + 28, ry, w - 56, 32);
    txt(r[0], x + 44, ry + 21, `400 14px ${FU}`, C.muted);
    txt(String(r[1]), c1, ry + 21, `600 15px ${FU}`, C.ink, 'center');
    txt(String(r[2]), c2, ry + 21, `600 15px ${FU}`, C.ink, 'center');
  });
  txt(`최장 랠리 ${game.longest}타`, x + 44, y + 330, `600 14px ${FU}`, C.ink);
  const items = [['다시 하기', () => startMatch()], ['메뉴로', () => startDemo()]];
  items.forEach(([l, act], i) => button(x + 28 + i * 240, y + h - 72, 224, 48, l, i === 0, game.focus === i, act));
  game.menuItems = items.map(i => i[1]);
}
function draw() {
  if (staticDirty) paintStatic(bgx);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  uiHits = [];
  drawWorld();
  if (game.scene === 'title') drawTitle();
  drawHUD();
  if (game.scene === 'play' && game.paused) drawPause();
  if (game.scene === 'over') drawOver();
}

/* ===================== input ===================== */
function keyEdge(code) {
  const binds = settings.mode === 2 ? BINDS_2P : BINDS_1P;
  binds.forEach((b, i) => { for (const k of KEYS) if (b[k].includes(code)) inputs[i].hit[k] = true; });
}
const isUp = c => c === 'ArrowUp' || c === 'KeyW';
const isDown = c => c === 'ArrowDown' || c === 'KeyS';
const isLeft = c => c === 'ArrowLeft' || c === 'KeyA';
const isRight = c => c === 'ArrowRight' || c === 'KeyD';
const isOk = c => c === 'Enter' || c === 'NumpadEnter' || c === 'Space' || c === 'KeyZ' || c === 'KeyJ';
function menuKey(c) {
  const skip = i => MENU[i].key === 'diff' && settings.mode === 2;
  if (isUp(c) || isDown(c)) {
    let i = game.menuFocus;
    do { i = (i + (isUp(c) ? -1 : 1) + MENU.length) % MENU.length; } while (skip(i));
    game.menuFocus = i; sfx.click();
  } else if (isLeft(c) || isRight(c)) { changeOpt(game.menuFocus, isLeft(c) ? -1 : 1); sfx.click(); }
  else if (c === 'Enter' || c === 'NumpadEnter') { sfx.click(); startMatch(); }
  else if (isOk(c)) { sfx.click(); if (MENU[game.menuFocus].key === 'start') startMatch(); else changeOpt(game.menuFocus, 1); }
}
function listKey(c) {
  const items = game.menuItems || [];
  if (!items.length) return;
  if (isUp(c) || isLeft(c)) { game.focus = (game.focus - 1 + items.length) % items.length; sfx.click(); }
  else if (isDown(c) || isRight(c)) { game.focus = (game.focus + 1) % items.length; sfx.click(); }
  else if (isOk(c)) { sfx.click(); items[clamp(game.focus, 0, items.length - 1)](); }
}
addEventListener('keydown', e => {
  const c = e.code;
  if (GAME_KEYS.has(c)) e.preventDefault();
  audioInit();
  if (e.repeat) return;
  keys.add(c);
  if (c === 'KeyM') { toggleMute(); return; }
  if (game.scene === 'title') { menuKey(c); return; }
  if (game.scene === 'over') { listKey(c); return; }
  if (c === 'Escape' || c === 'KeyP') { togglePause(); return; }
  if (game.paused) { listKey(c); return; }
  keyEdge(c);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); touchHeld = {}; });
document.addEventListener('visibilitychange', () => { if (document.hidden && game.scene === 'play') togglePause(true); });

cv.addEventListener('pointerdown', e => {
  audioInit();
  if (e.pointerType === 'touch' && !touchUI) { touchUI = true; fit(); updatePads(); }
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * VW, y = (e.clientY - r.top) / r.height * VH;
  for (let i = uiHits.length - 1; i >= 0; i--) {
    const h = uiHits[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { e.preventDefault(); sfx.click(); h.act(); return; }
  }
});

// touch pads: each finger maps to whichever button is under it, so sliding between buttons works
const ptrs = new Map();
const LABEL = { left: '◀', right: '▶', jump: '점프', smash: '스매시', clear: '클리어', drop: '드롭' };
function padGroup(pl, keysList, side) {
  const btn = k => `<button type="button" tabindex="-1" class="b p${pl + 1}${k === 'left' || k === 'right' ? ' mv' : ''}" data-p="${pl}" data-k="${k}" aria-label="${pl + 1}P ${LABEL[k]}">${LABEL[k]}</button>`;
  const moves = keysList.filter(k => k === 'left' || k === 'right').map(btn).join('');
  const acts = keysList.filter(k => k !== 'left' && k !== 'right');
  const grid = acts.length ? `<div class="grid">${(side === 'r' ? ['drop', 'jump', 'clear', 'smash'] : ['jump', 'drop', 'smash', 'clear']).filter(k => acts.includes(k)).map(btn).join('')}</div>` : '';
  return `<div class="grp ${side}">${side === 'r' ? moves + grid : moves + grid}</div>`;
}
function updatePads() {
  const show = touchUI && game.scene === 'play' && !game.paused;
  pads.hidden = !show;
  const sig = settings.mode + ':' + touchUI;
  if (pads.dataset.sig !== sig) {
    pads.dataset.sig = sig;
    pads.innerHTML = settings.mode === 1
      ? padGroup(0, ['left', 'right'], 'l') + padGroup(0, ['jump', 'drop', 'clear', 'smash'], 'r')
      : padGroup(0, ['left', 'right', 'jump', 'drop', 'clear', 'smash'], 'l') + padGroup(1, ['left', 'right', 'jump', 'drop', 'clear', 'smash'], 'r');
    pads.querySelectorAll('.grp').forEach(gp => {
      gp.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); try { gp.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ } trackPtr(e); });
      gp.addEventListener('pointermove', e => { if (ptrs.has(e.pointerId)) trackPtr(e); });
      const end = e => { ptrs.delete(e.pointerId); syncPads(); };
      gp.addEventListener('pointerup', end);
      gp.addEventListener('pointercancel', end);
      gp.addEventListener('contextmenu', e => e.preventDefault());
    });
  }
  if (!show) { ptrs.clear(); syncPads(); }
  fit();
}
function trackPtr(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const b = el && el.closest ? el.closest('.b') : null;
  const key = b ? b.dataset.p + ':' + b.dataset.k : null;
  if (ptrs.get(e.pointerId) === key && ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, key);
  if (key && game.scene === 'play' && !game.paused) { const [pl, k] = key.split(':'); inputs[+pl].hit[k] = true; }
  syncPads();
}
function syncPads() {
  touchHeld = {};
  for (const v of ptrs.values()) if (v) touchHeld[v] = true;
  pads.querySelectorAll('.b').forEach(b => b.classList.toggle('on', !!touchHeld[b.dataset.p + ':' + b.dataset.k]));
}

/* ===================== boot ===================== */
let lastT = 0, glyphT = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  tick(dt);
  draw();
  glyphT += dt;
  if (glyphT > 0.4) { glyphT = 0; flushGlyphs(); }
  requestAnimationFrame(frame);
}
function snapshot() {
  return {
    settings: Object.assign({}, settings),
    match: game.scene === 'play' ? { score: game.score, games: game.games, server: game.server, history: game.history, stats: game.stats, longest: game.longest } : null
  };
}
function boot(data) {
  loadStore();
  if (data && data.settings) Object.assign(settings, data.settings);
  if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(app);
  addEventListener('resize', fit);
  fit();
  if (data && data.match) startMatch(data.match); else startDemo();
  flushGlyphs();
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(snapshot);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
