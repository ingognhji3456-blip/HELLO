<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Striker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Do+Hyeon&display=swap">
<style>
/* Layout: arcade cabinet. The game screen takes the full viewport height; controls sit below it. Single dark look by choice. */
:root {
  --void: #0d0b14;
  --panel: #18131f;
  --line: #2c2338;
  --ink: #ece6f6;
  --muted: #9087a3;
  --eye: #ff3d5a;
  --glow: #5fd3ff;
  --font-display: "Silkscreen", ui-monospace, "Courier New", monospace;
  --font-body: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
}
.wrap {
  padding-inline: 16px;
  padding-block: 10px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
header {
  width: 100%;
  max-width: 720px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 24px;
  letter-spacing: 0.06em;
  color: var(--ink);
  text-shadow: 3px 3px 0 var(--eye);
}
header p { margin: 0; color: var(--muted); flex: 1; min-width: 0; }
button {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  padding: 4px 10px;
  cursor: pointer;
}
button:hover { border-color: var(--glow); }
button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.screen {
  width: min(100%, calc((100vh - 76px) * 0.75));
  width: min(100%, calc((100dvh - 76px) * 0.75));
  min-width: min(100%, 240px);
  border: 4px solid var(--line);
  box-shadow: 0 0 0 4px var(--void), 0 0 0 6px var(--line);
  background: #000;
}
.screen:fullscreen {
  width: min(100vw, 75vh);
  border: 0;
  box-shadow: none;
  margin: auto;
}
.screen:fullscreen::backdrop { background: #000; }
canvas {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 3 / 4;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  outline: none;
}
.help {
  width: 100%;
  max-width: 520px;
  box-sizing: border-box;
  margin-top: 8px;
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 14px 16px;
  display: grid;
  gap: 8px;
}
.help h2 {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 13px;
  letter-spacing: 0.12em;
  color: var(--glow);
}
.row { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; align-items: center; }
.row > span:first-child { color: var(--muted); }
kbd {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--ink);
  background: var(--void);
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  padding: 1px 6px;
  margin-right: 4px;
  white-space: nowrap;
}
.note { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.note b { color: var(--eye); font-weight: 400; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>STRIKER</h1>
    <p>전투기 로봇의 공격을 피하고 격추하라</p>
    <button id="fs" type="button">전체화면</button>
  </header>
  <div class="screen" id="screen"><canvas id="game" width="240" height="320" tabindex="0" aria-label="게임 화면"></canvas></div>
  <section class="help">
    <h2>CONTROLS</h2>
    <div class="row"><span>이동</span><span><kbd>←↑↓→</kbd><kbd>WASD</kbd></span></div>
    <div class="row"><span>정밀 이동</span><span><kbd>SHIFT</kbd> 느려지고 판정점이 보임</span></div>
    <div class="row"><span>대시 (무적)</span><span><kbd>SPACE</kbd><kbd>X</kbd></span></div>
    <div class="row"><span>공격</span><span>자동 발사</span></div>
    <div class="row"><span>기타</span><span><kbd>P</kbd>일시정지 <kbd>M</kbd>소리 <kbd>F</kbd>전체화면</span></div>
    <div class="row"><span>모바일</span><span>드래그로 이동, 두 번 탭하면 대시</span></div>
    <p class="note"><b>STRIKER</b>는 기수를 돌려 조준하는 전투기형 로봇입니다. 날개 밑 개틀링, 날개 미사일, 폭탄창 폭격, 애프터버너 돌진, 급강하로 공격합니다. 빨간 띠, 표적, 그림자가 공격을 예고하고, 체력 66%와 33%에서 페이즈가 바뀝니다.</p>
  </section>
</main>

<script>
(() => {
"use strict";
const W = 240, H = 320, TAU = Math.PI * 2;
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

/* ---------- 3x5 bitmap font ---------- */
const GLYPHS = {
  "0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001111001111",
  "4":"101101111001001","5":"111100111001111","6":"111100111101111","7":"111001010010010",
  "8":"111101111101111","9":"111101111001111",
  A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",
  E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",
  I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",
  M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",
  Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",
  U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",
  Y:"101101010010010",Z:"111001010100111",
  ":":"000010000010000",".":"000000000000010","!":"010010010000010","-":"000000111000000",
  "/":"001001010100100","%":"101001010100101","<":"001010100010001",">":"100010001010100",
  "*":"000101010101000"," ":"000000000000000"
};
function text(s, x, y, c, sc = 1, align = "left") {
  s = String(s).toUpperCase();
  const w = s.length * 4 * sc - sc;
  if (align === "center") x -= Math.floor(w / 2);
  else if (align === "right") x -= w;
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = c;
  for (let i = 0; i < s.length; i++) {
    const g = GLYPHS[s[i]];
    if (!g) continue;
    for (let p = 0; p < 15; p++) {
      if (g[p] === "1") ctx.fillRect(x + i * 4 * sc + (p % 3) * sc, y + Math.floor(p / 3) * sc, sc, sc);
    }
  }
}
function shadowText(s, x, y, c, sc, align) {
  text(s, x + sc, y + sc, "#000", sc, align);
  text(s, x, y, c, sc, align);
}

/* ---------- sprites ---------- */
function sprite(rows, pal, x, y, override) {
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      const k = rows[r][c];
      if (k === ".") continue;
      ctx.fillStyle = override || pal[k];
      ctx.fillRect(x + c, y + r, 1, 1);
    }
  }
}
const PLAYER = [
  ".....w.....",
  "....wbw....",
  "....aba....",
  "...aacaa...",
  "...acwca...",
  "..aaacaaa..",
  ".aaaacaaaa.",
  "aaaaacaaaaa",
  "aa.aaaaa.aa",
  "a...d.d...a",
  "....d.d...."
];
const PCOL = { a: "#5fd3ff", b: "#2b6cb0", c: "#e8fbff", w: "#ffffff", d: "#ffb347" };
const HEART = [".11.11.", "1111111", "1111111", ".11111.", "..111..", "...1..."];

/* ---------- audio ---------- */
let actx = null, muted = false;
function initAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    else if (actx.state === "suspended") actx.resume();
  } catch (e) { actx = null; }
}
function sfx(f, d, type = "square", v = 0.05, f2 = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + d);
}
function noise(d, v = 0.12) {
  if (!actx || muted) return;
  const len = Math.floor(actx.sampleRate * d);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = buf; g.gain.value = v;
  src.connect(g).connect(actx.destination);
  src.start();
}

/* ---------- fullscreen ---------- */
const screenEl = document.getElementById("screen");
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else screenEl.requestFullscreen?.().catch(() => {});
  } catch (e) {}
  cv.focus();
}
document.getElementById("fs").addEventListener("click", toggleFullscreen);

/* ---------- input ---------- */
const keys = {}, pressed = {};
const GAME_KEYS = ["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "shift"];
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (GAME_KEYS.includes(k)) e.preventDefault();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if (k === "f" && !e.repeat) toggleFullscreen();
  initAudio();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; if (state === "play") state = "pause"; });

const touch = { active: false, ids: new Set(), lx: 0, ly: 0, lastTap: 0, dash: false };
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  initAudio();
  cv.focus();
  touch.ids.add(e.pointerId);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (state !== "play") {
    const rect = cv.getBoundingClientRect();
    pressed.tap = (e.clientX - rect.left) / rect.width;
    return;
  }
  const now = performance.now();
  if (touch.ids.size > 1 || now - touch.lastTap < 260) touch.dash = true;
  touch.lastTap = now;
  touch.active = true;
  touch.lx = e.clientX; touch.ly = e.clientY;
});
cv.addEventListener("pointermove", e => {
  if (!touch.active || !touch.ids.has(e.pointerId) || state !== "play") return;
  const rect = cv.getBoundingClientRect();
  const k = W / rect.width;
  const dx = (e.clientX - touch.lx) * k, dy = (e.clientY - touch.ly) * k;
  touch.lx = e.clientX; touch.ly = e.clientY;
  if (player.dashT <= 0) { player.x += dx; player.y += dy; }
  if (Math.abs(dx) + Math.abs(dy) > 0.5) {
    const l = Math.hypot(dx, dy); player.dx = dx / l; player.dy = dy / l;
  }
});
function endPointer(e) {
  touch.ids.delete(e.pointerId);
  if (touch.ids.size === 0) touch.active = false;
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

/* ---------- helpers ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
function angTo(x, y) { return Math.atan2(player.y - y, player.x - x); }
function angDiff(a, b) { return Math.atan2(Math.sin(b - a), Math.cos(b - a)); }
function turnToward(a, b, max) { return a + clamp(angDiff(a, b), -max, max); }
function fire(x, y, a, sp, o = {}) {
  const b = {
    x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 2, c: "#ffd166", kind: "orb",
    grav: 0, home: 0, homeT: 0, accel: 0, max: 0, ignite: 0, boomY: 0, boomN: 0, life: 0
  };
  bullets.push(Object.assign(b, o));
}
function ring(x, y, n, sp, off, o) { for (let i = 0; i < n; i++) fire(x, y, off + i * TAU / n, sp, o); }
function burst(x, y, c, n = 8, sp = 60) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = Math.random() * sp;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.6), max: 0.6, c, s: Math.random() < 0.3 ? 2 : 1 });
  }
}
function smoke(x, y, n = 1) {
  for (let i = 0; i < n; i++) parts.push({ x: x + rand(-1, 1), y: y + rand(-1, 1), vx: rand(-8, 8), vy: rand(-12, -2), life: rand(0.3, 0.6), max: 0.6, c: Math.random() < 0.5 ? "#5a5566" : "#7a7488", s: 2 });
}
let g = ctx;  // current paint target
function r(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }

/* ---------- pattern runner (generators yield seconds to wait; 0 = next frame) ---------- */
let DT = 0;
function runner(gen) { return { gen, w: 0, done: false }; }
function stepRunner(rn) {
  if (rn.done) return;
  rn.w -= DT;
  while (rn.w <= 0) {
    const n = rn.gen.next();
    if (n.done) { rn.done = true; return; }
    if (!n.value || n.value <= 0) { rn.w = 0; return; }
    rn.w += n.value;
  }
}
function* parallel(...gens) {
  const rs = gens.map(runner);
  while (rs.some(x => !x.done)) { rs.forEach(stepRunner); yield 0; }
}

/* =========================================================
   STRIKER: jet fighter robot.
   The sprite is painted nose-down into an offscreen canvas and drawn
   rotated to boss.ang, so every weapon has a real position on the hull.
   ========================================================= */
const BOSS_HP = 1000;
const DOWN = Math.PI / 2;
// missile pylons under the wings (sprite pixel coords, 2x6 each)
const PYLONS = [{ sx: 5, sy: 14 }, { sx: 10, sy: 17 }, { sx: 41, sy: 14 }, { sx: 36, sy: 17 }];
const GUNS = [{ sx: 16 }, { sx: 30 }];  // gatling barrels left / right
const SPR_OX = 16, SPR_OY = 20;          // sprite origin inside the 80x80 offscreen canvas (center 40,40)

// local sprite pixel -> world position, following the boss rotation
function hull(sx, sy) {
  const lx = sx - 24, ly = sy - 20;
  const th = boss.ang - DOWN, c = Math.cos(th), s = Math.sin(th);
  return { x: boss.x + lx * c - ly * s, y: boss.y + lx * s + ly * c };
}
function engineTrail(n = 1, c1 = "#ff8a3d", c2 = "#ffd166") {
  for (const ex of [21.5, 26.5]) {
    for (let i = 0; i < n; i++) {
      const p = hull(ex, -2 - boss.burn * 2);
      parts.push({ x: p.x + rand(-1, 1), y: p.y + rand(-1, 1), vx: 0, vy: 0, life: 0.25, max: 0.25, c: Math.random() < 0.5 ? c1 : c2, s: 2 });
    }
  }
}
function speedLines() {
  const a = boss.ang;
  const p = hull(rand(0, 48), rand(0, 40));
  parts.push({ x: p.x, y: p.y, vx: -Math.cos(a) * 160, vy: -Math.sin(a) * 160, life: 0.12, max: 0.12, c: "#ece6f6", s: 1 });
}
function shock(x, y, max, c = "#ffd166") { shocks.push({ x, y, max, life: 0.35, ml: 0.35, c }); }

/* --- gatling: turns to track you, barrels spin up, fires from both muzzles --- */
function* sGatling() {
  boss.face = "manual"; boss.turn = 2.5;
  sfx(120, 0.75, "sawtooth", 0.04, 800);
  for (let t = 0; t < 0.75; t += DT) {
    boss.tAng = angTo(boss.x, boss.y);
    boss.spool = t / 0.75;
    yield 0;
  }
  boss.turn = 0.35 + boss.phase * 0.08;
  boss.tx = clamp(boss.x + rand(-50, 50), 40, W - 40);
  const dur = 1.6 + boss.phase * 0.4;
  let side = 0, f = 0;
  for (let t = 0; t < dur; t += DT) {
    boss.tAng = angTo(boss.x, boss.y);
    boss.spool = 1;
    f += DT;
    while (f >= 0.065) {
      f -= 0.065; side ^= 1;
      const gun = GUNS[side];
      const m = hull(gun.sx + 1, 37);
      fire(m.x, m.y, boss.ang + rand(-0.06, 0.06), 150, { kind: "tracer" });
      boss.gunFlash[side] = 0.05;
      const e = hull(side ? 33 : 14, 28);
      parts.push({ x: e.x, y: e.y, vx: (side ? 1 : -1) * rand(20, 50), vy: rand(-40, -10), life: 0.4, max: 0.4, c: "#d4a017", s: 1 });
      boss.x -= Math.cos(boss.ang) * 0.5; boss.y -= Math.sin(boss.ang) * 0.5;
      if (side) sfx(240, 0.04, "square", 0.02);
    }
    yield 0;
  }
  sfx(700, 0.5, "sawtooth", 0.02, 100);
  for (let t = 0; t < 0.4; t += DT) { boss.spool = 1 - t / 0.4; yield 0; }
  boss.spool = 0; boss.face = "idle"; boss.turn = 3;
  yield 0.4;
}

/* --- missiles: dropped off the wing pylons one by one, ignite, then home in --- */
function* sMissiles() {
  const volleys = boss.phase >= 2 ? 2 : 1;
  for (let v = 0; v < volleys; v++) {
    for (const i of [1, 3, 0, 2]) {
      if (!boss.ammo[i]) continue;
      boss.ammo[i] = 0;
      const pl = PYLONS[i];
      const p = hull(pl.sx + 1, pl.sy + 3);
      const out = pl.sx < 24 ? -1 : 1;
      fire(p.x, p.y, boss.ang - out * 0.5, 45, { kind: "missile", c: "#ff8a3d", home: 2.4 + boss.phase * 0.3, homeT: 1.6, accel: 160, max: 125 + boss.phase * 10, ignite: 0.3 });
      smoke(p.x, p.y, 4);
      sfx(180, 0.12, "square", 0.03, 90);
      yield 0.22 - boss.phase * 0.03;
    }
    yield 0.5;
    boss.reload = 0.6;
    sfx(900, 0.05, "square", 0.02);
    yield 0.6;
    boss.ammo = [1, 1, 1, 1];
    sfx(1200, 0.05, "square", 0.02);
  }
  yield 0.6;
}

/* --- ram: turns to face you, afterburner charges, then rams straight through --- */
function* sRam() {
  const n = boss.phase + 1;
  boss.lock = true; boss.face = "manual";
  for (let k = 0; k < n; k++) {
    const aimTime = 0.9 - boss.phase * 0.1;
    boss.turn = 7;
    sfx(200, aimTime, "sawtooth", 0.035, 1100);
    let a = boss.ang;
    for (let t = 0; t < aimTime; t += DT) {
      if (t < aimTime - 0.22) a = angTo(boss.x, boss.y);
      boss.tAng = a; boss.aim = a; boss.aimT = aimTime - t;
      boss.tBurn = 0.4 + 3 * (t / aimTime);
      boss.rattle = 0.05;
      boss.x -= Math.cos(a) * 16 * DT; boss.y -= Math.sin(a) * 16 * DT;
      if (Math.random() < 0.6) engineTrail(1);
      yield 0;
    }
    boss.ang = a; boss.tAng = a; boss.aimT = 0; boss.burn = boss.tBurn = 4.5;
    noise(0.35, 0.12); sfx(140, 0.45, "sawtooth", 0.06, 60); shake = 4;
    const sp = 330 + boss.phase * 30;
    const vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
    let f = 0;
    while (boss.x > -40 && boss.x < W + 40 && boss.y > -60 && boss.y < H + 40) {
      boss.x += vx * DT; boss.y += vy * DT;
      engineTrail(2); speedLines();
      f += DT;
      if (boss.phase >= 2 && f >= 0.09) {
        f = 0;
        for (const side of [-1, 1]) {
          const tip = hull(side < 0 ? 1 : 46, 9);
          fire(tip.x, tip.y, a + side * DOWN, 38, { c: "#ff8a3d" });
        }
      }
      yield 0;
    }
    // loop around and come back in from the top
    boss.burn = boss.tBurn = 1.8;
    boss.ang = boss.tAng = DOWN;
    boss.x = rand(40, W - 40); boss.y = -50;
    while (boss.y < 70) { boss.y += 230 * DT; engineTrail(1); yield 0; }
    boss.tBurn = 1;
    yield 0.15;
  }
  boss.tx = boss.x; boss.ty = 70; boss.lock = false; boss.face = "idle"; boss.turn = 3;
  yield 0.6;
}

/* --- bombing run: banks out sideways, crosses the screen with the bay open --- */
function* sBomb() {
  boss.lock = true; boss.face = "manual"; boss.turn = 5;
  const passes = boss.phase >= 2 ? 2 : 1;
  let dir = boss.x < W / 2 ? 1 : -1;
  // turn toward the near edge and leave
  boss.tAng = dir > 0 ? Math.PI : 0;
  sfx(300, 0.5, "sawtooth", 0.03, 150);
  yield 0.4;
  boss.tBurn = 3;
  while (boss.x > -40 && boss.x < W + 40) { boss.x -= dir * 260 * DT; engineTrail(1); yield 0; }
  for (let p = 0; p < passes; p++) {
    const y = clamp(player.y - 95, 50, 140);
    warns.push({ type: "band", y, h: 30, t: 0.8, max: 0.8 });
    boss.y = y; boss.x = dir > 0 ? -40 : W + 40;
    boss.ang = boss.tAng = dir > 0 ? 0 : Math.PI;
    boss.burn = boss.tBurn = 2.5;
    sfx(120, 0.9, "sawtooth", 0.05, 420);
    yield 0.8;
    boss.bay = 1;
    sfx(400, 0.1, "square", 0.03, 200);
    const sp = 200 + boss.phase * 20;
    const every = 0.2 - boss.phase * 0.03;
    let f = every;
    while (dir > 0 ? boss.x < W + 40 : boss.x > -40) {
      boss.x += dir * sp * DT;
      engineTrail(1);
      f += DT;
      if (f >= every && boss.x > 10 && boss.x < W - 10) {
        f = 0;
        const vx0 = dir * 35, vy0 = 10, gr = 150;
        const boomY = clamp(player.y + rand(-30, 30), y + 45, H - 12);
        const dy = boomY - boss.y;
        const tf = (-vy0 + Math.sqrt(vy0 * vy0 + 2 * gr * dy)) / gr;
        warns.push({ type: "mark", x: boss.x + vx0 * tf, y: boomY, t: tf, max: tf });
        fire(boss.x, boss.y, Math.atan2(vy0, vx0), Math.hypot(vx0, vy0), { kind: "bomb", r: 3, grav: gr, boomY, boomN: 5 + boss.phase * 2, c: "#3a404d" });
        sfx(220, 0.08, "square", 0.02, 110);
      }
      yield 0;
    }
    boss.bay = 0;
    dir = -dir;
  }
  boss.burn = boss.tBurn = 1.8;
  boss.ang = boss.tAng = DOWN;
  boss.x = W / 2; boss.y = -50;
  while (boss.y < 70) { boss.y += 200 * DT; engineTrail(1); yield 0; }
  boss.tBurn = 1; boss.tx = boss.x; boss.ty = 70;
  boss.lock = false; boss.face = "idle"; boss.turn = 3;
  yield 0.8;
}

/* --- dive: pitches nose-up, climbs out, then dives nose-first onto its shadow --- */
function* sDive() {
  const times = boss.phase === 3 ? 2 : 1;
  boss.lock = true; boss.face = "manual"; boss.turn = 8;
  for (let k = 0; k < times; k++) {
    boss.tAng = -DOWN; boss.tBurn = 0.5;
    sfx(250, 0.5, "sawtooth", 0.04, 800);
    yield 0.45;
    boss.tBurn = 3.5;
    let v = 0;
    while (boss.y > -60) { v = Math.min(400, v + 900 * DT); boss.y -= v * DT; engineTrail(2); yield 0; }
    const w = { type: "shadow", x: player.x, y: player.y, r: 10, t: 99, max: 99 };
    warns.push(w);
    for (let t = 0; t < 1.0; t += DT) {
      w.x += (player.x - w.x) * Math.min(1, DT * 6);
      w.y += (player.y - w.y) * Math.min(1, DT * 6);
      w.r = 10 + t * 8;
      yield 0;
    }
    w.x = clamp(w.x, 26, W - 26); w.y = clamp(w.y, 60, H - 30);
    w.locked = true;
    sfx(1400, 0.6, "square", 0.02, 300);
    for (let t = 0; t < 0.45; t += DT) { w.r = 18 + t * 10; yield 0; }
    boss.x = w.x; boss.ang = boss.tAng = DOWN; boss.burn = boss.tBurn = 4.5;
    while (boss.y < w.y) { boss.y += 600 * DT; engineTrail(2); speedLines(); yield 0; }
    boss.y = w.y; w.t = 0;
    shake = 13; noise(0.45, 0.2); sfx(55, 0.5, "square", 0.1, 30);
    shock(boss.x, boss.y, 46, "#ece6f6"); shock(boss.x, boss.y, 30);
    burst(boss.x, boss.y + 10, "#c9d1de", 24, 110);
    ring(boss.x, boss.y, 12 + boss.phase * 4, 72, rand(0, TAU), { c: "#ff8a3d" });
    boss.tBurn = 0.6;
    yield 0.6;
    boss.tBurn = 2;
    while (boss.y > 70) { boss.y -= 150 * DT; engineTrail(1); yield 0; }
    boss.tBurn = 1;
  }
  boss.lock = false; boss.face = "idle"; boss.turn = 3;
  yield 0.5;
}

const POOLS = {
  1: [sGatling, sMissiles, sRam, sBomb],
  2: [sGatling, sMissiles, sRam, sBomb, sDive],
  3: [sRam, sDive, sBomb, () => parallel(sGatling(), sMissiles()), () => parallel(sRam(), sMissiles())]
};

/* --- sprite --- */
const bc = document.createElement("canvas");
bc.width = bc.height = 80;
const bctx = bc.getContext("2d");

function paintStriker(o) {
  const hot = o.phase === 3;
  const white = o.flash ? "#ffffff" : null;
  const C = {
    out: white || "#12141a",
    steel: white || (hot ? "#8c7a78" : "#7d8799"),
    dark: white || (hot ? "#4a3434" : "#3a404d"),
    hi: white || "#c9d1de",
    acc: white || (hot ? "#ff8a3d" : "#ffd166"),
    visor: white || "#ff3d5a",
    glass: white || "#5fd3ff"
  };
  const R = (x, y, w, h, c) => r(SPR_OX + x, SPR_OY + y, w, h, c);
  const t = o.t || 0;

  // afterburners (engines at the tail, nose points at the target)
  if (!white) {
    for (const ex of [20, 25]) {
      const fl = Math.min(19, Math.round((2 + Math.random() * 2.5) * (o.burn || 1)));
      R(ex, -fl, 3, fl, hot ? "#5fd3ff" : "#ff8a3d");
      R(ex + 1, -fl + 2, 1, Math.max(0, fl - 2), hot ? "#ffffff" : "#ffd166");
    }
  }
  // tail fins
  R(16, 0, 2, 3, C.dark); R(15, 3, 2, 3, C.dark); R(14, 6, 2, 3, C.dark);
  R(30, 0, 2, 3, C.dark); R(31, 3, 2, 3, C.dark); R(32, 6, 2, 3, C.dark);
  // swept wings
  for (let i = 0; i < 18; i++) {
    const top = 10 - Math.floor(i / 4), bot = 22 - Math.floor(i * 0.6);
    for (const x of [18 - i, 29 + i]) {
      R(x, top, 1, bot - top, C.out);
      R(x, top + 1, 1, bot - top - 2, i < 3 ? C.dark : C.steel);
      if (i >= 8 && i <= 11) R(x, top + 2, 1, 1, C.acc);
      if (i >= 4 && i <= 14) R(x, top + 1, 1, 1, C.hi);
    }
  }
  // missiles on pylons (slide back in while reloading)
  PYLONS.forEach((p, i) => {
    let y = p.sy;
    if (!o.ammo[i]) {
      if (!(o.reload > 0)) return;
      y -= Math.round(o.reload / 0.6 * 6);
    }
    R(p.sx, y, 2, 1, C.dark); R(p.sx, y + 1, 2, 4, C.hi); R(p.sx, y + 5, 2, 1, C.visor);
  });
  // gatling barrels hanging under the wing roots
  GUNS.forEach((gun, i) => {
    const kick = o.gunFlash[i] > 0 ? 1 : 0;
    const x = gun.sx;
    R(x - 1, 24 - kick, 4, 12, C.out);
    R(x, 25 - kick, 2, 10, C.dark);
    if (o.spool > 0) {
      const k = Math.floor(t * 40 * o.spool) % 3;
      R(x, 26 + k * 3 - kick, 2, 1, C.hi);
      if (o.spool > 0.6) R(x, 33 - kick, 2, 2, "#ff8a3d");
    }
    R(x, 34 - kick, 2, 1, C.hi);
    if (o.gunFlash[i] > 0 && !white) {
      R(x - 1, 36, 4, 2, "#ffffff"); R(x, 38, 2, 3, "#ffd166");
      R(x - 2, 37, 1, 1, "#ffd166"); R(x + 3, 37, 1, 1, "#ffd166");
    }
  });
  // engines
  R(19, 0, 5, 4, C.out); R(24, 0, 5, 4, C.out);
  R(20, 0, 3, 3, C.dark); R(25, 0, 3, 3, C.dark);
  // fuselage
  R(18, 3, 12, 30, C.out); R(19, 4, 10, 28, C.steel); R(19, 4, 2, 28, C.hi);
  R(17, 11, 2, 7, C.dark); R(29, 11, 2, 7, C.dark);
  // bomb bay
  R(20, 6, 8, 4, C.out);
  if (o.bay) { R(21, 7, 6, 2, "#000000"); R(19, 6, 1, 4, C.acc); R(28, 6, 1, 4, C.acc); }
  else R(21, 7, 6, 2, C.dark);
  // core
  R(21, 12, 6, 6, C.out);
  const pulse = o.spool > 0 ? (Math.floor(t * 20) % 2 ? "#ffffff" : C.acc) : hot ? "#ff3d5a" : C.glass;
  R(22, 13, 4, 4, white || pulse);
  R(23, 14, 2, 2, white || "#ffffff");
  // canopy face with a red eye
  R(20, 21, 8, 9, C.out); R(21, 22, 6, 7, C.glass); R(21, 22, 2, 2, white || "#c8f3ff");
  R(23, 25, 2, 2, C.visor);
  // nose cone
  R(19, 32, 10, 2, C.out); R(20, 32, 8, 1, C.steel);
  R(20, 34, 8, 2, C.out); R(21, 34, 6, 1, C.steel);
  R(21, 36, 6, 2, C.out); R(22, 36, 4, 1, C.acc);
  R(22, 38, 4, 2, C.out); R(23, 38, 2, 1, C.visor);
}

function drawBossAt(x, y, ang, o) {
  bctx.clearRect(0, 0, 80, 80);
  g = bctx;
  paintStriker(o);
  g = ctx;
  ctx.save();
  let jx = 0, jy = 0;
  if (o.rattle) { jx = Math.round(rand(-1.5, 1.5)); jy = Math.round(rand(-1, 1)); }
  ctx.translate(Math.round(x) + jx, Math.round(y) + jy);
  ctx.rotate(ang - DOWN);
  ctx.drawImage(bc, -40, -40);
  ctx.restore();
}

/* ---------- state ---------- */
let state = "title", stateT = 0;
let player, boss, bullets = [], pbullets = [], parts = [], warns = [], shocks = [], banner;
let shake = 0, time = 0, newBest = false;
let best = 0;
try { best = parseFloat(localStorage.getItem("striker-best")) || 0; } catch (e) { best = 0; }

const stars = [];
for (let i = 0; i < 70; i++) {
  const layer = i % 3;
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: 8 + layer * 14, c: ["#2c2338", "#4a3d5e", "#8f86a3"][layer] });
}

function reset() {
  player = { x: W / 2, y: H - 40, hp: 5, maxHp: 5, inv: 0, dashT: 0, dashCd: 0, dx: 0, dy: -1, shootT: 0, dead: false };
  boss = {
    x: W / 2, y: -50, tx: W / 2, ty: 70, hp: BOSS_HP, maxHp: BOSS_HP, flash: 0, phase: 1,
    inv: 0, lock: true, t: 0, rattle: 0, enter: 1.8, runner: null, hitSfx: 0,
    ang: DOWN, tAng: DOWN, turn: 3, face: "idle", burn: 2, tBurn: 2,
    aim: 0, aimT: 0, spool: 0, gunFlash: [0, 0], ammo: [1, 1, 1, 1], reload: 0, bay: 0
  };
  bullets = []; pbullets = []; parts = []; warns = []; shocks = [];
  banner = { text: "STRIKER", t: 1.8 };
  time = 0; shake = 0; newBest = false;
  boss.runner = runner(bossBrain());
}
function startGame() {
  reset();
  state = "play";
  sfx(523, 0.1); sfx(784, 0.2, "square", 0.04);
}

function* bossBrain() {
  let last = null;
  yield 0.6;
  while (true) {
    const pool = POOLS[boss.phase];
    let p;
    do { p = pool[Math.floor(Math.random() * pool.length)]; } while (p === last && pool.length > 1);
    last = p;
    yield* p();
    boss.lock = false; boss.face = "idle"; boss.turn = 3; boss.tBurn = 1;
    boss.spool = 0; boss.bay = 0; boss.aimT = 0;
    boss.tx = rand(40, W - 40); boss.ty = 70;
    yield Math.max(0.35, 0.9 - boss.phase * 0.2);
  }
}
// phase change: barrel roll back to center, reload, then a harder pattern pool
function* phaseShift() {
  boss.inv = 2.4; boss.lock = true; boss.face = "manual";
  boss.aimT = 0; boss.bay = 0; boss.spool = 0; boss.tBurn = 2;
  bullets.forEach(b => burst(b.x, b.y, b.c, 2, 30));
  bullets.length = 0; warns.length = 0;
  shake = 8;
  banner = { text: "PHASE " + boss.phase, t: 1.8 };
  sfx(90, 0.9, "sawtooth", 0.08, 40); noise(0.5, 0.1);
  if (boss.y < 0) { boss.y = -40; boss.x = W / 2; }
  for (let t = 0; t < 1.2; t += DT) {
    boss.x += (W / 2 - boss.x) * Math.min(1, DT * 3);
    boss.y += (70 - boss.y) * Math.min(1, DT * 3);
    boss.ang = boss.tAng = DOWN + (t / 1.2) * TAU;
    engineTrail(1);
    yield 0;
  }
  boss.ang = boss.tAng = DOWN;
  boss.ammo = [1, 1, 1, 1];
  for (let i = 0; i < 12; i++) smoke(boss.x + rand(-16, 16), boss.y + rand(-10, 10));
  boss.rattle = 0.6;
  yield 0.6;
  boss.lock = false; boss.face = "idle"; boss.tBurn = 1;
  yield* bossBrain();
}

/* ---------- update ---------- */
function hurtPlayer() {
  if (player.inv > 0 || player.dashT > 0 || player.dead) return;
  player.hp--;
  player.inv = 1.6;
  shake = 7;
  burst(player.x, player.y, "#5fd3ff", 14, 80);
  sfx(110, 0.3, "square", 0.08, 55); noise(0.2, 0.12);
  bullets = bullets.filter(b => Math.hypot(b.x - player.x, b.y - player.y) > 36);
  if (player.hp <= 0) {
    player.dead = true;
    burst(player.x, player.y, "#ffffff", 30, 120);
    burst(player.x, player.y, "#5fd3ff", 30, 90);
    state = "dying"; stateT = 1.4;
  }
}
function tryDash() {
  if (player.dashCd > 0 || player.dashT > 0) return;
  player.dashT = 0.17; player.dashCd = 0.85;
  sfx(700, 0.12, "triangle", 0.04, 1400);
}

function updatePlayer() {
  let mx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
  let my = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
  if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; player.dx = mx; player.dy = my; }
  if (pressed[" "] || pressed.x || pressed.k || touch.dash) tryDash();
  touch.dash = false;

  if (player.dashT > 0) {
    player.dashT -= DT;
    player.x += player.dx * 270 * DT; player.y += player.dy * 270 * DT;
    parts.push({ x: player.x, y: player.y, vx: 0, vy: 0, life: 0.2, max: 0.2, c: "#2b6cb0", s: 4 });
  } else {
    const sp = keys.shift ? 45 : 95;
    player.x += mx * sp * DT; player.y += my * sp * DT;
  }
  player.x = clamp(player.x, 6, W - 6);
  player.y = clamp(player.y, 24, H - 7);
  player.inv -= DT; player.dashCd -= DT;

  player.shootT -= DT;
  if (player.shootT <= 0 && !player.dead) {
    player.shootT = 0.09;
    pbullets.push({ x: player.x - 3, y: player.y - 5 }, { x: player.x + 3, y: player.y - 5 });
  }
}

function updateBoss() {
  boss.t += DT;
  boss.flash -= DT; boss.inv -= DT; boss.rattle -= DT; boss.hitSfx -= DT; boss.reload -= DT;
  boss.gunFlash[0] -= DT; boss.gunFlash[1] -= DT;

  if (boss.enter > 0) {
    boss.enter -= DT;
    boss.y += (70 - boss.y) * Math.min(1, DT * 3);
    engineTrail(1);
    if (boss.enter <= 0) { boss.lock = false; boss.tBurn = 1; }
  } else {
    stepRunner(boss.runner);
    if (!boss.lock) {
      boss.x += (boss.tx - boss.x) * Math.min(1, DT * 2.2);
      boss.y += (boss.ty + Math.sin(boss.t * 2) * 5 - boss.y) * Math.min(1, DT * 3);
    }
    const ratio = boss.hp / boss.maxHp;
    const ph = ratio > 0.66 ? 1 : ratio > 0.33 ? 2 : 3;
    if (ph > boss.phase) { boss.phase = ph; boss.runner = runner(phaseShift()); }
  }
  // idle: nose follows the player a little and banks into sideways motion
  if (boss.face === "idle") {
    const off = clamp(angDiff(DOWN, angTo(boss.x, boss.y)), -0.5, 0.5);
    boss.tAng = DOWN + off + clamp((boss.tx - boss.x) * -0.006, -0.3, 0.3);
  }
  boss.ang = turnToward(boss.ang, boss.tAng, boss.turn * DT);
  boss.burn += (boss.tBurn - boss.burn) * Math.min(1, DT * 6);
  // battle damage
  if (boss.phase >= 2 && Math.random() < (boss.phase === 3 ? 0.35 : 0.12)) {
    const p = hull(rand(14, 34), rand(8, 30));
    smoke(p.x, p.y);
  }
  if (boss.phase === 3 && Math.random() < 0.05) {
    const p = hull(rand(10, 38), rand(8, 30));
    burst(p.x, p.y, "#ffd166", 3, 40);
  }

  if (!player.dead && Math.hypot(player.x - boss.x, player.y - boss.y) < 14) hurtPlayer();
}

function explodeBomb(b) {
  ring(b.x, b.y, b.boomN, 60, rand(0, TAU), { c: "#ff8a3d" });
  shock(b.x, b.y, 16);
  burst(b.x, b.y, "#ffd166", 10, 70);
  noise(0.15, 0.08);
  if (!player.dead && Math.hypot(player.x - b.x, player.y - b.y) < 10) hurtPlayer();
}

function updateBullets() {
  for (const b of pbullets) {
    b.y -= 330 * DT;
    if (b.dead) continue;
    if (Math.hypot(b.x - boss.x, b.y - boss.y) < 17 && boss.enter <= 0 && boss.y > -10) {
      b.dead = true;
      if (boss.inv > 0) { burst(b.x, b.y, "#8f86a3", 2, 30); continue; }
      boss.hp -= 1; boss.flash = 0.05;
      if (Math.random() < 0.4) burst(b.x, b.y, "#fff3b0", 2, 50);
      if (boss.hitSfx <= 0) { sfx(900, 0.03, "square", 0.015); boss.hitSfx = 0.07; }
      if (boss.hp <= 0) killBoss();
    }
  }
  pbullets = pbullets.filter(b => !b.dead && b.y > -6);

  for (const b of bullets) {
    b.life += DT;
    if (b.kind === "missile") {
      if (b.life < b.ignite) {
        b.vx *= 1 - 3 * DT; b.vy *= 1 - 3 * DT;
      } else {
        if (!b.lit) { b.lit = true; sfx(500, 0.15, "sawtooth", 0.015, 1000); }
        let a = Math.atan2(b.vy, b.vx), sp = Math.hypot(b.vx, b.vy);
        if (b.life < b.homeT) a = turnToward(a, Math.atan2(player.y - b.y, player.x - b.x), b.home * DT);
        sp = Math.min(b.max, sp + b.accel * DT);
        b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
        if (Math.random() < 0.7) smoke(b.x - Math.cos(a) * 4, b.y - Math.sin(a) * 4);
      }
    }
    b.vy += b.grav * DT;
    b.x += b.vx * DT; b.y += b.vy * DT;
    if (b.kind === "bomb" && b.y >= b.boomY) { b.dead = true; explodeBomb(b); continue; }
    if (!player.dead && Math.hypot(b.x - player.x, b.y - player.y) < b.r + 1.5) { b.dead = true; hurtPlayer(); }
  }
  bullets = bullets.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -40 && b.y < H + 10);

  for (const w of warns) w.t -= DT;
  warns = warns.filter(w => w.t > 0);
  for (const s of shocks) s.life -= DT;
  shocks = shocks.filter(s => s.life > 0);
}

function killBoss() {
  state = "bossdying"; stateT = 2.6;
  bullets.forEach(b => burst(b.x, b.y, b.c, 2, 30));
  bullets = []; warns = [];
  boss.spool = 0; boss.bay = 0; boss.aimT = 0;
  if (!best || time < best) {
    best = time; newBest = true;
    try { localStorage.setItem("striker-best", String(time)); } catch (e) {}
  }
}

function updateParts() {
  for (const p of parts) { p.life -= DT; p.x += p.vx * DT; p.y += p.vy * DT; p.vx *= 0.94; p.vy *= 0.94; }
  parts = parts.filter(p => p.life > 0);
}
function updateStars(speed = 1) {
  for (const s of stars) { s.y += s.s * DT * speed; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
}

function update() {
  const tap = pressed.tap !== undefined;
  const start = pressed.enter || pressed[" "] || pressed.z || tap;
  const back = pressed.escape;
  if (pressed.m) muted = !muted;
  stateT -= DT;
  updateStars(state === "play" ? 1 : 0.4);
  shake = Math.max(0, shake - DT * 20);

  if (state === "title") {
    if (start) startGame();
  } else if (state === "play") {
    if (pressed.p || back) { state = "pause"; }
    else {
      time += DT;
      if (banner.t > 0) banner.t -= DT;
      updatePlayer(); updateBoss(); updateBullets(); updateParts();
    }
  } else if (state === "pause") {
    if (pressed.p || back || pressed.enter || tap) state = "play";
  } else if (state === "dying") {
    updateBoss(); updateBullets(); updateParts();
    if (stateT <= 0) { state = "over"; stateT = 0.6; }
  } else if (state === "bossdying") {
    updateParts();
    for (const s of shocks) s.life -= DT;
    shocks = shocks.filter(s => s.life > 0);
    boss.flash = Math.random() < 0.3 ? 0.03 : 0;
    boss.ang += DT * 1.5;
    boss.y += DT * 10;
    if (Math.random() < 0.6) smoke(boss.x + rand(-12, 12), boss.y + rand(-10, 10));
    if (Math.random() < 0.3) {
      const x = boss.x + rand(-20, 20), y = boss.y + rand(-16, 16);
      burst(x, y, ["#ff3d5a", "#ffd166", "#ffffff", "#ff8a3d"][Math.floor(Math.random() * 4)], 12, 90);
      shock(x, y, 12);
      noise(0.12, 0.08); shake = 5;
    }
    if (stateT <= 0) {
      burst(boss.x, boss.y, "#ffffff", 60, 160); burst(boss.x, boss.y, "#ff8a3d", 50, 120);
      shock(boss.x, boss.y, 70, "#ffffff");
      sfx(80, 1.2, "sawtooth", 0.1, 30); noise(0.8, 0.2); shake = 14;
      state = "win"; stateT = 1;
    }
  } else if (state === "over" || state === "win") {
    updateParts();
    for (const s of shocks) s.life -= DT;
    shocks = shocks.filter(s => s.life > 0);
    if (stateT <= 0) {
      if (back) state = "title";
      else if (start) startGame();
    }
  }
  for (const k in pressed) delete pressed[k];
}

/* ---------- draw ---------- */
function drawBullet(b) {
  const x = Math.round(b.x), y = Math.round(b.y);
  if (b.kind === "orb") {
    const s = b.r;
    r(x - s, y - s + 1, s * 2, s * 2 - 2, b.c);
    r(x - s + 1, y - s, s * 2 - 2, s * 2, b.c);
    r(x - 1, y - 1, 2, 2, "#ffffff");
    return;
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(b.vy, b.vx));
  if (b.kind === "tracer") {
    ctx.fillStyle = "#ff8a3d"; ctx.fillRect(-4, -1, 7, 2);
    ctx.fillStyle = "#fff3b0"; ctx.fillRect(-1, -1, 4, 2);
  } else if (b.kind === "missile") {
    if (b.lit) {
      ctx.fillStyle = Math.random() < 0.5 ? "#ffd166" : "#ff8a3d";
      ctx.fillRect(-7 - Math.floor(Math.random() * 3), -1, 4, 2);
    }
    ctx.fillStyle = "#c9d1de"; ctx.fillRect(-4, -1, 7, 2);
    ctx.fillStyle = "#3a404d"; ctx.fillRect(-4, -2, 2, 4);
    ctx.fillStyle = "#ff3d5a"; ctx.fillRect(3, -1, 2, 2);
  } else if (b.kind === "bomb") {
    ctx.fillStyle = "#12141a"; ctx.fillRect(-4, -2, 8, 4);
    ctx.fillStyle = "#5a6070"; ctx.fillRect(-3, -1, 6, 2);
    ctx.fillStyle = "#3a404d"; ctx.fillRect(-5, -3, 2, 6);
    ctx.fillStyle = Math.floor(b.life * 10) % 2 ? "#ff3d5a" : "#ffd166"; ctx.fillRect(2, -1, 1, 1);
  }
  ctx.restore();
}

function drawStars(tint) {
  for (const s of stars) r(Math.round(s.x), Math.round(s.y), 1, 1, s.c);
  if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
}

function fmt(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 10) % 10);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + cs;
}

function drawHUD() {
  shadowText("STRIKER", 6, 5, "#ece6f6", 1);
  text("PHASE " + boss.phase, W - 6, 5, boss.phase === 3 ? "#ff3d5a" : "#9087a3", 1, "right");
  r(6, 12, W - 12, 6, "#1a0f26");
  r(7, 13, W - 14, 4, "#2c2338");
  const w = Math.max(0, Math.round((W - 14) * boss.hp / boss.maxHp));
  r(7, 13, w, 4, boss.inv > 0 ? "#8f86a3" : boss.phase === 3 ? "#ff1f3d" : "#ff3d5a");
  r(7, 13, w, 1, "#ff9aa9");
  for (const f of [0.66, 0.33]) r(7 + Math.round((W - 14) * f), 12, 1, 6, "#ece6f6");
  for (let i = 0; i < player.maxHp; i++) {
    sprite(HEART, { 1: i < player.hp ? "#ff3d5a" : "#2c2338" }, 6 + i * 9, H - 11);
  }
  const ready = player.dashCd <= 0;
  text("DASH", W - 40, H - 10, ready ? "#5fd3ff" : "#4a3d5e");
  r(W - 23, H - 9, 17, 3, "#2c2338");
  r(W - 23, H - 9, Math.round(17 * (1 - clamp(player.dashCd / 0.85, 0, 1))), 3, ready ? "#5fd3ff" : "#4a3d5e");
  text(fmt(time), W / 2, H - 10, "#9087a3", 1, "center");
  if (muted) text("MUTE", W - 6, 22, "#4a3d5e", 1, "right");
}

function drawWarns() {
  for (const w of warns) {
    const rate = w.locked ? 26 : 14;
    const on = Math.floor(performance.now() / 1000 * rate) % 2 === 0;
    if (w.type === "band") {
      ctx.fillStyle = on ? "rgba(255,61,90,0.28)" : "rgba(255,61,90,0.12)";
      ctx.fillRect(0, Math.round(w.y - w.h / 2), W, w.h);
      if (on) { r(0, Math.round(w.y - w.h / 2), W, 1, "#ff3d5a"); r(0, Math.round(w.y + w.h / 2) - 1, W, 1, "#ff3d5a"); }
    } else if (w.type === "mark") {
      const x = Math.round(w.x), y = Math.round(w.y), k = Math.round(3 + 5 * (w.t / w.max));
      const c = on ? "#ff3d5a" : "#7a2030";
      r(x - k, y, k * 2 + 1, 1, c); r(x, y - k, 1, k * 2 + 1, c);
      r(x - 1, y - 1, 3, 3, c);
    } else if (w.type === "shadow") {
      ctx.beginPath();
      ctx.ellipse(Math.round(w.x), Math.round(w.y), w.r, w.r * 0.6, 0, 0, TAU);
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fill();
      if (on) { ctx.strokeStyle = "#ff3d5a"; ctx.lineWidth = 1; ctx.stroke(); }
    }
  }
}

function drawShocks() {
  for (const s of shocks) {
    const k = 1 - s.life / s.ml;
    ctx.beginPath();
    ctx.arc(Math.round(s.x), Math.round(s.y), 2 + s.max * k, 0, TAU);
    ctx.strokeStyle = s.c;
    ctx.globalAlpha = 1 - k;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function bossOpts() {
  return {
    phase: boss.phase, t: boss.t, burn: boss.burn, spool: boss.spool, gunFlash: boss.gunFlash,
    ammo: boss.ammo, reload: boss.reload, bay: boss.bay,
    flash: boss.flash > 0 || (boss.inv > 0 && Math.floor(boss.inv * 10) % 2 === 0),
    rattle: boss.rattle > 0 || state === "bossdying"
  };
}

function drawPlay() {
  drawStars(boss.phase === 3 ? "rgba(255,31,61,0.06)" : null);
  drawWarns();
  drawShocks();

  if (boss.aimT > 0 && Math.floor(boss.aimT * 18) % 2 === 0) {
    ctx.save(); ctx.translate(Math.round(boss.x), Math.round(boss.y)); ctx.rotate(boss.aim);
    ctx.fillStyle = "rgba(255,61,90,0.22)"; ctx.fillRect(0, -16, 500, 32);
    ctx.fillStyle = "rgba(255,61,90,0.85)"; ctx.fillRect(0, -16, 500, 1); ctx.fillRect(0, 15, 500, 1);
    ctx.restore();
  }

  if (state !== "win") drawBossAt(boss.x, boss.y, boss.ang, bossOpts());

  for (const b of pbullets) { r(Math.round(b.x), Math.round(b.y), 1, 4, "#9ff0ff"); }

  if (!player.dead && !(player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0)) drawPlayer();

  for (const b of bullets) drawBullet(b);
  for (const p of parts) r(Math.round(p.x), Math.round(p.y), p.s, p.s, p.c);

  drawHUD();

  if (banner.t > 0 && Math.floor(banner.t * 6) % 2 === 0) {
    shadowText(banner.text, W / 2, H / 2 - 20, banner.text.startsWith("PHASE") ? "#ff3d5a" : "#ece6f6", 3, "center");
  }
}

function drawPlayer() {
  const cx = Math.round(player.x), cy = Math.round(player.y);
  // soft halo so the ship stands out from the bullets
  ctx.beginPath(); ctx.arc(cx, cy, 10, 0, TAU);
  ctx.fillStyle = "rgba(95,211,255,0.14)"; ctx.fill();
  const px = cx - 5, py = cy - 5;
  for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) sprite(PLAYER, PCOL, px + ox, py + oy, "#03101d");
  PCOL.d = Math.random() < 0.5 ? "#ffb347" : "#ff6a3d";
  sprite(PLAYER, PCOL, px, py, player.dashT > 0 ? "#ffffff" : null);
  if (keys.shift) {
    r(cx - 1, cy - 1, 3, 3, "#ff3d5a");
    r(cx, cy, 1, 1, "#ffffff");
  }
}

function overlay(alpha) { ctx.fillStyle = "rgba(13,11,20," + alpha + ")"; ctx.fillRect(0, 0, W, H); }

const titleGuns = [0, 0];
function drawTitle(blinkOn) {
  drawStars();
  const t = performance.now() / 1000;
  const ang = DOWN + Math.sin(t * 0.9) * 0.35;
  drawBossAt(W / 2, 110 + Math.sin(t * 2) * 4, ang, {
    t, burn: 1.6, spool: 0, gunFlash: titleGuns, ammo: [1, 1, 1, 1], reload: 0, bay: 0, phase: 1
  });
  shadowText("STRIKER", W / 2, 162, "#ff3d5a", 4, "center");
  text("JET FIGHTER ROBOT", W / 2, 188, "#ece6f6", 1, "center");
  if (best) text("BEST " + fmt(best), W / 2, 202, "#7cffb2", 1, "center");
  if (blinkOn) text("PRESS ENTER OR TAP", W / 2, 236, "#5fd3ff", 1, "center");
  text("MOVE ARROWS/WASD  DASH SPACE", W / 2, 266, "#9087a3", 1, "center");
  text("FOCUS SHIFT  PAUSE P  MUTE M", W / 2, 276, "#9087a3", 1, "center");
  text("FULLSCREEN F", W / 2, 286, "#9087a3", 1, "center");
}

function draw() {
  ctx.save();
  r(0, 0, W, H, "#0d0b14");
  if (shake > 0) ctx.translate(Math.round(rand(-shake, shake) / 2), Math.round(rand(-shake, shake) / 2));
  const blinkOn = Math.floor(performance.now() / 450) % 2 === 0;

  if (state === "title") {
    drawTitle(blinkOn);
  } else {
    drawPlay();
    if (state === "pause") {
      overlay(0.7);
      shadowText("PAUSED", W / 2, H / 2 - 12, "#ece6f6", 3, "center");
      text("P TO RESUME", W / 2, H / 2 + 12, "#9087a3", 1, "center");
    } else if (state === "over") {
      overlay(0.75);
      shadowText("GAME OVER", W / 2, 120, "#ff3d5a", 3, "center");
      text("STRIKER HP " + Math.ceil(boss.hp / boss.maxHp * 100) + "%", W / 2, 150, "#ece6f6", 1, "center");
      text("TIME " + fmt(time), W / 2, 162, "#9087a3", 1, "center");
      if (stateT <= 0) {
        if (blinkOn) text("ENTER OR TAP TO RETRY", W / 2, 200, "#5fd3ff", 1, "center");
        text("ESC: TITLE", W / 2, 214, "#9087a3", 1, "center");
      }
    } else if (state === "win") {
      overlay(0.55);
      shadowText("VICTORY!", W / 2, 110, "#ffd166", 3, "center");
      text("STRIKER SHOT DOWN", W / 2, 140, "#ece6f6", 1, "center");
      text("TIME " + fmt(time), W / 2, 156, "#ece6f6", 2, "center");
      text(newBest ? "NEW BEST!" : "BEST " + fmt(best), W / 2, 176, newBest ? "#7cffb2" : "#9087a3", 1, "center");
      if (stateT <= 0) {
        if (blinkOn) text("ENTER OR TAP TO PLAY AGAIN", W / 2, 210, "#5fd3ff", 1, "center");
        text("ESC: TITLE", W / 2, 224, "#9087a3", 1, "center");
      }
    }
  }
  ctx.restore();
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  DT = Math.min(0.033, (now - last) / 1000);
  last = now;
  update();
  draw();
  requestAnimationFrame(frame);
}
reset();
state = "title";
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
