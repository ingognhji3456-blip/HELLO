<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gloomeye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Do+Hyeon&display=swap">
<style>
/* Layout: arcade cabinet. The game screen takes the full viewport height; controls sit below it. Single dark look by choice. */
:root {
  --void: #0d0b14;
  --panel: #18131f;
  --line: #2c2338;
  --ink: #ece6f6;
  --muted: #9087a3;
  --eye: #ff3d5a;
  --glow: #5fd3ff;
  --font-display: "Silkscreen", ui-monospace, "Courier New", monospace;
  --font-body: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
}
.wrap {
  padding-inline: 16px;
  padding-block: 10px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
header {
  width: 100%;
  max-width: 720px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 24px;
  letter-spacing: 0.06em;
  color: var(--ink);
  text-shadow: 3px 3px 0 var(--eye);
}
header p { margin: 0; color: var(--muted); flex: 1; min-width: 0; }
button {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  padding: 4px 10px;
  cursor: pointer;
}
button:hover { border-color: var(--glow); }
button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.screen {
  width: min(100%, calc((100vh - 76px) * 0.75));
  width: min(100%, calc((100dvh - 76px) * 0.75));
  min-width: min(100%, 240px);
  border: 4px solid var(--line);
  box-shadow: 0 0 0 4px var(--void), 0 0 0 6px var(--line);
  background: #000;
}
.screen:fullscreen {
  width: min(100vw, 75vh);
  border: 0;
  box-shadow: none;
  margin: auto;
}
.screen:fullscreen::backdrop { background: #000; }
canvas {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 3 / 4;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  outline: none;
}
.help {
  width: 100%;
  max-width: 520px;
  box-sizing: border-box;
  margin-top: 8px;
  background: var(--panel);
  border: 2px solid var(--line);
  padding: 14px 16px;
  display: grid;
  gap: 8px;
}
.help h2 {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 13px;
  letter-spacing: 0.12em;
  color: var(--glow);
}
.row { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; align-items: center; }
.row > span:first-child { color: var(--muted); }
kbd {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--ink);
  background: var(--void);
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  padding: 1px 6px;
  margin-right: 4px;
  white-space: nowrap;
}
.note { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.note b { color: var(--eye); font-weight: 400; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>GLOOMEYE</h1>
    <p>패턴을 피하고 보스를 쓰러뜨려라</p>
    <button id="fs" type="button">전체화면</button>
  </header>
  <div class="screen" id="screen"><canvas id="game" width="240" height="320" tabindex="0" aria-label="게임 화면"></canvas></div>
  <section class="help">
    <h2>CONTROLS</h2>
    <div class="row"><span>보스 선택</span><span><kbd>←</kbd><kbd>→</kbd> 타이틀 화면에서</span></div>
    <div class="row"><span>이동</span><span><kbd>←↑↓→</kbd><kbd>WASD</kbd></span></div>
    <div class="row"><span>정밀 이동</span><span><kbd>SHIFT</kbd> 느려지고 판정점이 보임</span></div>
    <div class="row"><span>대시 (무적)</span><span><kbd>SPACE</kbd><kbd>X</kbd></span></div>
    <div class="row"><span>공격</span><span>자동 발사</span></div>
    <div class="row"><span>기타</span><span><kbd>P</kbd>일시정지 <kbd>M</kbd>소리 <kbd>F</kbd>전체화면</span></div>
    <div class="row"><span>모바일</span><span>드래그로 이동, 두 번 탭하면 대시</span></div>
    <p class="note"><b>GLOOMEYE</b>는 탄막을 쏘는 외눈 괴물, <b>STRIKER</b>는 전투기형 로봇으로, 몸통 돌진, 급강하, 기총소사 비행으로 직접 덤벼듭니다. 두 보스 모두 체력 66%와 33%에서 페이즈가 바뀝니다.</p>
  </section>
</main>

<script>
(() => {
"use strict";
const W = 240, H = 320, TAU = Math.PI * 2;
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

/* ---------- 3x5 bitmap font ---------- */
const GLYPHS = {
  "0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001111001111",
  "4":"101101111001001","5":"111100111001111","6":"111100111101111","7":"111001010010010",
  "8":"111101111101111","9":"111101111001111",
  A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",
  E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",
  I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",
  M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",
  Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",
  U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",
  Y:"101101010010010",Z:"111001010100111",
  ":":"000010000010000",".":"000000000000010","!":"010010010000010","-":"000000111000000",
  "/":"001001010100100","%":"101001010100101","<":"001010100010001",">":"100010001010100",
  "*":"000101010101000"," ":"000000000000000"
};
function text(s, x, y, c, sc = 1, align = "left") {
  s = String(s).toUpperCase();
  const w = s.length * 4 * sc - sc;
  if (align === "center") x -= Math.floor(w / 2);
  else if (align === "right") x -= w;
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = c;
  for (let i = 0; i < s.length; i++) {
    const g = GLYPHS[s[i]];
    if (!g) continue;
    for (let p = 0; p < 15; p++) {
      if (g[p] === "1") ctx.fillRect(x + i * 4 * sc + (p % 3) * sc, y + Math.floor(p / 3) * sc, sc, sc);
    }
  }
}
function shadowText(s, x, y, c, sc, align) {
  text(s, x + sc, y + sc, "#000", sc, align);
  text(s, x, y, c, sc, align);
}

/* ---------- sprites ---------- */
function sprite(rows, pal, x, y, override) {
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      const k = rows[r][c];
      if (k === ".") continue;
      ctx.fillStyle = override || pal[k];
      ctx.fillRect(x + c, y + r, 1, 1);
    }
  }
}
const PLAYER = [
  ".....w.....",
  "....wbw....",
  "....aba....",
  "...aacaa...",
  "...acwca...",
  "..aaacaaa..",
  ".aaaacaaaa.",
  "aaaaacaaaaa",
  "aa.aaaaa.aa",
  "a...d.d...a",
  "....d.d...."
];
const PCOL = { a: "#5fd3ff", b: "#2b6cb0", c: "#e8fbff", w: "#ffffff", d: "#ffb347" };
const HEART = [".11.11.", "1111111", "1111111", ".11111.", "..111..", "...1..."];

/* ---------- audio ---------- */
let actx = null, muted = false;
function initAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    else if (actx.state === "suspended") actx.resume();
  } catch (e) { actx = null; }
}
function sfx(f, d, type = "square", v = 0.05, f2 = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + d);
}
function noise(d, v = 0.12) {
  if (!actx || muted) return;
  const len = Math.floor(actx.sampleRate * d);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = buf; g.gain.value = v;
  src.connect(g).connect(actx.destination);
  src.start();
}

/* ---------- fullscreen ---------- */
const screenEl = document.getElementById("screen");
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else screenEl.requestFullscreen?.().catch(() => {});
  } catch (e) {}
  cv.focus();
}
document.getElementById("fs").addEventListener("click", toggleFullscreen);

/* ---------- input ---------- */
const keys = {}, pressed = {};
const GAME_KEYS = ["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "shift"];
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (GAME_KEYS.includes(k)) e.preventDefault();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if (k === "f" && !e.repeat) toggleFullscreen();
  initAudio();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; if (state === "play") state = "pause"; });

const touch = { active: false, ids: new Set(), lx: 0, ly: 0, lastTap: 0, dash: false };
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  initAudio();
  cv.focus();
  touch.ids.add(e.pointerId);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (state !== "play") {
    const rect = cv.getBoundingClientRect();
    pressed.tap = (e.clientX - rect.left) / rect.width;
    return;
  }
  const now = performance.now();
  if (touch.ids.size > 1 || now - touch.lastTap < 260) touch.dash = true;
  touch.lastTap = now;
  touch.active = true;
  touch.lx = e.clientX; touch.ly = e.clientY;
});
cv.addEventListener("pointermove", e => {
  if (!touch.active || !touch.ids.has(e.pointerId) || state !== "play") return;
  const rect = cv.getBoundingClientRect();
  const k = W / rect.width;
  const dx = (e.clientX - touch.lx) * k, dy = (e.clientY - touch.ly) * k;
  touch.lx = e.clientX; touch.ly = e.clientY;
  if (player.dashT <= 0) { player.x += dx; player.y += dy; }
  if (Math.abs(dx) + Math.abs(dy) > 0.5) {
    const l = Math.hypot(dx, dy); player.dx = dx / l; player.dy = dy / l;
  }
});
function endPointer(e) {
  touch.ids.delete(e.pointerId);
  if (touch.ids.size === 0) touch.active = false;
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

/* ---------- helpers ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
function angTo(x, y) { return Math.atan2(player.y - y, player.x - x); }
function fire(x, y, a, sp, o = {}) {
  bullets.push({
    x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: o.r || 2, c: o.c || "#ff3d5a",
    grav: o.grav || 0, drag: o.drag || 0, retarget: o.retarget || 0, rsp: o.rsp || 0,
    home: o.home || 0, homeT: o.homeT || 0, trail: o.trail || false, life: 0
  });
}
function ring(x, y, n, sp, off, o) { for (let i = 0; i < n; i++) fire(x, y, off + i * TAU / n, sp, o); }
function burst(x, y, c, n = 8, sp = 60) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = Math.random() * sp;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.6), max: 0.6, c, s: Math.random() < 0.3 ? 2 : 1 });
  }
}
function r(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

/* ---------- pattern runner (generators yield seconds to wait; 0 = next frame) ---------- */
let DT = 0;
function runner(g) { return { g, w: 0, done: false }; }
function stepRunner(rn) {
  if (rn.done) return;
  rn.w -= DT;
  while (rn.w <= 0) {
    const n = rn.g.next();
    if (n.done) { rn.done = true; return; }
    if (!n.value || n.value <= 0) { rn.w = 0; return; }
    rn.w += n.value;
  }
}
function* parallel(...gens) {
  const rs = gens.map(runner);
  while (rs.some(x => !x.done)) { rs.forEach(stepRunner); yield 0; }
}

/* =========================================================
   BOSS 1: GLOOMEYE (bullet curtains)
   ========================================================= */
function* gRing() {
  const n = [0, 14, 18, 22][boss.phase];
  for (let k = 0; k < 3 + boss.phase; k++) {
    ring(boss.x, boss.y, n, 52 + boss.phase * 8, k * 0.19, { c: "#ff3d5a" });
    sfx(220, 0.1, "square", 0.035);
    yield 0.5 - boss.phase * 0.06;
  }
  yield 0.4;
}
function* gAimed() {
  for (let k = 0; k < 4; k++) {
    const a = angTo(boss.x, boss.y + 8), m = boss.phase;
    for (let i = -m; i <= m; i++) fire(boss.x, boss.y + 8, a + i * 0.2, 92, { c: "#ffd166" });
    sfx(440, 0.06, "square", 0.03);
    yield 0.38;
  }
  yield 0.3;
}
function* gSpiral() {
  const arms = boss.phase + 1, dir = Math.random() < 0.5 ? 1 : -1;
  let a = Math.random() * TAU;
  boss.tx = W / 2;
  for (let t = 0; t < 2.6; t += 0.08) {
    for (let i = 0; i < arms; i++) fire(boss.x, boss.y, a + i * TAU / arms, 66, { c: "#c77dff" });
    a += 0.24 * dir;
    if (Math.floor(t / 0.08) % 3 === 0) sfx(600, 0.03, "triangle", 0.02);
    yield 0.08;
  }
  yield 0.5;
}
function* gRain() {
  const n = 8 + boss.phase * 5;
  for (let i = 0; i < n; i++) {
    const x = rand(8, W - 8);
    warns.push({ type: "drop", x, t: 0.55, max: 0.55, fn: () => fire(x, -4, Math.PI / 2, 30, { c: "#5fd3ff", r: 3, grav: 130 }) });
    yield 0.13 - boss.phase * 0.015;
  }
  yield 0.8;
}
function* gLaser() {
  const cnt = boss.phase === 3 ? 3 : 2;
  for (let k = 0; k < cnt; k++) {
    const a = angTo(boss.x, boss.y);
    const rot = boss.phase === 3 ? (Math.random() < 0.5 ? -0.55 : 0.55) : 0;
    lasers.push({ x: boss.x, y: boss.y, a, warn: 0.8, on: 0.5, w: 7, rot });
    sfx(160, 0.6, "sawtooth", 0.025, 340);
    yield 0.55;
  }
  yield 1.2;
}
function* gBloom() {
  for (let k = 0; k < boss.phase; k++) {
    const n = 12 + boss.phase * 2;
    ring(boss.x, boss.y, n, 115, k * 0.3, { c: "#7cffb2", drag: 2.4, retarget: 0.9, rsp: 105 });
    sfx(330, 0.25, "triangle", 0.05, 660);
    yield 0.85;
  }
  yield 0.8;
}
function* gCharge() {
  const times = boss.phase === 3 ? 3 : 2;
  for (let k = 0; k < times; k++) {
    boss.lock = false;
    boss.tx = clamp(player.x, 24, W - 24); boss.ty = 60;
    yield 0.5;
    boss.lock = true;
    warns.push({ type: "lane", x: boss.x, w: 40, t: 0.6, max: 0.6 });
    boss.rattle = 0.6;
    sfx(120, 0.55, "sawtooth", 0.04, 60);
    yield 0.6;
    while (boss.y < H - 30) { boss.y += 400 * DT; yield 0; }
    boss.y = H - 30;
    shake = 10; noise(0.35, 0.15);
    const n = 10 + boss.phase * 4;
    for (let i = 0; i < n; i++) fire(boss.x, boss.y + 8, Math.PI + i / (n - 1) * Math.PI, 78, { c: "#ffd166" });
    yield 0.35;
    while (boss.y > 70) { boss.y -= 210 * DT; yield 0; }
    boss.ty = 70;
  }
  boss.lock = false;
  yield 0.5;
}

function drawGloomeye(cx, cy, opts = {}) {
  const enraged = opts.phase === 3;
  const white = opts.flash ? "#ffffff" : null;
  const C = {
    out: white || "#1a0f26",
    body: white || (enraged ? "#6b1f35" : "#4b2a6b"),
    hi: white || (enraged ? "#a8344f" : "#7b4fa8"),
    horn: white || "#d9c7a6",
    eye: white || "#f4f0ff",
    iris: white || (enraged ? "#ff1f3d" : "#ff3d5a"),
    tooth: white || "#f4f0ff"
  };
  let ox = Math.round(cx) - 22, oy = Math.round(cy) - 17;
  if (opts.rattle) { ox += Math.round(rand(-1.5, 1.5)); oy += Math.round(rand(-1, 1)); }
  const R = (x, y, w, h, c) => r(ox + x, oy + y, w, h, c);
  R(2, 0, 4, 4, C.horn); R(4, 4, 4, 4, C.horn); R(6, 8, 4, 3, C.horn);
  R(38, 0, 4, 4, C.horn); R(36, 4, 4, 4, C.horn); R(34, 8, 4, 3, C.horn);
  const wob = Math.round(Math.sin((opts.t || 0) * 4) * 2);
  R(0, 17 + wob, 5, 3, C.body); R(-2, 19 + wob, 3, 3, C.horn);
  R(39, 17 - wob, 5, 3, C.body); R(43, 19 - wob, 3, 3, C.horn);
  R(6, 7, 32, 26, C.out); R(4, 9, 36, 22, C.out);
  R(7, 8, 30, 24, C.body); R(5, 10, 34, 20, C.body);
  R(8, 10, 10, 2, C.hi); R(7, 12, 2, 4, C.hi);
  R(12, 12, 20, 12, C.out);
  if (opts.blink) {
    R(13, 13, 18, 10, C.body); R(13, 18, 18, 1, C.out);
  } else {
    R(13, 13, 18, 10, C.eye);
    const lx = clamp(opts.lookX || 0, -5, 5), ly = clamp(opts.lookY || 0, -2, 2);
    R(19 + lx, 15 + ly, 6, 6, C.iris);
    R(21 + lx, 17 + ly, 2, 2, C.out);
    R(20 + lx, 16 + ly, 1, 1, C.eye);
  }
  R(14, 26, 16, 3, C.out);
  for (let i = 0; i < 4; i++) R(15 + i * 4, 26, 2, 2, C.tooth);
}

/* =========================================================
   BOSS 2: STRIKER (jet fighter robot, rams and strafing runs)
   ========================================================= */
function* rRam() {
  const n = boss.phase + 1;
  boss.lock = true;
  for (let k = 0; k < n; k++) {
    let a = 0;
    const aimTime = 0.75 - boss.phase * 0.08;
    sfx(300, aimTime, "sawtooth", 0.03, 900);
    for (let t = 0; t < aimTime; t += DT) {
      if (t < aimTime - 0.2) a = angTo(boss.x, boss.y);
      boss.aim = a; boss.aimT = aimTime - t; boss.rattle = 0.05;
      boss.x -= Math.cos(a) * 12 * DT; boss.y -= Math.sin(a) * 12 * DT;
      yield 0;
    }
    boss.aimT = 0;
    noise(0.3, 0.1); sfx(140, 0.4, "sawtooth", 0.06, 60);
    const sp = 330 + boss.phase * 30;
    const vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
    let f = 0;
    while (boss.x > -40 && boss.x < W + 40 && boss.y > -60 && boss.y < H + 40) {
      boss.x += vx * DT; boss.y += vy * DT;
      parts.push({ x: boss.x - Math.cos(a) * 20 + rand(-2, 2), y: boss.y - Math.sin(a) * 20 + rand(-2, 2), vx: 0, vy: 0, life: 0.3, max: 0.3, c: Math.random() < 0.5 ? "#ff8a3d" : "#ffd166", s: 2 });
      f += DT;
      if (boss.phase >= 2 && f >= 0.08) {
        f = 0;
        fire(boss.x, boss.y, a + Math.PI / 2, 40, { c: "#ffd166" });
        fire(boss.x, boss.y, a - Math.PI / 2, 40, { c: "#ffd166" });
      }
      yield 0;
    }
    boss.x = rand(40, W - 40); boss.y = -60;
    while (boss.y < 70) { boss.y += 220 * DT; yield 0; }
    yield 0.15;
  }
  boss.tx = boss.x; boss.ty = 70; boss.lock = false;
  yield 0.6;
}

function* rDive() {
  const times = boss.phase === 3 ? 2 : 1;
  boss.lock = true;
  for (let k = 0; k < times; k++) {
    sfx(200, 0.5, "sawtooth", 0.04, 700);
    while (boss.y > -60) { boss.y -= 280 * DT; parts.push({ x: boss.x + rand(-6, 6), y: boss.y + 22, vx: 0, vy: 40, life: 0.3, max: 0.3, c: "#ff8a3d", s: 2 }); yield 0; }
    const w = { type: "shadow", x: player.x, y: player.y, r: 22, t: 99, max: 99 };
    warns.push(w);
    for (let t = 0; t < 1.0; t += DT) {
      w.x += (player.x - w.x) * Math.min(1, DT * 6);
      w.y += (player.y - w.y) * Math.min(1, DT * 6);
      yield 0;
    }
    w.x = clamp(w.x, 26, W - 26); w.y = clamp(w.y, 60, H - 30);
    w.locked = true;
    sfx(900, 0.4, "square", 0.03, 200);
    yield 0.45;
    boss.x = w.x; boss.tx = w.x;
    while (boss.y < w.y) { boss.y += 580 * DT; yield 0; }
    boss.y = w.y; w.t = 0;
    shake = 13; noise(0.45, 0.2); sfx(55, 0.5, "square", 0.1, 30);
    burst(boss.x, boss.y + 18, "#c9d1de", 24, 110);
    ring(boss.x, boss.y + 10, 12 + boss.phase * 4, 72, rand(0, TAU), { c: "#ffd166" });
    yield 0.65;
    while (boss.y > 70) { boss.y -= 150 * DT; yield 0; }
  }
  boss.ty = 70; boss.lock = false;
  yield 0.5;
}

function* rGatling() {
  boss.core = 0.6;
  sfx(150, 0.6, "sawtooth", 0.04, 600);
  yield 0.6;
  boss.tx = rand(50, W - 50);
  let a = angTo(boss.x, boss.y + 6);
  const turn = 0.3 + boss.phase * 0.05;
  const dur = 1.4 + boss.phase * 0.3;
  let i = 0;
  for (let t = 0; t < dur; t += 0.06) {
    let d = angTo(boss.x, boss.y + 6) - a;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    a += clamp(d, -turn * 0.06, turn * 0.06);
    fire(boss.x, boss.y + 6, a + rand(-0.07, 0.07), 135, { c: "#ffd166" });
    boss.core = 0.08;
    if (i++ % 2 === 0) sfx(260, 0.04, "square", 0.02);
    yield 0.06;
  }
  yield 0.6;
}

function* rMissiles() {
  const n = 2 + boss.phase * 2;
  for (let i = 0; i < n; i++) {
    const s = i % 2 ? 1 : -1;
    fire(boss.x + s * 16, boss.y - 6, -Math.PI / 2 + s * 0.7, 105, { c: "#ff8a3d", home: 2.4, homeT: 1.3, trail: true });
    sfx(250, 0.15, "sawtooth", 0.03, 500);
    yield 0.18;
  }
  yield 1.2;
}

function* rStrafe() {
  boss.lock = true;
  const passes = boss.phase >= 2 ? 2 : 1;
  for (let p = 0; p < passes; p++) {
    const dir = boss.x < W / 2 ? 1 : -1;
    const sx = dir > 0 ? -40 : W + 40;
    const y = clamp(player.y - 80, 60, 150);
    warns.push({ type: "band", y, h: 32, t: 0.9, max: 0.9 });
    sfx(300, 0.8, "sawtooth", 0.03, 120);
    for (let t = 0; t < 0.9; t += DT) {
      boss.x += (sx - boss.x) * Math.min(1, DT * 6);
      boss.y += (y - boss.y) * Math.min(1, DT * 6);
      yield 0;
    }
    boss.x = sx; boss.y = y;
    sfx(120, 0.9, "sawtooth", 0.05, 420); noise(0.4, 0.08);
    const sp = 210 + boss.phase * 25;
    let f = 0;
    while (dir > 0 ? boss.x < W + 40 : boss.x > -40) {
      boss.x += dir * sp * DT;
      f += DT;
      if (f >= 0.09) {
        f = 0;
        fire(boss.x, boss.y + 18, Math.PI / 2 + rand(-0.25, 0.25), 95, { c: "#ffd166" });
        if (boss.phase === 3) fire(boss.x, boss.y + 18, Math.PI / 2 + rand(-0.6, 0.6), 70, { c: "#ff8a3d" });
      }
      parts.push({ x: boss.x - dir * 20, y: boss.y - 18 + rand(-2, 2), vx: -dir * 30, vy: 0, life: 0.3, max: 0.3, c: "#ff8a3d", s: 2 });
      yield 0;
    }
  }
  boss.x = W / 2; boss.y = -60; boss.tx = W / 2; boss.ty = 70;
  boss.lock = false;
  yield 1.0;
}

function drawStriker(cx, cy, opts = {}) {
  const hot = opts.phase === 3;
  const white = opts.flash ? "#ffffff" : null;
  const C = {
    out: white || "#12141a",
    steel: white || (hot ? "#8c7a78" : "#7d8799"),
    dark: white || (hot ? "#4a3434" : "#3a404d"),
    hi: white || "#c9d1de",
    acc: white || (hot ? "#ff8a3d" : "#ffd166"),
    visor: white || "#ff3d5a",
    glass: white || "#5fd3ff"
  };
  let ox = Math.round(cx) - 24, oy = Math.round(cy) - 20;
  if (opts.rattle) { ox += Math.round(rand(-1.5, 1.5)); oy += Math.round(rand(-1, 1)); }
  const R = (x, y, w, h, c) => r(ox + x, oy + y, w, h, c);
  const t = opts.t || 0;

  // afterburners (engines face up, the nose points down at the player)
  if (!white) {
    for (const ex of [20, 25]) {
      const fl = 3 + Math.floor(Math.random() * 4);
      R(ex, -fl, 3, fl, "#ff8a3d"); R(ex + 1, -fl + 1, 1, fl - 1, "#ffd166");
    }
  }
  // tail fins
  R(16, 0, 2, 3, C.dark); R(15, 3, 2, 3, C.dark); R(14, 6, 2, 3, C.dark);
  R(30, 0, 2, 3, C.dark); R(31, 3, 2, 3, C.dark); R(32, 6, 2, 3, C.dark);
  // swept wings: tips lean back toward the engines
  for (let i = 0; i < 18; i++) {
    const top = 10 - Math.floor(i / 4), bot = 22 - Math.floor(i * 0.6);
    for (const x of [18 - i, 29 + i]) {
      R(x, top, 1, bot - top, C.out);
      R(x, top + 1, 1, bot - top - 2, i < 3 ? C.dark : C.steel);
      if (i >= 8 && i <= 11) R(x, top + 2, 1, 1, C.acc);
      if (i >= 4 && i <= 14) R(x, top + 1, 1, 1, C.hi);
    }
  }
  // underwing missiles
  for (const mx of [6, 40]) { R(mx, 14, 2, 5, C.hi); R(mx, 19, 2, 1, C.visor); }
  // engines
  R(19, 0, 5, 4, C.out); R(24, 0, 5, 4, C.out);
  R(20, 0, 3, 3, C.dark); R(25, 0, 3, 3, C.dark);
  // fuselage
  R(18, 3, 12, 30, C.out); R(19, 4, 10, 28, C.steel); R(19, 4, 2, 28, C.hi);
  R(17, 11, 2, 7, C.dark); R(29, 11, 2, 7, C.dark);
  // chest core (gatling)
  R(21, 12, 6, 6, C.out);
  const pulse = opts.core > 0 ? (Math.floor(t * 20) % 2 ? "#ffffff" : C.acc) : hot ? "#ff3d5a" : C.glass;
  R(22, 13, 4, 4, white || pulse);
  R(23, 14, 2, 2, white || "#ffffff");
  // canopy face with a scanning visor
  R(20, 21, 8, 9, C.out); R(21, 22, 6, 7, C.glass); R(21, 22, 2, 2, white || "#c8f3ff");
  const lx = clamp(Math.round((opts.lookX || 0) * 0.4) + 2, 0, 4);
  R(21 + lx, 25, 2, 2, C.visor);
  // nose cone
  R(19, 32, 10, 2, C.out); R(20, 32, 8, 1, C.steel);
  R(20, 34, 8, 2, C.out); R(21, 34, 6, 1, C.steel);
  R(21, 36, 6, 2, C.out); R(22, 36, 4, 1, C.acc);
  R(22, 38, 4, 2, C.out); R(23, 38, 2, 1, C.visor);
}


/* ---------- boss roster ---------- */
const BOSSES = [
  {
    id: "gloomeye", name: "GLOOMEYE", tag: "BULLET CURTAIN", hp: 900, stars: 2,
    hit: { w: 21, h: 16, oy: 0 }, contact: { w: 18, h: 14 },
    draw: drawGloomeye,
    pools: {
      1: [gRing, gAimed, gSpiral, gRain],
      2: [gRing, gAimed, gSpiral, gRain, gLaser, gCharge, gBloom],
      3: [gAimed, gSpiral, gLaser, gCharge, gBloom,
          () => parallel(gSpiral(), gAimed()),
          () => parallel(gRain(), gLaser()),
          () => parallel(gRing(), gBloom())]
    }
  },
  {
    id: "striker", name: "STRIKER", tag: "JET FIGHTER ROBOT", hp: 1000, stars: 3,
    hit: { w: 22, h: 18, oy: 0 }, contact: { w: 18, h: 16 },
    draw: drawStriker,
    pools: {
      1: [rRam, rGatling, rStrafe, rMissiles],
      2: [rRam, rGatling, rStrafe, rMissiles, rDive],
      3: [rRam, rDive, rStrafe,
          () => parallel(rStrafe(), rMissiles()),
          () => parallel(rRam(), rMissiles()),
          () => parallel(rGatling(), rMissiles())]
    }
  }
];

/* ---------- state ---------- */
let state = "title", stateT = 0, sel = 0;
let player, boss, bullets = [], pbullets = [], lasers = [], parts = [], warns = [], banner;
let shake = 0, time = 0, newBest = false;
const best = {};
for (const b of BOSSES) {
  try { best[b.id] = parseFloat(localStorage.getItem("gloomeye-best-" + b.id)) || 0; } catch (e) { best[b.id] = 0; }
}

const stars = [];
for (let i = 0; i < 70; i++) {
  const layer = i % 3;
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: 8 + layer * 14, c: ["#2c2338", "#4a3d5e", "#8f86a3"][layer] });
}

function reset(def) {
  player = { x: W / 2, y: H - 40, hp: 5, maxHp: 5, inv: 0, dashT: 0, dashCd: 0, dx: 0, dy: -1, shootT: 0, dead: false };
  boss = {
    def, x: W / 2, y: -40, tx: W / 2, ty: 70, hp: def.hp, maxHp: def.hp, flash: 0, phase: 1,
    inv: 0, lock: true, t: 0, rattle: 0, blink: 0, blinkT: 2, enter: 1.8, runner: null, hitSfx: 0, core: 0, aim: 0, aimT: 0
  };
  bullets = []; pbullets = []; lasers = []; parts = []; warns = [];
  banner = { text: def.name, t: 1.8 };
  time = 0; shake = 0; newBest = false;
  boss.runner = runner(bossBrain());
}
function startBoss(i) {
  sel = i;
  reset(BOSSES[i]);
  state = "play";
  sfx(523, 0.1); sfx(784, 0.2, "square", 0.04);
}

function* bossBrain() {
  let last = null;
  yield 0.6;
  while (true) {
    const pool = boss.def.pools[boss.phase];
    let p;
    do { p = pool[Math.floor(Math.random() * pool.length)]; } while (p === last && pool.length > 1);
    last = p;
    yield* p();
    boss.lock = false;
    boss.tx = rand(36, W - 36); boss.ty = 70;
    yield Math.max(0.35, 0.9 - boss.phase * 0.2);
  }
}
function* phaseShift() {
  boss.inv = 2; boss.lock = false; boss.rattle = 1.4; boss.aimT = 0;
  boss.tx = W / 2; boss.ty = 70;
  bullets.forEach(b => burst(b.x, b.y, b.c, 2, 30));
  bullets.length = 0; lasers.length = 0; warns.length = 0;
  shake = 8;
  banner = { text: "PHASE " + boss.phase, t: 1.8 };
  sfx(90, 0.9, "sawtooth", 0.08, 40); noise(0.5, 0.1);
  yield 1.8;
  yield* bossBrain();
}

/* ---------- update ---------- */
function hurtPlayer() {
  if (player.inv > 0 || player.dashT > 0 || player.dead) return;
  player.hp--;
  player.inv = 1.6;
  shake = 7;
  burst(player.x, player.y, "#5fd3ff", 14, 80);
  sfx(110, 0.3, "square", 0.08, 55); noise(0.2, 0.12);
  bullets = bullets.filter(b => Math.hypot(b.x - player.x, b.y - player.y) > 36);
  if (player.hp <= 0) {
    player.dead = true;
    burst(player.x, player.y, "#ffffff", 30, 120);
    burst(player.x, player.y, "#5fd3ff", 30, 90);
    state = "dying"; stateT = 1.4;
  }
}
function tryDash() {
  if (player.dashCd > 0 || player.dashT > 0) return;
  player.dashT = 0.17; player.dashCd = 0.85;
  sfx(700, 0.12, "triangle", 0.04, 1400);
}

function updatePlayer() {
  let mx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
  let my = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
  if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; player.dx = mx; player.dy = my; }
  if (pressed[" "] || pressed.x || pressed.k || touch.dash) tryDash();
  touch.dash = false;

  if (player.dashT > 0) {
    player.dashT -= DT;
    player.x += player.dx * 270 * DT; player.y += player.dy * 270 * DT;
    parts.push({ x: player.x, y: player.y, vx: 0, vy: 0, life: 0.2, max: 0.2, c: "#2b6cb0", s: 4 });
  } else {
    const sp = keys.shift ? 45 : 95;
    player.x += mx * sp * DT; player.y += my * sp * DT;
  }
  player.x = clamp(player.x, 6, W - 6);
  player.y = clamp(player.y, 24, H - 7);
  player.inv -= DT; player.dashCd -= DT;

  player.shootT -= DT;
  if (player.shootT <= 0 && !player.dead) {
    player.shootT = 0.09;
    pbullets.push({ x: player.x - 3, y: player.y - 5 }, { x: player.x + 3, y: player.y - 5 });
  }
}

function updateBoss() {
  boss.t += DT;
  boss.flash -= DT; boss.inv -= DT; boss.rattle -= DT; boss.hitSfx -= DT; boss.core -= DT;
  boss.blinkT -= DT;
  if (boss.blinkT <= 0) { boss.blink = 0.12; boss.blinkT = rand(1.5, 4); }
  boss.blink -= DT;

  if (boss.enter > 0) {
    boss.enter -= DT;
    boss.y += (70 - boss.y) * Math.min(1, DT * 3);
    if (boss.enter <= 0) boss.lock = false;
  } else {
    stepRunner(boss.runner);
    if (!boss.lock) {
      boss.x += (boss.tx - boss.x) * Math.min(1, DT * 2.2);
      boss.y += (boss.ty + Math.sin(boss.t * 2) * 5 - boss.y) * Math.min(1, DT * 3);
    }
    const ratio = boss.hp / boss.maxHp;
    const ph = ratio > 0.66 ? 1 : ratio > 0.33 ? 2 : 3;
    if (ph > boss.phase) { boss.phase = ph; boss.runner = runner(phaseShift()); }
  }

  const c = boss.def.contact;
  if (!player.dead && Math.abs(player.x - boss.x) < c.w && Math.abs(player.y - boss.y) < c.h) hurtPlayer();
}

function updateBullets() {
  const hb = boss.def.hit;
  for (const b of pbullets) {
    b.y -= 330 * DT;
    if (b.dead) continue;
    if (Math.abs(b.x - boss.x) < hb.w && Math.abs(b.y - boss.y - hb.oy) < hb.h && boss.enter <= 0 && boss.y > 0) {
      b.dead = true;
      if (boss.inv > 0) { burst(b.x, b.y, "#8f86a3", 2, 30); continue; }
      boss.hp -= 1; boss.flash = 0.05;
      if (Math.random() < 0.4) burst(b.x, b.y, "#fff3b0", 2, 50);
      if (boss.hitSfx <= 0) { sfx(900, 0.03, "square", 0.015); boss.hitSfx = 0.07; }
      if (boss.hp <= 0) killBoss();
    }
  }
  pbullets = pbullets.filter(b => !b.dead && b.y > -6);

  for (const b of bullets) {
    b.life += DT;
    if (b.drag && !b.turned) {
      const k = Math.max(0, 1 - b.drag * DT); b.vx *= k; b.vy *= k;
      if (b.life >= b.retarget) {
        b.turned = true;
        const a = Math.atan2(player.y - b.y, player.x - b.x);
        b.vx = Math.cos(a) * b.rsp; b.vy = Math.sin(a) * b.rsp;
      }
    }
    if (b.home && b.life < b.homeT) {
      const sp = Math.hypot(b.vx, b.vy);
      let a = Math.atan2(b.vy, b.vx);
      let d = Math.atan2(player.y - b.y, player.x - b.x) - a;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      a += clamp(d, -b.home * DT, b.home * DT);
      b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
    }
    if (b.trail && Math.random() < 0.5) parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.2, max: 0.2, c: "#6b5a4a", s: 1 });
    b.vy += b.grav * DT;
    b.x += b.vx * DT; b.y += b.vy * DT;
    if (!player.dead && Math.hypot(b.x - player.x, b.y - player.y) < b.r + 1.5) { b.dead = true; hurtPlayer(); }
  }
  bullets = bullets.filter(b => !b.dead && b.x > -10 && b.x < W + 10 && b.y > -30 && b.y < H + 10);

  for (const l of lasers) {
    l.x = boss.x; l.y = boss.y;
    if (l.warn > 0) { l.warn -= DT; if (l.warn <= 0) { shake = Math.max(shake, 4); noise(0.4, 0.06); } continue; }
    l.on -= DT; l.a += l.rot * DT;
    const ca = Math.cos(l.a), sa = Math.sin(l.a);
    const px = player.x - l.x, py = player.y - l.y;
    if (px * ca + py * sa > 0 && Math.abs(-px * sa + py * ca) < l.w / 2 + 1) hurtPlayer();
  }
  lasers = lasers.filter(l => l.warn > 0 || l.on > 0);

  for (const w of warns) { w.t -= DT; if (w.t <= 0 && w.fn) w.fn(); }
  warns = warns.filter(w => w.t > 0);
}

function killBoss() {
  state = "bossdying"; stateT = 2.6;
  bullets.forEach(b => burst(b.x, b.y, b.c, 2, 30));
  bullets = []; lasers = []; warns = [];
  const id = boss.def.id;
  if (!best[id] || time < best[id]) {
    best[id] = time; newBest = true;
    try { localStorage.setItem("gloomeye-best-" + id, String(time)); } catch (e) {}
  }
}

function updateParts() {
  for (const p of parts) { p.life -= DT; p.x += p.vx * DT; p.y += p.vy * DT; p.vx *= 0.94; p.vy *= 0.94; }
  parts = parts.filter(p => p.life > 0);
}
function updateStars(speed = 1) {
  for (const s of stars) { s.y += s.s * DT * speed; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
}

function update() {
  const tap = pressed.tap;
  const start = pressed.enter || pressed[" "] || pressed.z || (tap !== undefined && tap >= 0.3 && tap <= 0.7);
  const back = pressed.escape;
  if (pressed.m) muted = !muted;
  stateT -= DT;
  updateStars(state === "play" ? 1 : 0.4);
  shake = Math.max(0, shake - DT * 20);

  if (state === "title") {
    const n = BOSSES.length;
    if (start) startBoss(sel);
    else if (pressed.arrowleft || pressed.a || (tap !== undefined && tap < 0.3)) { sel = (sel + n - 1) % n; sfx(330, 0.05); }
    else if (pressed.arrowright || pressed.d || (tap !== undefined && tap > 0.7)) { sel = (sel + 1) % n; sfx(330, 0.05); }
  } else if (state === "play") {
    if (pressed.p || back) { state = "pause"; }
    else {
      time += DT;
      if (banner.t > 0) banner.t -= DT;
      updatePlayer(); updateBoss(); updateBullets(); updateParts();
    }
  } else if (state === "pause") {
    if (pressed.p || back || pressed.enter || tap !== undefined) state = "play";
  } else if (state === "dying") {
    updateBoss(); updateBullets(); updateParts();
    if (stateT <= 0) { state = "over"; stateT = 0.6; }
  } else if (state === "bossdying") {
    updateParts();
    boss.flash = 0.03;
    if (Math.random() < 0.35) {
      const x = boss.x + rand(-20, 20), y = boss.y + rand(-16, 16);
      burst(x, y, ["#ff3d5a", "#ffd166", "#ffffff", "#c77dff"][Math.floor(Math.random() * 4)], 12, 90);
      noise(0.12, 0.08); shake = 5;
    }
    if (stateT <= 0) {
      burst(boss.x, boss.y, "#ffffff", 60, 160); burst(boss.x, boss.y, "#ff3d5a", 50, 120);
      sfx(80, 1.2, "sawtooth", 0.1, 30); noise(0.8, 0.2); shake = 14;
      state = "win"; stateT = 1;
    }
  } else if (state === "over" || state === "win") {
    updateParts();
    if (stateT <= 0) {
      if (back) state = "title";
      else if (start || tap !== undefined) {
        if (state === "win") {
          if (sel + 1 < BOSSES.length) startBoss(sel + 1);
          else state = "title";
        } else startBoss(sel);
      }
    }
  }
  for (const k in pressed) delete pressed[k];
}

/* ---------- draw ---------- */
function drawBullet(b) {
  const x = Math.round(b.x), y = Math.round(b.y), s = b.r;
  r(x - s, y - s + 1, s * 2, s * 2 - 2, b.c);
  r(x - s + 1, y - s, s * 2 - 2, s * 2, b.c);
  r(x - 1, y - 1, 2, 2, "#ffffff");
}

function drawStars(tint) {
  for (const s of stars) r(Math.round(s.x), Math.round(s.y), 1, 1, s.c);
  if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
}

function fmt(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 10) % 10);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "." + cs;
}

function drawHUD() {
  shadowText(boss.def.name, 6, 5, "#ece6f6", 1);
  text("PHASE " + boss.phase, W - 6, 5, boss.phase === 3 ? "#ff3d5a" : "#9087a3", 1, "right");
  r(6, 12, W - 12, 6, "#1a0f26");
  r(7, 13, W - 14, 4, "#2c2338");
  const w = Math.max(0, Math.round((W - 14) * boss.hp / boss.maxHp));
  r(7, 13, w, 4, boss.inv > 0 ? "#8f86a3" : boss.phase === 3 ? "#ff1f3d" : "#ff3d5a");
  r(7, 13, w, 1, "#ff9aa9");
  for (const f of [0.66, 0.33]) r(7 + Math.round((W - 14) * f), 12, 1, 6, "#ece6f6");
  for (let i = 0; i < player.maxHp; i++) {
    sprite(HEART, { 1: i < player.hp ? "#ff3d5a" : "#2c2338" }, 6 + i * 9, H - 11);
  }
  const ready = player.dashCd <= 0;
  text("DASH", W - 40, H - 10, ready ? "#5fd3ff" : "#4a3d5e");
  r(W - 23, H - 9, 17, 3, "#2c2338");
  r(W - 23, H - 9, Math.round(17 * (1 - clamp(player.dashCd / 0.85, 0, 1))), 3, ready ? "#5fd3ff" : "#4a3d5e");
  text(fmt(time), W / 2, H - 10, "#9087a3", 1, "center");
  if (muted) text("MUTE", W - 6, 22, "#4a3d5e", 1, "right");
}

function drawWarns() {
  for (const w of warns) {
    const rate = w.locked ? 26 : 14;
    const on = Math.floor(performance.now() / 1000 * rate) % 2 === 0;
    if (w.type === "drop") {
      if (on) { r(Math.round(w.x) - 2, 24, 5, 1, "#5fd3ff"); r(Math.round(w.x) - 1, 25, 3, 1, "#5fd3ff"); r(Math.round(w.x), 26, 1, 1, "#5fd3ff"); }
    } else if (w.type === "lane") {
      ctx.fillStyle = on ? "rgba(255,61,90,0.28)" : "rgba(255,61,90,0.12)";
      ctx.fillRect(Math.round(w.x - w.w / 2), Math.round(boss.y), w.w, H);
    } else if (w.type === "band") {
      ctx.fillStyle = on ? "rgba(255,61,90,0.28)" : "rgba(255,61,90,0.12)";
      ctx.fillRect(0, Math.round(w.y - w.h / 2), W, w.h);
      if (on) { r(0, Math.round(w.y - w.h / 2), W, 1, "#ff3d5a"); r(0, Math.round(w.y + w.h / 2) - 1, W, 1, "#ff3d5a"); }
    } else if (w.type === "circle" || w.type === "shadow") {
      ctx.beginPath();
      ctx.ellipse(Math.round(w.x), Math.round(w.y), w.r, w.type === "shadow" ? w.r * 0.6 : w.r, 0, 0, TAU);
      ctx.fillStyle = w.type === "shadow" ? "rgba(0,0,0,0.55)" : on ? "rgba(255,61,90,0.3)" : "rgba(255,61,90,0.12)";
      ctx.fill();
      if (on) { ctx.strokeStyle = "#ff3d5a"; ctx.lineWidth = 1; ctx.stroke(); }
    }
  }
}

function drawPlay() {
  drawStars(boss.phase === 3 ? "rgba(255,31,61,0.06)" : null);
  drawWarns();

  for (const l of lasers) {
    ctx.save();
    ctx.translate(Math.round(l.x), Math.round(l.y));
    ctx.rotate(l.a);
    if (l.warn > 0) {
      if (Math.floor(l.warn * 16) % 2 === 0) { ctx.fillStyle = "rgba(255,61,90,0.8)"; ctx.fillRect(0, 0, 500, 1); }
    } else {
      const w = l.w * (l.on < 0.1 ? l.on / 0.1 : 1);
      ctx.fillStyle = "#ff3d5a"; ctx.fillRect(0, -w / 2 - 1, 500, w + 2);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, -w / 4, 500, w / 2);
    }
    ctx.restore();
  }
  if (boss.aimT > 0 && Math.floor(boss.aimT * 18) % 2 === 0) {
    ctx.save(); ctx.translate(Math.round(boss.x), Math.round(boss.y)); ctx.rotate(boss.aim);
    ctx.fillStyle = "rgba(255,61,90,0.22)"; ctx.fillRect(0, -16, 500, 32);
    ctx.fillStyle = "rgba(255,61,90,0.85)"; ctx.fillRect(0, -16, 500, 1); ctx.fillRect(0, 15, 500, 1);
    ctx.restore();
  }
  if (state !== "win") {
    const dx = player.x - boss.x, dy = player.y - boss.y, d = Math.hypot(dx, dy) || 1;
    boss.def.draw(boss.x, boss.y, {
      phase: boss.phase, t: boss.t, flash: boss.flash > 0 || (boss.inv > 0 && Math.floor(boss.inv * 10) % 2 === 0),
      rattle: boss.rattle > 0 || state === "bossdying", blink: boss.blink > 0, core: boss.core,
      lookX: Math.round(dx / d * 5), lookY: Math.round(dy / d * 2)
    });
  }

  for (const b of pbullets) { r(Math.round(b.x), Math.round(b.y), 1, 4, "#9ff0ff"); }

  if (!player.dead && !(player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0)) drawPlayer();

  for (const b of bullets) drawBullet(b);
  for (const p of parts) r(Math.round(p.x), Math.round(p.y), p.s, p.s, p.c);

  drawHUD();

  if (banner.t > 0 && Math.floor(banner.t * 6) % 2 === 0) {
    shadowText(banner.text, W / 2, H / 2 - 20, banner.text.startsWith("PHASE") ? "#ff3d5a" : "#ece6f6", 3, "center");
  }
}

function drawPlayer() {
  const cx = Math.round(player.x), cy = Math.round(player.y);
  // soft halo so the ship stands out from the bullets
  ctx.beginPath(); ctx.arc(cx, cy, 10, 0, TAU);
  ctx.fillStyle = "rgba(95,211,255,0.14)"; ctx.fill();
  const px = cx - 5, py = cy - 5;
  for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) sprite(PLAYER, PCOL, px + ox, py + oy, "#03101d");
  PCOL.d = Math.random() < 0.5 ? "#ffb347" : "#ff6a3d";
  sprite(PLAYER, PCOL, px, py, player.dashT > 0 ? "#ffffff" : null);
  if (keys.shift) {
    r(cx - 1, cy - 1, 3, 3, "#ff3d5a");
    r(cx, cy, 1, 1, "#ffffff");
  }
}

function overlay(alpha) { ctx.fillStyle = "rgba(13,11,20," + alpha + ")"; ctx.fillRect(0, 0, W, H); }

function drawTitle(blinkOn) {
  drawStars();
  const t = performance.now() / 1000;
  shadowText("PIXEL BOSS RUSH", W / 2, 22, "#ece6f6", 2, "center");
  text("SELECT BOSS", W / 2, 46, "#9087a3", 1, "center");
  const def = BOSSES[sel];
  const by = 112 + Math.sin(t * 2) * 4;
  def.draw(W / 2, by, { t, lookX: Math.round(Math.sin(t) * 5), lookY: 1, blink: t % 3.5 < 0.12, phase: 1 });
  text("<", 22, by - 6, blinkOn ? "#5fd3ff" : "#4a3d5e", 3);
  text(">", W - 31, by - 6, blinkOn ? "#5fd3ff" : "#4a3d5e", 3);
  shadowText(def.name, W / 2, 162, "#ff3d5a", 3, "center");
  text(def.tag, W / 2, 186, "#ece6f6", 1, "center");
  text("DANGER " + "*".repeat(def.stars), W / 2, 197, "#ffd166", 1, "center");
  text("BOSS " + (sel + 1) + "/" + BOSSES.length, W / 2, 208, "#9087a3", 1, "center");
  if (best[def.id]) text("BEST " + fmt(best[def.id]), W / 2, 219, "#7cffb2", 1, "center");
  if (blinkOn) text("PRESS ENTER OR TAP", W / 2, 246, "#5fd3ff", 1, "center");
  text("MOVE ARROWS/WASD  DASH SPACE", W / 2, 272, "#9087a3", 1, "center");
  text("FOCUS SHIFT  PAUSE P  MUTE M", W / 2, 282, "#9087a3", 1, "center");
  text("FULLSCREEN F", W / 2, 292, "#9087a3", 1, "center");
}

function draw() {
  ctx.save();
  r(0, 0, W, H, "#0d0b14");
  if (shake > 0) ctx.translate(Math.round(rand(-shake, shake) / 2), Math.round(rand(-shake, shake) / 2));
  const blinkOn = Math.floor(performance.now() / 450) % 2 === 0;

  if (state === "title") {
    drawTitle(blinkOn);
  } else {
    drawPlay();
    if (state === "pause") {
      overlay(0.7);
      shadowText("PAUSED", W / 2, H / 2 - 12, "#ece6f6", 3, "center");
      text("P TO RESUME", W / 2, H / 2 + 12, "#9087a3", 1, "center");
    } else if (state === "over") {
      overlay(0.75);
      shadowText("GAME OVER", W / 2, 120, "#ff3d5a", 3, "center");
      text(boss.def.name + " HP " + Math.ceil(boss.hp / boss.maxHp * 100) + "%", W / 2, 150, "#ece6f6", 1, "center");
      text("TIME " + fmt(time), W / 2, 162, "#9087a3", 1, "center");
      if (stateT <= 0) {
        if (blinkOn) text("ENTER OR TAP TO RETRY", W / 2, 200, "#5fd3ff", 1, "center");
        text("ESC: BOSS SELECT", W / 2, 214, "#9087a3", 1, "center");
      }
    } else if (state === "win") {
      overlay(0.55);
      shadowText("VICTORY!", W / 2, 110, "#ffd166", 3, "center");
      text(boss.def.name + " DEFEATED", W / 2, 140, "#ece6f6", 1, "center");
      text("TIME " + fmt(time), W / 2, 156, "#ece6f6", 2, "center");
      text(newBest ? "NEW BEST!" : "BEST " + fmt(best[boss.def.id]), W / 2, 176, newBest ? "#7cffb2" : "#9087a3", 1, "center");
      if (stateT <= 0) {
        const next = sel + 1 < BOSSES.length ? "ENTER: NEXT BOSS " + BOSSES[sel + 1].name : "ENTER: BOSS SELECT";
        if (blinkOn) text(next, W / 2, 210, "#5fd3ff", 1, "center");
        text("ESC: BOSS SELECT", W / 2, 224, "#9087a3", 1, "center");
      }
    }
  }
  ctx.restore();
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  DT = Math.min(0.033, (now - last) / 1000);
  last = now;
  update();
  draw();
  requestAnimationFrame(frame);
}
reset(BOSSES[0]);
state = "title";
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
