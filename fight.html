<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>픽셀 녹아웃</title>
<style>
/* Layout: the 16:9 arena fills the window; the space around it is a dim backdrop. Single dark look by choice. */
:root {
  --void: #06040a;
  --line: #2c2338;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 45%, #1c1024 0%, #0b0711 60%, var(--void) 100%);
  background-color: var(--void);
  display: grid;
  place-items: center;
}
.screen {
  width: min(100vw, 177.78vh);
  width: min(100vw, 177.78dvh);
  aspect-ratio: 16 / 9;
  max-width: 100%;
  background: #000;
  box-shadow: 0 0 0 2px var(--line), 0 0 80px rgba(255, 93, 90, 0.12);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  outline: none;
}
</style>
</head>
<body>
<div class="screen"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="픽셀 녹아웃 격투게임 화면"></canvas></div>

<script>
(() => {
"use strict";
// The game is laid out on a 320x180 pixel grid; the canvas is 4x so Korean text stays sharp.
const W = 320, H = 180, SCALE = 4, G = 162, WL = 12, WR = W - 12, DEG = Math.PI / 180, TAU = Math.PI * 2;
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- 3x5 bitmap font ---------- */
const GLYPHS = {
  "0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001111001111",
  "4":"101101111001001","5":"111100111001111","6":"111100111101111","7":"111001010010010",
  "8":"111101111101111","9":"111101111001111",
  A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",
  E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",
  I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",
  M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",
  Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",
  U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",
  Y:"101101010010010",Z:"111001010100111",
  ":":"000010000010000",".":"000000000000010","!":"010010010000010","-":"000000111000000",
  "/":"001001010100100","%":"101001010100101","<":"001010100010001",">":"100010001010100",
  "*":"000101010101000","+":"000010111010000"," ":"000000000000000","?":"111001011000010",
  ",":"000000000010100","(":"010100100100010",")":"010001001001010","'":"010010000000000",
  "=":"000111000111000","#":"101111101111101"
};
const KFONT = '"Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", "NanumGothic", sans-serif';
const needsFont = s => [...s.toUpperCase()].some(ch => !GLYPHS[ch]);
// ASCII-only strings use the 3x5 pixel font; anything with Korean is drawn with a system font
// centered on the same 5*sc-tall line.
function text(s, x, y, c, sc = 1, align = "left") {
  s = String(s);
  if (needsFont(s)) {
    ctx.font = "bold " + (6.5 * sc) + "px " + KFONT;
    ctx.textBaseline = "middle"; ctx.textAlign = align; ctx.fillStyle = c;
    ctx.fillText(s, x, y + 2.5 * sc + 0.25);
    return;
  }
  s = s.toUpperCase();
  const w = s.length * 4 * sc - sc;
  if (align === "center") x -= Math.floor(w / 2);
  else if (align === "right") x -= w;
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = c;
  for (let i = 0; i < s.length; i++) {
    const g = GLYPHS[s[i]];
    if (!g) continue;
    for (let p = 0; p < 15; p++) {
      if (g[p] === "1") ctx.fillRect(x + i * 4 * sc + (p % 3) * sc, y + Math.floor(p / 3) * sc, sc, sc);
    }
  }
}
function shadowText(s, x, y, c, sc = 1, align = "left") {
  const o = needsFont(String(s)) ? Math.max(0.5, sc * 0.5) : sc;
  text(s, x + o, y + o, "#000", sc, align);
  text(s, x, y, c, sc, align);
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c, g = ctx) {
  g.fillStyle = c;
  cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5);
    g.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
  }
}
// thick pixel line: stamps a w x w square along the segment, so limbs stay crisp
function seg(p, q, w, c, g = ctx) {
  const dx = q[0] - p[0], dy = q[1] - p[1], n = Math.max(1, Math.ceil(Math.hypot(dx, dy)));
  g.fillStyle = c;
  const o = w / 2;
  for (let i = 0; i <= n; i++) g.fillRect(Math.round(p[0] + dx * i / n - o), Math.round(p[1] + dy * i / n - o), w, w);
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(v * k), 0, 255).toString(16).padStart(2, "0");
  return "#" + f((n >> 16) & 255) + f((n >> 8) & 255) + f(n & 255);
}
function srng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- save ---------- */
const SAVE_KEY = "pixelKnockout";
let save = { clears: {}, best: {}, diff: 1, muted: false };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && typeof s === "object") save = Object.assign(save, s);
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- audio ---------- */
let actx = null, master = null, musicBus = null, muted = !!save.muted, noiseBuf = null;
function initAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination);
      musicBus = actx.createGain(); musicBus.gain.value = 0.8; musicBus.connect(master);
    } else if (actx.state === "suspended") actx.resume();
  } catch (e) { actx = null; }
}
function setMuted(m) { muted = m; save.muted = m; persist(); if (master) master.gain.value = m ? 0 : 1; }
function tone(f, t, d, type, v, f2 = 0, dest = master) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(dest); o.start(t); o.stop(t + d + 0.02);
}
function nz(t, d, v, freq, type = "highpass", dest = master) {
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  const s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.frequency.value = freq;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl).connect(g).connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
}
function sfx(fn) { return () => { if (actx) fn(actx.currentTime); }; }
const SND = {
  light: sfx(t => { nz(t, 0.07, 0.3, 900); tone(220, t, 0.07, "square", 0.05, 80); }),
  heavy: sfx(t => { nz(t, 0.16, 0.4, 250); tone(150, t, 0.16, "square", 0.08, 40); }),
  block: sfx(t => { tone(1500, t, 0.05, "square", 0.04, 900); nz(t, 0.05, 0.12, 3000); }),
  whiff: sfx(t => nz(t, 0.06, 0.08, 2500)),
  fire: sfx(t => { tone(260, t, 0.3, "sawtooth", 0.05, 900); nz(t, 0.2, 0.08, 1500); }),
  jump: sfx(t => tone(200, t, 0.1, "triangle", 0.05, 420)),
  land: sfx(t => nz(t, 0.05, 0.12, 200, "lowpass")),
  thud: sfx(t => { nz(t, 0.25, 0.4, 160, "lowpass"); tone(90, t, 0.2, "sine", 0.12, 40); }),
  ko: sfx(t => { tone(520, t, 1.1, "sawtooth", 0.08, 50); nz(t, 0.8, 0.35, 120, "lowpass"); }),
  superOn: sfx(t => { tone(180, t, 0.5, "sawtooth", 0.07, 1800); tone(360, t + 0.05, 0.5, "square", 0.04, 3200); }),
  quake: sfx(t => { nz(t, 0.9, 0.5, 90, "lowpass"); tone(70, t, 0.7, "sawtooth", 0.09, 28); }),
  move: sfx(t => tone(520, t, 0.04, "square", 0.03)),
  select: sfx(t => { tone(660, t, 0.07, "square", 0.04); tone(990, t + 0.07, 0.12, "square", 0.04); }),
  bell: sfx(t => { tone(1320, t, 0.7, "triangle", 0.07); tone(1980, t, 0.5, "sine", 0.03); }),
  fight: sfx(t => { tone(392, t, 0.12, "square", 0.05); tone(523, t + 0.1, 0.12, "square", 0.05); tone(784, t + 0.2, 0.35, "square", 0.05); }),
  tick: sfx(t => tone(880, t, 0.04, "square", 0.025)),
};

/* chiptune: each song is a 4-bar chord loop, bass on 8ths, arpeggio lead, drums */
const SONGS = {
  menu: { bpm: 112, prog: [[57, 0], [53, 1], [48, 1], [55, 1]], arp: [0, 1, 2, 1, 3, 2, 1, 2, 0, 1, 2, 3, 2, 1, 2, -1], lead: "square" },
  s0: { bpm: 138, prog: [[57, 0], [57, 0], [53, 1], [55, 1]], arp: [0, -1, 2, 3, -1, 2, 1, 0, 3, -1, 2, 1, 2, 3, -1, 1], lead: "square" },
  s1: { bpm: 148, prog: [[52, 0], [48, 1], [50, 1], [47, 0]], arp: [0, 2, 3, 2, 0, 2, 3, 1, 0, 2, 3, 2, 1, 2, 3, 2], lead: "sawtooth" },
  s2: { bpm: 158, prog: [[50, 0], [50, 0], [46, 1], [48, 1]], arp: [0, 0, 3, 0, 2, 0, 1, 0, 0, 0, 3, 0, 2, 3, 1, 2], lead: "square" },
  s3: { bpm: 126, prog: [[45, 0], [41, 1], [43, 1], [40, 0]], arp: [3, 2, 1, 0, 3, 2, 1, -1, 3, 2, 3, 1, 2, 0, -1, 1], lead: "triangle" },
  win: { bpm: 120, prog: [[60, 1], [65, 1], [67, 1], [60, 1]], arp: [0, 1, 2, 3, 2, 1, 2, 3, 0, 1, 2, 3, 3, -1, -1, -1], lead: "square" },
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
let song = null, mStep = 0, mNext = 0;
function setSong(name) {
  const s = SONGS[name] || null;
  if (s === song) return;
  song = s; mStep = 0;
  if (actx) mNext = actx.currentTime + 0.08;
}
function musicTick() {
  if (!actx || !song || paused) return;
  if (mNext < actx.currentTime) mNext = actx.currentTime + 0.05;
  const sl = 60 / song.bpm / 4;
  while (mNext < actx.currentTime + 0.15) {
    const st = mStep % 64, s = st % 16, [root, maj] = song.prog[st >> 4], tones = maj ? [0, 4, 7, 12] : [0, 3, 7, 12];
    const t = mNext;
    if (s % 2 === 0) tone(mtof(root - 24 + (s % 4 === 2 ? 12 : 0)), t, sl * 1.7, "triangle", 0.09, 0, musicBus);
    const a = song.arp[s];
    if (a >= 0) tone(mtof(root + 12 + tones[a]), t, sl * 0.9, song.lead, 0.018, 0, musicBus);
    if (s === 0 || s === 8 || s === 10) { tone(150, t, 0.13, "sine", 0.16, 40, musicBus); }
    if (s === 4 || s === 12) nz(t, 0.12, 0.09, 1800, "highpass", musicBus);
    if (s % 2 === 1) nz(t, 0.03, 0.03, 7000, "highpass", musicBus);
    mNext += sl; mStep++;
  }
}

/* ---------- fullscreen ---------- */
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  } catch (e) {}
  cv.focus();
}

/* ---------- input ---------- */
const keys = {}, pressed = {};
const NO_SCROLL = ["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "/", "'", "tab"];
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (kc.wait) { e.preventDefault(); if (!e.repeat) kc.input = k; initAudio(); return; }
  if (scene === "fight" && isBound(k) && !e.ctrlKey && !e.metaKey) e.preventDefault();
  if (NO_SCROLL.includes(k)) e.preventDefault();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  initAudio();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
// mouse buttons and the wheel count as keys ("mouse0".."mouse4", "wheelup", "wheeldown") so they can be bound
// read from pointer events (the canvas cancels them, so no mousedown follows); e.buttons also covers chords
const MOUSE_BITS = [[1, 0], [2, 2], [4, 1], [8, 3], [16, 4]];
function syncMouse(e) {
  if (e.pointerType !== "mouse") return;
  for (const [bit, n] of MOUSE_BITS) {
    const k = "mouse" + n, down = !!(e.buttons & bit);
    if (down && !keys[k]) {
      initAudio();
      if (kc.wait) {
        kc.input = PROFILES[kc.tab][0] === "pad" ? "cancel" : k;
        touch.down = null;  // the click is the new binding, not a tap on the screen
        keys[k] = true;
        continue;
      }
      pressed[k] = true;
    }
    keys[k] = down;
  }
}
for (const t of ["pointerdown", "pointermove", "pointerup"]) addEventListener(t, syncMouse);
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("wheel", e => {
  if (!e.deltaY) return;
  const k = e.deltaY < 0 ? "wheelup" : "wheeldown";
  if (kc.wait) { if (PROFILES[kc.tab][0] !== "pad") kc.input = k; return; }
  pressed[k] = true; keys[k] = true; wheelHeld[k] = 2;
}, { passive: true });
const wheelHeld = {};

// gamepads: polled every step; pads[i].held / .prev hold "pad<n>" buttons and "stick<dir>" directions
let pads = [];
const padState = {};
function pollPads() {
  let list = [];
  try { list = Array.from(navigator.getGamepads ? navigator.getGamepads() : []).filter(g => g && g.connected); } catch (e) {}
  pads = list.map(g => {
    const st = padState[g.index] || (padState[g.index] = { held: {}, prev: {} });
    st.prev = st.held;
    const h = {};
    g.buttons.forEach((b, i) => { if (b && (b.pressed || b.value > 0.5)) h["pad" + i] = true; });
    const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    if (ax < -0.5) h.stickleft = true;
    if (ax > 0.5) h.stickright = true;
    if (ay < -0.5) h.stickup = true;
    if (ay > 0.5) h.stickdown = true;
    st.held = h;
    return st;
  });
}
const padEdge = (st, k) => !!k && !!st.held[k] && !st.prev[k];
const padsAny = (list, ks) => list.some(st => ks.some(k => padEdge(st, k)));
const padBound = k => ACTIONS.some(([a]) => KEYS.pad[a].includes(k));
const padDir = d => ["stick" + d, ...KEYS.pad[d]];
// which pads drive a player: in 2P each pad is one player, otherwise every pad drives 1P
const padsFor = i => mode === "versus" ? (pads[i] ? [pads[i]] : []) : (i === 0 ? pads : []);
// menus: pads act like arrow keys / Enter / Esc (the select screen reads pads per player itself)
function padMenuKeys() {
  for (const st of pads) if (padEdge(st, "pad9") && !(scene === "fight" && padBound("pad9"))) pressed.escape = true;
  if ((scene === "fight" && !paused) || scene === "select" || kc.wait) return;
  const map = { arrowup: padDir("up"), arrowdown: padDir("down"), arrowleft: padDir("left"), arrowright: padDir("right"), enter: ["pad0"], escape: ["pad1"] };
  for (const k in map) if (padsAny(pads, map[k])) pressed[k] = true;
}
addEventListener("gamepadconnected", e => { padToast = { s: "게임패드 연결됨", t: 150 }; });
addEventListener("gamepaddisconnected", e => { padToast = { s: "게임패드 연결 끊김", t: 150 }; });
let padToast = null;
addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  if (scene === "fight" && !paused) { paused = true; pauseSel = 0; }
});
const held = list => list.some(k => keys[k]);
const hit1 = list => list.some(k => pressed[k]);
const kp = (...ks) => hit1(ks);
const M_UP = () => kp("arrowup", "w"), M_DOWN = () => kp("arrowdown", "s");
const M_LEFT = () => kp("arrowleft", "a"), M_RIGHT = () => kp("arrowright", "d");
const M_OK = () => kp("enter", " ", "j", "z");
const M_BACK = () => kp("escape", "backspace", "x");

// touch: left half is a floating stick, right side has buttons; menus use taps
const touch = { on: false, stick: null, sx: 0, sy: 0, dx: 0, dy: 0, btn: {}, tapb: {}, down: null };
let tap = null;
const TBTN = [
  { k: "p", x: 252, y: 156, r: 12, l: "P" },
  { k: "k", x: 278, y: 146, r: 12, l: "K" },
  { k: "s", x: 300, y: 124, r: 12, l: "S" },
  { k: "x", x: 270, y: 116, r: 10, l: "SP" },
];
function gpos(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); initAudio(); cv.focus();
  const [x, y] = gpos(e);
  if (e.pointerType !== "mouse") touch.on = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (scene === "fight" && !paused && touch.on) {
    if (y < 26 && Math.abs(x - W / 2) < 22) { paused = true; pauseSel = 0; return; }
    for (const b of TBTN) {
      if (b.k === "x" && !(F[0] && F[0].meter >= 100)) continue;
      if (Math.hypot(x - b.x, y - b.y) < b.r + 5) { touch.btn[b.k] = e.pointerId; touch.tapb[b.k] = true; return; }
    }
    if (x < W * 0.55) { touch.stick = e.pointerId; touch.sx = x; touch.sy = y; touch.dx = touch.dy = 0; }
    return;
  }
  touch.down = { id: e.pointerId, x, y };
});
cv.addEventListener("pointermove", e => {
  if (touch.stick !== e.pointerId) return;
  const [x, y] = gpos(e);
  touch.dx = clamp(x - touch.sx, -22, 22); touch.dy = clamp(y - touch.sy, -22, 22);
});
function endPointer(e) {
  if (touch.stick === e.pointerId) touch.stick = null;
  for (const k in touch.btn) if (touch.btn[k] === e.pointerId) delete touch.btn[k];
  if (touch.down && touch.down.id === e.pointerId) {
    const [x, y] = gpos(e);
    if (e.type === "pointerup" && Math.hypot(x - touch.down.x, y - touch.down.y) < 10) tap = { x, y };
    touch.down = null;
  }
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
const inR = (p, r) => p && p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h;

const EMPTY = { left: false, right: false, up: false, down: false, p: false, k: false, s: false, x: false };
const BTNS = ["p", "k", "s", "x"];
// key bindings: every action has two slots ("" = empty); edited on the key settings screen and saved
const ACTIONS = [["up", "위 (점프)"], ["down", "아래 (앉기)"], ["left", "왼쪽"], ["right", "오른쪽"], ["p", "펀치"], ["k", "킥"], ["s", "필살기"], ["x", "슈퍼"]];
const DEFAULT_KEYS = {
  solo: { up: ["arrowup", "w"], down: ["arrowdown", "s"], left: ["arrowleft", "a"], right: ["arrowright", "d"], p: ["j", "z"], k: ["k", "x"], s: ["l", "c"], x: ["v", ""] },
  p1: { up: ["w", ""], down: ["s", ""], left: ["a", ""], right: ["d", ""], p: ["f", ""], k: ["g", ""], s: ["h", ""], x: ["t", ""] },
  p2: { up: ["arrowup", ""], down: ["arrowdown", ""], left: ["arrowleft", ""], right: ["arrowright", ""], p: [",", "1"], k: [".", "2"], s: ["/", "3"], x: ["'", "4"] },
  // standard gamepad layout: 0 A, 1 B, 2 X, 3 Y, 5 RB, 12-15 d-pad (the left stick always moves too)
  pad: { up: ["pad12", ""], down: ["pad13", ""], left: ["pad14", ""], right: ["pad15", ""], p: ["pad2", ""], k: ["pad0", ""], s: ["pad1", ""], x: ["pad3", "pad5"] },
};
const PROFILES = [["solo", "1인용"], ["p1", "2인 1P"], ["p2", "2인 2P"], ["pad", "게임패드"]];
function loadKeys() {
  const out = JSON.parse(JSON.stringify(DEFAULT_KEYS)), sk = save.keys;

    case "keys": updKeys(); break;
    case "select": setSong("menu"); updSelect(); break;
    case "vs":
      setSong("s" + stage);
      if (sceneT > 110 || (sceneT > 20 && (M_OK() || tap))) { scene = "fight"; sceneT = 0; }

    case "fight": updFight(); break;
    case "result": updResult(); break;
    case "continue":
